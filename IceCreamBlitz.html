                ctx.font = 'bold 20px "Segoe UI","Tahoma","Arial",sans-serif';
                ctx.fillText('🔄 العب مجدداً', W / 2, restartY + 2);
            }

            // ==================== حلقة اللعبة الرئيسية ====================
            function update() {
                if (gameState !== STATE.PLAYING) {
                    backgroundClouds.forEach(cloud => {
                        cloud.x += cloud.speed;
                        if (cloud.x > W + 120) cloud.x = -120;
                    });
                    // تقليل توهج التتابع تدريجياً
                    if (streakGlowAlpha > 0.01) streakGlowAlpha *= 0.95;
                    return;
                }
                frameCount++;
                difficulty = 1 + Math.floor(score / 80);
                spawnInterval = Math.max(22, 80 - difficulty * 5);
                if (usingKeyboard) {
                    const moveSpeed = 7;
                    if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) targetX -= moveSpeed;
                    if (keysPressed['ArrowRight'] || keysPressed['KeyD']) targetX += moveSpeed;
                }
                targetX = Math.max(40, Math.min(W - 40, targetX));
                playerX += (targetX - playerX) * 0.2;
                if (Math.abs(targetX - playerX) < 0.1) playerX = targetX;
                if (bowlExpressionTimer > 0) {
                    bowlExpressionTimer--;
                    if (bowlExpressionTimer <= 0) bowlExpression = 'normal';
                }
                if (bowlFlashTimer > 0) {
                    bowlFlashTimer--;
                    if (bowlFlashTimer <= 0) bowlFlashColor = null;
                }
                bowlSquish *= 0.8;
                if (Math.abs(bowlSquish) < 0.01) bowlSquish = 0;
                if (streakGlowAlpha > 0.01 && streak < 5) streakGlowAlpha *= 0.9;
                if (shakeAmount > 0.5) {
                    shakeAmount *= shakeDecay;
                } else {
                    shakeAmount = 0;
                }
                spawnTimer++;
                if (spawnTimer >= spawnInterval) {
                    spawnTimer = 0;
                    spawnItem();
                    if (Math.random() < 0.2 && difficulty > 3) spawnItem();
                }
                fallingItems.forEach(item => item.update());
                for (const item of fallingItems) {
                    if (item.caught || !item.alive) continue;
                    const hb = item.getHitbox();
                    if (hb.y >= BOWL_CATCH_ZONE_TOP && hb.y <= BOWL_CATCH_ZONE_BOTTOM) {
                        if (Math.abs(hb.x - playerX) < BOWL_CATCH_HALF_WIDTH + hb.radius * 0.6) {
                            if (item.isGood) onCatchGood(item);
                            else onCatchBad(item);
                        }
                    }
                    if (hb.y > BOWL_CATCH_ZONE_BOTTOM + 20 && !item.caught &&
                        Math.abs(hb.x - playerX) < BOWL_CATCH_HALF_WIDTH + hb.radius) {
                        if (!item.isGood) {
                            floatingTexts.push(new FloatingText(item.x, item.y, '👍 تجنب!', '#6BCB77', 16));
                        }
                    }
                }
                fallingItems = fallingItems.filter(item => item.alive);
                particles.forEach(p => p.update());
                particles = particles.filter(p => p.alive);
                floatingTexts.forEach(ft => ft.update());
                floatingTexts = floatingTexts.filter(ft => ft.alive);
                backgroundClouds.forEach(cloud => {
                    cloud.x += cloud.speed;
                    if (cloud.x > W + 120) cloud.x = -120;
                });
                updateUI();
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                let shakeX = 0;
                let shakeY = 0;
                if (shakeAmount > 0.5) {
                    shakeX = (Math.random() - 0.5) * shakeAmount * 2;
                    shakeY = (Math.random() - 0.5) * shakeAmount * 2;
                }
                ctx.save();
                ctx.translate(shakeX, shakeY);
                if (gameState === STATE.START) {
                    drawStartScreen();
                    ctx.restore();
                    return;
                }
                drawBackground();
                fallingItems.forEach(item => item.draw(ctx));
                particles.forEach(p => p.draw(ctx));
                floatingTexts.forEach(ft => ft.draw(ctx));
                drawBowl();
                if (difficulty <= 2) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([8, 20]);
                    ctx.beginPath();
                    ctx.moveTo(playerX - BOWL_CATCH_HALF_WIDTH - 5, BOWL_CATCH_ZONE_TOP);
                    ctx.lineTo(playerX + BOWL_CATCH_HALF_WIDTH + 5, BOWL_CATCH_ZONE_TOP);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                ctx.restore();
                if (gameState === STATE.OVER) {
                    drawGameOverScreen();
                }
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ==================== معالجة المدخلات ====================
            function getCanvasCoords(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }

            // تهيئة الصوت عند أول تفاعل
            function initAudioOnInteraction() {
                if (!sound.initialized) {
                    sound.init();
                }
                sound.resumeContext();
            }

            window.addEventListener('keydown', (e) => {
                initAudioOnInteraction();
                keysPressed[e.code] = true;
                if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' ||
                    e.code === 'KeyA' || e.code === 'KeyD') {
                    usingKeyboard = true;
                    usingMouseOrTouch = false;
                }
                if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
                    e.preventDefault();
                    if (gameState === STATE.START) restartGame();
                    else if (gameState === STATE.OVER) restartGame();
                }
                if (e.code === 'KeyR' && gameState === STATE.OVER) restartGame();
                if (e.code === 'KeyM') sound.toggleMute();
            });
            window.addEventListener('keyup', (e) => {
                keysPressed[e.code] = false;
                if (!keysPressed['ArrowLeft'] && !keysPressed['ArrowRight'] &&
                    !keysPressed['KeyA'] && !keysPressed['KeyD']) {
                    usingKeyboard = false;
                }
            });
            canvas.addEventListener('mousemove', (e) => {
                initAudioOnInteraction();
                if (gameState !== STATE.PLAYING) return;
                const coords = getCanvasCoords(e.clientX, e.clientY);
                targetX = coords.x;
                usingMouseOrTouch = true;
                usingKeyboard = false;
            });
            canvas.addEventListener('click', (e) => {
                initAudioOnInteraction();
                if (gameState === STATE.START) restartGame();
                else if (gameState === STATE.OVER) restartGame();
            });
            canvas.addEventListener('mouseenter', (e) => {
                initAudioOnInteraction();
                if (gameState === STATE.PLAYING) {
                    const coords = getCanvasCoords(e.clientX, e.clientY);
                    targetX = coords.x;
                    usingMouseOrTouch = true;
                    usingKeyboard = false;
                }
            });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudioOnInteraction();
                if (gameState === STATE.START) restartGame();
                else if (gameState === STATE.OVER) restartGame();
                if (gameState === STATE.PLAYING && e.touches.length > 0) {
                    const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
                    targetX = coords.x;
                    usingMouseOrTouch = true;
                    usingKeyboard = false;
                }
            }, { passive: false });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                initAudioOnInteraction();
                if (gameState === STATE.PLAYING && e.touches.length > 0) {
                    const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
                    targetX = coords.x;
                    usingMouseOrTouch = true;
                    usingKeyboard = false;
                }
            }, { passive: false });
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
            }, { passive: false });

            // زر كتم الصوت
            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                initAudioOnInteraction();
                sound.toggleMute();
            });
            muteBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                initAudioOnInteraction();
                sound.toggleMute();
            });

            // ==================== تهيئة العرض ====================
            function initDisplay() {
                updateUI();
                livesDisplay.textContent = '❤️❤️❤️❤️❤️';
                streakDisplay.textContent = '0';
                scoreDisplay.textContent = '0';
                sound.setMuted(false);
            }

            initDisplay();
            playerX = W / 2;
            targetX = W / 2;
            gameLoop();

            console.log('🍦 لعبة التقاط المثلجات المطوّرة جاهزة!');
            console.log('🔊 الأصوات مفعّلة | اضغط M لكتم الصوت');
            console.log('🍨 أنواع جديدة: سنداي، ساندويتش، رول، قالب مغطس، قوس قزح');
            console.log('🎮 استخدم الأسهم أو الماوس أو اللمس للتحريك');
            console.log('📱 متوافقة مع الجوال والحاسوب');
        })();
    </script>
</body>
</html>
