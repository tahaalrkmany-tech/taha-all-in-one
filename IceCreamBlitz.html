<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🍦 لعبة التقاط المثلجات - Ice Cream Catch</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #1a1a2e 100%);
            background-size: 400% 400%;
            animation: bgShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes bgShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        .game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .game-header {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 16px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
            cursor: default;
        }
        .stat-box:hover {
            transform: translateY(-2px);
        }
        .stat-box .icon {
            font-size: 1.3rem;
        }
        .stat-box .value {
            font-size: 1.2rem;
            color: #ffd700;
            min-width: 32px;
            text-align: center;
        }
        .lives-box .value {
            color: #ff6b6b;
            letter-spacing: 2px;
            font-size: 0.95rem;
        }
        .streak-box .value {
            color: #ff9f43;
        }

        /* زر كتم الصوت */
        .mute-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 11;
            padding: 0;
            line-height: 1;
        }
        .mute-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.08);
        }
        .mute-btn.muted {
            opacity: 0.5;
            border-color: rgba(255, 100, 100, 0.5);
        }

        canvas {
            display: block;
            border-radius: 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 3px rgba(255, 255, 255, 0.1),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            cursor: pointer;
            max-width: 95vw;
            max-height: 78vh;
            width: 500px;
            height: auto;
            aspect-ratio: 500 / 750;
            transition: box-shadow 0.3s;
        }
        canvas:active {
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 3px rgba(255, 200, 100, 0.4),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .instructions {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            text-align: center;
            z-index: 10;
            letter-spacing: 0.3px;
        }
        .instructions span {
            color: #ffd700;
        }

        @media (max-width: 520px) {
            canvas {
                max-width: 98vw;
                max-height: 68vh;
                border-radius: 16px;
            }
            .stat-box {
                padding: 6px 10px;
                font-size: 0.8rem;
                border-radius: 14px;
                gap: 3px;
            }
            .stat-box .icon {
                font-size: 1.1rem;
            }
            .stat-box .value {
                font-size: 0.95rem;
                min-width: 24px;
            }
            .game-header {
                gap: 5px;
            }
            .instructions {
                font-size: 0.7rem;
            }
            .mute-btn {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <div class="stat-box">
                <span class="icon">🍦</span> النقاط:
                <span class="value" id="scoreDisplay">0</span>
            </div>
            <div class="stat-box lives-box">
                <span class="icon">❤️</span> الأرواح:
                <span class="value" id="livesDisplay">❤️❤️❤️❤️❤️</span>
            </div>
            <div class="stat-box streak-box">
                <span class="icon">🔥</span> التتابع:
                <span class="value" id="streakDisplay">0</span>
            </div>
            <button class="mute-btn" id="muteBtn" title="كتم / تشغيل الصوت">🔊</button>
        </div>
        <canvas id="gameCanvas" width="500" height="750"></canvas>
        <div class="instructions">
            ⌨️ <span>الأسهم</span> أو 🖱️ <span>الماوس</span> أو 👆 <span>اللمس</span> للتحريك |
            🍦 التقط المثلجات | ⚠️ تجنب 
          الأشياء الضارة
      <div style="text-align: center; margin-top: 6px; color: rgba(255,255,255,0.5); font-size: 0.75rem; letter-spacing: 1px; z-index: 10;">
    ✨ صمم بواسطة <span style="color: #FFD93D; font-weight: bold;">tahatech2026</span> ✨
</div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== عناصر DOM ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const livesDisplay = document.getElementById('livesDisplay');
            const streakDisplay = document.getElementById('streakDisplay');
            const muteBtn = document.getElementById('muteBtn');

            // ==================== أبعاد اللعبة ====================
            const W = 500;
            const H = 750;
            canvas.width = W;
            canvas.height = H;

            // ==================== مدير الصوت ====================
            class SoundManager {
                constructor() {
                    this.audioCtx = null;
                    this.muted = false;
                    this.initialized = false;
                }

                init() {
                    if (this.initialized) return;
                    try {
                        this.audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                        this.initialized = true;
                    } catch (e) {
                        console.warn('Web Audio API غير مدعومة');
                    }
                }

                resumeContext() {
                    if (this.audioCtx && this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume().catch(() => {});
                    }
                }

                setMuted(val) {
                    this.muted = val;
                    muteBtn.textContent = val ? '🔇' : '🔊';
                    if (val) {
                        muteBtn.classList.add('muted');
                    } else {
                        muteBtn.classList.remove('muted');
                    }
                }
                toggleMute() {
                    this.setMuted(!this.muted);
                }

                _playTone(freq, duration, type = 'sine', vol = 0.12, startTime = 0) {
                    if (this.muted || !this.audioCtx) return;
                    this.resumeContext();
                    const now = this.audioCtx.currentTime + startTime;
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                }

                _playChord(freqs, duration, type = 'sine', vol = 0.08, stagger = 0.04) {
                    freqs.forEach((f, i) => {
                        this._playTone(f, duration, type, vol, i * stagger);
                    });
                }

                playCatch() {
                    // نغمة سعيدة صاعدة
                    this._playChord([523, 659, 784, 1047], 0.35, 'sine', 0.1, 0.05);
                    // إضافة جرس لامع
                    setTimeout(() => {
                        this._playTone(1319, 0.2, 'triangle', 0.06);
                    }, 120);
                }

                playDamage() {
                    // صوت خسارة - طنين منخفض
                    this._playTone(120, 0.4, 'sawtooth', 0.1);
                    this._playTone(100, 0.45, 'square', 0.06);
                    this._playTone(80, 0.5, 'triangle', 0.08);
                }

                playMiss() {
                    // صوت تفويت خفيف
                    this._playTone(300, 0.2, 'sine', 0.05);
                    setTimeout(() => {
                        this._playTone(200, 0.25, 'sine', 0.04);
                    }, 80);
                }

                playStreak() {
                    // لحن انتصار للتتابع
                    const notes = [523, 659, 784, 1047, 1319];
                    notes.forEach((f, i) => {
                        this._playTone(f, 0.25, 'triangle', 0.09, i * 0.06);
                    });
                    setTimeout(() => {
                        this._playChord([1047, 1319, 1568], 0.4, 'sine', 0.1, 0.03);
                    }, 300);
                }

                playGameOver() {
                    // لحن حزين
                    const notes = [440, 415, 349, 330, 262];
                    notes.forEach((f, i) => {
                        this._playTone(f, 0.35, 'triangle', 0.08, i * 0.12);
                    });
                }

                playStart() {
                    // لحن بداية مرح
                    this._playChord([523, 659, 784], 0.3, 'sine', 0.09, 0.04);
                    setTimeout(() => {
                        this._playChord([784, 1047, 1319], 0.4, 'triangle', 0.1, 0.03);
                    }, 180);
                }
            }
            const sound = new SoundManager();

            // ==================== حالات اللعبة ====================
            const STATE = { START: 'start', PLAYING: 'playing', OVER: 'over' };
            let gameState = STATE.START;
            let score = 0;
            let lives = 5;
            let streak = 0;
            let maxStreak = 0;
            let highScore = parseInt(localStorage.getItem('iceCreamHighScore')) || 0;
            let difficulty = 1;
            let spawnTimer = 0;
            let spawnInterval = 80;
            let shakeAmount = 0;
            let shakeDecay = 0.85;
            let frameCount = 0;
            let streakGlowAlpha = 0;

            // ==================== المدخلات ====================
            let targetX = W / 2;
            let playerX = W / 2;
            let keysPressed = {};
            let usingKeyboard = false;
            let usingMouseOrTouch = false;

            // ==================== كائنات اللعبة ====================
            let fallingItems = [];
            let particles = [];
            let floatingTexts = [];
            let backgroundClouds = [];
            let streakParticles = [];

            // ==================== شخصية الوعاء ====================
            const BOWL_Y = 620;
            const BOWL_WIDTH = 110;
            const BOWL_CATCH_ZONE_TOP = BOWL_Y - 45;
            const BOWL_CATCH_ZONE_BOTTOM = BOWL_Y + 15;
            const BOWL_CATCH_HALF_WIDTH = 48;

            let bowlExpression = 'normal';
            let bowlExpressionTimer = 0;
            let bowlSquish = 0;
            let bowlFlashTimer = 0;
            let bowlFlashColor = null;

            // ==================== توليد السحب الخلفية ====================
            function initClouds() {
                backgroundClouds = [];
                for (let i = 0; i < 10; i++) {
                    backgroundClouds.push({
                        x: Math.random() * W,
                        y: 20 + Math.random() * 350,
                        w: 35 + Math.random() * 90,
                        h: 14 + Math.random() * 28,
                        speed: 0.1 + Math.random() * 0.5,
                        opacity: 0.025 + Math.random() * 0.06,
                        parallax: 0.3 + Math.random() * 0.7,
                    });
                }
            }
            initClouds();

            // ==================== دوال الرسم البرمجي للمثلجات ====================

            // رسم مخروط الوافل
            function drawWaffleCone(cx, cy, scale) {
                const s = scale;
                ctx.fillStyle = '#D4A055';
                ctx.beginPath();
                ctx.moveTo(cx - 18 * s, cy - 5 * s);
                ctx.lineTo(cx + 18 * s, cy - 5 * s);
                ctx.lineTo(cx + 2 * s, cy + 30 * s);
                ctx.lineTo(cx - 2 * s, cy + 30 * s);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#B8863C';
                ctx.lineWidth = 1.2 * s;
                ctx.beginPath();
                for (let i = -12; i <= 12; i += 7) {
                    const ly = cy - 5 * s + (i + 12) * (35 * s / 24);
                    const topX = cx - 18 * s + (i + 12) * (36 * s / 24);
                    const botX = cx + (i + 12) * (4 * s / 24);
                    ctx.moveTo(topX, cy - 5 * s);
                    ctx.lineTo(botX, cy + 30 * s);
                }
                for (let i = -12; i <= 12; i += 7) {
                    const ly = cy - 5 * s + (i + 12) * (35 * s / 24);
                    const topX = cx + 18 * s - (i + 12) * (36 * s / 24);
                    const botX = cx - (i + 12) * (4 * s / 24);
                    ctx.moveTo(topX, cy - 5 * s);
                    ctx.lineTo(botX, cy + 30 * s);
                }
                ctx.stroke();
                ctx.fillStyle = '#C4903D';
                ctx.beginPath();
                ctx.ellipse(cx, cy - 4 * s, 20 * s, 6 * s, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // رسم كرة مثلجات
            function drawScoop(cx, cy, radius, color, scale) {
                const r = radius * scale;
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                ctx.beginPath();
                ctx.arc(cx + 2, cy + 3, r, 0, Math.PI * 2);
                ctx.fill();
                const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
                grad.addColorStop(0, lightenColor(color, 40));
                grad.addColorStop(0.5, color);
                grad.addColorStop(1, darkenColor(color, 30));
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.ellipse(cx - r * 0.35, cy - r * 0.35, r * 0.35, r * 0.2, -0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(cx - r * 0.3, cy - r * 0.45, r * 0.12, 0, Math.PI * 2);
                ctx.fill();
            }

            // رسم مثلجات مخروطية (برمجياً)
            function drawConeIceCream(cx, cy, scale, scoopColor) {
                drawWaffleCone(cx, cy + 8, scale);
                drawScoop(cx, cy - 8, 20, scoopColor, scale);
                ctx.fillStyle = '#E74C3C';
                ctx.beginPath();
                ctx.arc(cx - 3, cy - 22, 5 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(cx - 4, cy - 23, 2 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2ECC71';
                ctx.lineWidth = 1.5 * scale;
                ctx.beginPath();
                ctx.moveTo(cx - 3, cy - 26);
                ctx.quadraticCurveTo(cx + 2, cy - 30, cx + 6, cy - 25);
                ctx.stroke();
            }

            // رسم مثلجات مزدوجة (برمجياً)
            function drawDoubleScoop(cx, cy, scale, color1, color2) {
                drawWaffleCone(cx, cy + 14, scale);
                drawScoop(cx, cy - 5, 17, color1, scale);
                drawScoop(cx + 2, cy - 18, 15, color2, scale);
                for (let i = 0; i < 10; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 5 + Math.random() * 18;
                    const sx = cx + Math.cos(angle) * dist;
                    const sy = cy - 5 + Math.sin(angle) * dist;
                    if (sy < cy - 22 && sy > cy - 5 && Math.abs(sx - cx) < 20) {
                        ctx.fillStyle = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF922B'][Math.floor(Math
                            .random() * 5)];
                        ctx.fillRect(sx - 1.5, sy - 3, 3, 6);
                    }
                }
            }

            // رسم المصاصة (برمجياً)
            function drawPopsicle(cx, cy, scale, color) {
                const s = scale;
                ctx.fillStyle = '#D4A574';
                ctx.fillRect(cx - 3 * s, cy + 8 * s, 6 * s, 22 * s);
                ctx.strokeStyle = '#B8875A';
                ctx.lineWidth = 1 * s;
                ctx.strokeRect(cx - 3 * s, cy + 8 * s, 6 * s, 22 * s);
                const grad = ctx.createLinearGradient(cx, cy - 15 * s, cx, cy + 8 * s);
                grad.addColorStop(0, lightenColor(color, 30));
                grad.addColorStop(0.5, color);
                grad.addColorStop(1, darkenColor(color, 20));
                ctx.fillStyle = grad;
                ctx.beginPath();
                const bodyW = 16 * s;
                const bodyH = 28 * s;
                const topY = cy - bodyH / 2;
                const radius = bodyW / 2;
                ctx.moveTo(cx - bodyW / 2, topY + radius);
                ctx.arcTo(cx - bodyW / 2, topY, cx, topY, radius);
                ctx.arcTo(cx + bodyW / 2, topY, cx + bodyW / 2, topY + radius, radius);
                ctx.lineTo(cx + bodyW / 2, cy + 6 * s);
                ctx.arcTo(cx + bodyW / 2, cy + 10 * s, cx, cy + 10 * s, radius * 0.6);
                ctx.arcTo(cx - bodyW / 2, cy + 10 * s, cx - bodyW / 2, cy + 6 * s, radius * 0.6);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.fillRect(cx - bodyW / 2, topY + radius + 4 * s, bodyW, bodyH * 0.35);
                ctx.fillStyle = 'rgba(255,255,255,0.45)';
                ctx.beginPath();
                ctx.ellipse(cx - 4 * s, topY + 6 * s, 5 * s, 3 * s, -0.3, 0, Math.PI * 2);
                ctx.fill();
            }

            // رسم السوفت سيرف (برمجياً)
            function drawSoftServe(cx, cy, scale, color) {
                const s = scale;
                drawWaffleCone(cx, cy + 14, s * 0.85);
                const layers = [
                    { y: cy - 2, w: 16, h: 8 }, { y: cy - 10, w: 19, h: 8 },
                    { y: cy - 18, w: 14, h: 7 }, { y: cy - 24, w: 9, h: 6 },
                ];
                layers.forEach((layer, i) => {
                    const grad = ctx.createLinearGradient(cx, layer.y - layer.h / 2, cx, layer.y + layer.h / 2);
                    grad.addColorStop(0, lightenColor(color, 20 + i * 5));
                    grad.addColorStop(1, color);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(cx, layer.y, layer.w * s, layer.h * s, 0, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.fillStyle = lightenColor(color, 40);
                ctx.beginPath();
                ctx.moveTo(cx, cy - 28);
                ctx.quadraticCurveTo(cx + 3, cy - 22, cx + 1, cy - 19);
                ctx.quadraticCurveTo(cx - 1, cy - 19, cx - 3, cy - 22);
                ctx.closePath();
                ctx.fill();
            }

            // ==================== أنواع المثلجات الجديدة (برمجياً) ====================

            // رسم كأس سنداي
            function drawSundae(cx, cy, scale, scoopColor) {
                const s = scale;
                // كأس زجاجي
                const glassGrad = ctx.createLinearGradient(cx, cy - 20 * s, cx, cy + 15 * s);
                glassGrad.addColorStop(0, 'rgba(220,230,240,0.75)');
                glassGrad.addColorStop(0.5, 'rgba(180,200,220,0.6)');
                glassGrad.addColorStop(1, 'rgba(140,160,180,0.5)');
                ctx.fillStyle = glassGrad;
                ctx.beginPath();
                ctx.moveTo(cx - 15 * s, cy - 18 * s);
                ctx.lineTo(cx + 15 * s, cy - 18 * s);
                ctx.lineTo(cx + 9 * s, cy + 16 * s);
                ctx.lineTo(cx - 9 * s, cy + 16 * s);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1.8 * s;
                ctx.stroke();
                // قاعدة الكأس
                ctx.fillStyle = 'rgba(180,200,220,0.55)';
                ctx.beginPath();
                ctx.ellipse(cx, cy + 16 * s, 10 * s, 3.5 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1.5 * s;
                ctx.stroke();
                // كرات المثلجات
                drawScoop(cx - 3, cy - 10, 13, scoopColor, s);
                drawScoop(cx + 4, cy - 18, 11, lightenColor(scoopColor, 25), s);
                // صوص
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(cx, cy - 16, 8 * s, 3 * s, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#D2691E';
                ctx.beginPath();
                ctx.ellipse(cx + 2, cy - 14, 6 * s, 2 * s, -0.1, 0, Math.PI * 2);
                ctx.fill();
                // كريمة مخفوقة
                ctx.fillStyle = '#FFFEF5';
                ctx.beginPath();
                ctx.arc(cx - 1, cy - 22, 6 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx + 5, cy - 23, 4.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx, cy - 26, 5 * s, 0, Math.PI * 2);
                ctx.fill();
                // كريزة
                ctx.fillStyle = '#DC143C';
                ctx.beginPath();
                ctx.arc(cx, cy - 27, 4.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.beginPath();
                ctx.arc(cx - 1.5, cy - 28.5, 1.8 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            // رسم ساندويتش مثلجات
            function drawIceCreamSandwich(cx, cy, scale, iceColor) {
                const s = scale;
                const w = 20 * s;
                const h = 28 * s;
                // طبقة الويفر العلوية
                ctx.fillStyle = '#5D3A1A';
                ctx.beginPath();
                ctx.roundRect(cx - w, cy - h / 2 - 7 * s, w * 2, 14 * s, 5 * s);
                ctx.fill();
                ctx.fillStyle = '#7B4F2C';
                ctx.beginPath();
                ctx.roundRect(cx - w + 2 * s, cy - h / 2 - 5 * s, w * 2 - 4 * s, 10 * s, 3 * s);
                ctx.fill();
                // نسيج الويفر
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                for (let wx = cx - w + 4 * s; wx < cx + w - 2 * s; wx += 5 * s) {
                    ctx.fillRect(wx, cy - h / 2 - 4 * s, 1.5 * s, 8 * s);
                }
                // طبقة المثلجات الوسطى
                const iceGrad = ctx.createLinearGradient(cx, cy - h / 2 + 2 * s, cx, cy + h / 2 - 2 * s);
                iceGrad.addColorStop(0, lightenColor(iceColor, 20));
                iceGrad.addColorStop(1, iceColor);
                ctx.fillStyle = iceGrad;
                ctx.beginPath();
                ctx.roundRect(cx - w + 1 * s, cy - h / 2 + 7 * s, w * 2 - 2 * s, h - 14 * s, 2 * s);
                ctx.fill();
                // رشات على الجوانب
                for (let i = 0; i < 14; i++) {
                    const sx = cx - w + 3 * s + Math.random() * (w * 2 - 6 * s);
                    const sy = cy - h / 2 + 9 * s + Math.random() * (h - 18 * s);
                    ctx.fillStyle = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF922B', '#E8D5F5'][Math.floor(Math
                        .random() * 6)];
                    ctx.fillRect(sx, sy, 2.5 * s, 4.5 * s);
                }
                // طبقة الويفر السفلية
                ctx.fillStyle = '#5D3A1A';
                ctx.beginPath();
                ctx.roundRect(cx - w, cy + h / 2 - 7 * s, w * 2, 14 * s, 5 * s);
                ctx.fill();
                ctx.fillStyle = '#7B4F2C';
                ctx.beginPath();
                ctx.roundRect(cx - w + 2 * s, cy + h / 2 - 5 * s, w * 2 - 4 * s, 10 * s, 3 * s);
                ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                for (let wx = cx - w + 4 * s; wx < cx + w - 2 * s; wx += 5 * s) {
                    ctx.fillRect(wx, cy + h / 2 - 4 * s, 1.5 * s, 8 * s);
                }
            }

            // رسم مثلجات ملفوفة (رول)
            function drawRolledIceCream(cx, cy, scale, color) {
                const s = scale;
                // قاعدة مسطحة
                ctx.fillStyle = '#F5E6D3';
                ctx.beginPath();
                ctx.ellipse(cx, cy + 8 * s, 22 * s, 6 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#D4C4A8';
                ctx.lineWidth = 1.5 * s;
                ctx.stroke();
                // لفائف المثلجات
                const rolls = [
                    { dx: -10, dy: -2, r: 6.5 }, { dx: -2, dy: -5, r: 7 }, { dx: 7, dy: -3, r: 6 },
                    { dx: -6, dy: -10, r: 5.5 }, { dx: 3, dy: -10, r: 5 },
                ];
                rolls.forEach((roll, i) => {
                    const rx = cx + roll.dx * s;
                    const ry = cy + roll.dy * s;
                    const rr = roll.r * s;
                    const rollGrad = ctx.createRadialGradient(rx - rr * 0.2, ry - rr * 0.2, rr * 0.05, rx, ry,
                        rr);
                    rollGrad.addColorStop(0, lightenColor(color, 30 + i * 3));
                    rollGrad.addColorStop(0.6, color);
                    rollGrad.addColorStop(1, darkenColor(color, 20));
                    ctx.fillStyle = rollGrad;
                    ctx.beginPath();
                    ctx.arc(rx, ry, rr, 0, Math.PI * 2);
                    ctx.fill();
                    // نمط حلزوني
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1 * s;
                    ctx.beginPath();
                    for (let a = 0; a < Math.PI * 2.5; a += 0.3) {
                        const sr = a / (Math.PI * 2.5) * rr * 0.8;
                        const sx = rx + Math.cos(a) * sr;
                        const sy = ry + Math.sin(a) * sr;
                        if (a === 0) ctx.moveTo(sx, sy);
                        else ctx.lineTo(sx, sy);
                    }
                    ctx.stroke();
                });
                // زينة صغيرة
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(cx - 8 * s, cy - 14 * s, 2.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FF6B6B';
                ctx.beginPath();
                ctx.arc(cx + 9 * s, cy - 11 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            // رسم قالب مثلجات مغطس بالشوكولاتة
            function drawChocoDippedBar(cx, cy, scale, iceColor) {
                const s = scale;
                // العصا
                ctx.fillStyle = '#D4A574';
                ctx.fillRect(cx - 3 * s, cy + 10 * s, 6 * s, 20 * s);
                ctx.strokeStyle = '#B8875A';
                ctx.lineWidth = 1 * s;
                ctx.strokeRect(cx - 3 * s, cy + 10 * s, 6 * s, 20 * s);
                // جسم المثلجات
                const bodyW = 17 * s;
                const bodyH = 24 * s;
                const bodyTop = cy - bodyH + 5 * s;
                const bodyGrad = ctx.createLinearGradient(cx, bodyTop, cx, cy + 8 * s);
                bodyGrad.addColorStop(0, lightenColor(iceColor, 25));
                bodyGrad.addColorStop(1, iceColor);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(cx - bodyW, bodyTop, bodyW * 2, bodyH, 6 * s);
                ctx.fill();
                // طبقة الشوكولاتة (النصف العلوي)
                const chocoGrad = ctx.createLinearGradient(cx, bodyTop, cx, cy - 2 * s);
                chocoGrad.addColorStop(0, '#5D3A1A');
                chocoGrad.addColorStop(1, '#3D2010');
                ctx.fillStyle = chocoGrad;
                ctx.beginPath();
                ctx.roundRect(cx - bodyW + 1 * s, bodyTop + 1 * s, bodyW * 2 - 2 * s, bodyH * 0.55, 5 * s);
                ctx.fill();
                // خط تموج الشوكولاتة
                ctx.fillStyle = '#4A2810';
                ctx.beginPath();
                ctx.moveTo(cx - bodyW + 1 * s, cy - 3 * s);
                ctx.quadraticCurveTo(cx - bodyW / 2, cy + 2 * s, cx, cy - 1 * s);
                ctx.quadraticCurveTo(cx + bodyW / 2, cy - 4 * s, cx + bodyW - 1 * s, cy - 2 * s);
                ctx.lineTo(cx + bodyW - 1 * s, cy - 1 * s);
                ctx.quadraticCurveTo(cx + bodyW / 2, cy - 6 * s, cx, cy - 3 * s);
                ctx.quadraticCurveTo(cx - bodyW / 2, cy + 0 * s, cx - bodyW + 1 * s, cy - 1 * s);
                ctx.closePath();
                ctx.fill();
                // لمعان
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.ellipse(cx - 5 * s, bodyTop + 5 * s, 4 * s, 2.5 * s, -0.3, 0, Math.PI * 2);
                ctx.fill();
            }

            // رسم مثلجات قوس قزح (سكوب متعدد الألوان)
            function drawRainbowScoopCone(cx, cy, scale) {
                const s = scale;
                drawWaffleCone(cx, cy + 8, s);
                const colors = ['#FF6B6B', '#FF922B', '#FFD93D', '#6BCB77', '#4D96FF', '#A55EEA'];
                const scoopR = 19 * s;
                // رسم شرائح ملونة
                for (let i = 0; i < colors.length; i++) {
                    const startAngle = (i / colors.length) * Math.PI * 2 - Math.PI / 2;
                    const endAngle = ((i + 1) / colors.length) * Math.PI * 2 - Math.PI / 2;
                    const grad = ctx.createRadialGradient(cx, cy - 9, scoopR * 0.1, cx, cy - 9, scoopR);
                    grad.addColorStop(0, lightenColor(colors[i], 30));
                    grad.addColorStop(1, colors[i]);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - 9);
                    ctx.arc(cx, cy - 9, scoopR, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fill();
                }
                // لمعان
                ctx.fillStyle = 'rgba(255,255,255,0.45)';
                ctx.beginPath();
                ctx.ellipse(cx - 5 * s, cy - 16, 6 * s, 3.5 * s, -0.4, 0, Math.PI * 2);
                ctx.fill();
                // كريزة
                ctx.fillStyle = '#DC143C';
                ctx.beginPath();
                ctx.arc(cx - 2, cy - 23, 4.5 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            // ==================== دوال مساعدة للألوان ====================
            function lightenColor(hex, percent) {
                const num = parseInt(hex.replace('#', ''), 16);
                const amt = Math.round(2.55 * percent);
                const R = Math.min(255, (num >> 16) + amt);
                const G = Math.min(255, ((num >> 8) & 0x00FF00) + amt);
                const B = Math.min(255, (num & 0x0000FF) + amt);
                return `rgb(${R},${G},${B})`;
            }

            function darkenColor(hex, percent) {
                const num = parseInt(hex.replace('#', ''), 16);
                const amt = Math.round(2.55 * percent);
                const R = Math.max(0, (num >> 16) - amt);
                const G = Math.max(0, ((num >> 8) & 0x00FF00) - amt);
                const B = Math.max(0, (num & 0x0000FF) - amt);
                return `rgb(${R},${G},${B})`;
            }

            // رسم كرة شائكة
            function drawSpikyBall(cx, cy, scale) {
                const s = scale;
                const spikes = 10;
                const innerR = 12 * s;
                const outerR = 20 * s;
                ctx.fillStyle = '#5D4E37';
                ctx.beginPath();
                for (let i = 0; i < spikes; i++) {
                    const angle = (i / spikes) * Math.PI * 2 - Math.PI / 2;
                    const nextAngle = ((i + 0.5) / spikes) * Math.PI * 2 - Math.PI / 2;
                    const ix = cx + Math.cos(angle) * outerR;
                    const iy = cy + Math.sin(angle) * outerR;
                    const mx = cx + Math.cos(nextAngle) * innerR;
                    const my = cy + Math.sin(nextAngle) * innerR;
                    if (i === 0) ctx.moveTo(ix, iy);
                    else ctx.lineTo(ix, iy);
                    ctx.lineTo(mx, my);
                }
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#3D2E1E';
                ctx.beginPath();
                ctx.arc(cx, cy, innerR * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(cx - 5 * s, cy - 3 * s, 4 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.arc(cx + 5 * s, cy - 3 * s, 4 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(cx - 4 * s, cy - 2 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.arc(cx + 6 * s, cy - 2 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2 * s;
                ctx.beginPath();
                ctx.moveTo(cx - 9 * s, cy - 9 * s);
                ctx.lineTo(cx - 1 * s, cy - 5 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 9 * s, cy - 9 * s);
                ctx.lineTo(cx + 1 * s, cy - 5 * s);
                ctx.stroke();
            }

            function drawGarbage(cx, cy, scale) {
                const s = scale;
                ctx.fillStyle = '#8B8B83';
                ctx.beginPath();
                ctx.moveTo(cx - 14 * s, cy - 8 * s);
                ctx.quadraticCurveTo(cx - 16 * s, cy + 2 * s, cx - 8 * s, cy + 10 * s);
                ctx.quadraticCurveTo(cx, cy + 14 * s, cx + 10 * s, cy + 8 * s);
                ctx.quadraticCurveTo(cx + 15 * s, cy, cx + 12 * s, cy - 7 * s);
                ctx.quadraticCurveTo(cx + 5 * s, cy - 12 * s, cx - 4 * s, cy - 10 * s);
                ctx.quadraticCurveTo(cx - 10 * s, cy - 14 * s, cx - 14 * s, cy - 8 * s);
                ctx.fill();
                ctx.strokeStyle = '#6B6B63';
                ctx.lineWidth = 2 * s;
                ctx.stroke();
                ctx.strokeStyle = '#6B6B63';
                ctx.lineWidth = 1 * s;
                ctx.beginPath();
                ctx.moveTo(cx - 6 * s, cy - 4 * s);
                ctx.quadraticCurveTo(cx, cy - 2 * s, cx + 4 * s, cy - 3 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - 3 * s, cy + 2 * s);
                ctx.quadraticCurveTo(cx + 2 * s, cy + 5 * s, cx + 7 * s, cy + 1 * s);
                ctx.stroke();
            }

            function drawRock(cx, cy, scale) {
                const s = scale;
                ctx.fillStyle = '#9E9E8E';
                ctx.beginPath();
                ctx.moveTo(cx - 15 * s, cy - 3 * s);
                ctx.lineTo(cx - 10 * s, cy - 12 * s);
                ctx.lineTo(cx + 3 * s, cy - 14 * s);
                ctx.lineTo(cx + 14 * s, cy - 5 * s);
                ctx.lineTo(cx + 12 * s, cy + 8 * s);
                ctx.lineTo(cx - 2 * s, cy + 12 * s);
                ctx.lineTo(cx - 13 * s, cy + 5 * s);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#7E7E70';
                ctx.lineWidth = 2 * s;
                ctx.stroke();
                ctx.fillStyle = '#B0B0A0';
                ctx.beginPath();
                ctx.arc(cx - 2 * s, cy - 4 * s, 6 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#888878';
                ctx.beginPath();
                ctx.arc(cx + 5 * s, cy + 1 * s, 3 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            // ==================== فئة العنصر الساقط ====================
            class FallingItem {
                constructor(type, isGood, x, y, speed, data) {
                    this.type = type;
                    this.isGood = isGood;
                    this.x = x;
                    this.y = y;
                    this.speed = speed;
                    this.data = data;
                    this.rotation = (Math.random() - 0.5) * 0.4;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                    this.scale = 0.85 + Math.random() * 0.3;
                    this.wobble = Math.random() * Math.PI * 2;
                    this.wobbleSpeed = 0.02 + Math.random() * 0.04;
                    this.wobbleAmp = 0.5 + Math.random() * 1.5;
                    this.alive = true;
                    this.caught = false;
                    this.missedSoundPlayed = false;
                }

                update() {
                    if (this.caught) return;
                    this.y += this.speed;
                    this.wobble += this.wobbleSpeed;
                    this.x += Math.sin(this.wobble) * this.wobbleAmp;
                    this.rotation += this.rotationSpeed;
                    if (this.y > H + 50) {
                        this.alive = false;
                        if (this.isGood && !this.caught && !this.missedSoundPlayed) {
                            this.missedSoundPlayed = true;
                            if (streak > 0) {
                                floatingTexts.push(new FloatingText(this.x, H - 20, 'تفويت!', '#FFA502', 18));
                            }
                            sound.playMiss();
                            resetStreak();
                        }
                    }
                }

                draw(ctx) {
                    if (this.caught) return;
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    const s = this.scale;
                    if (this.isGood) {
                        if (this.data.emoji) {
                            ctx.font =
                                `${42 * s}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = 'rgba(0,0,0,0.12)';
                            ctx.fillText(this.data.emoji, 2, 3);
                            ctx.fillStyle = '#fff';
                            ctx.fillText(this.data.emoji, 0, 0);
                            ctx.shadowColor = 'rgba(255,255,200,0.5)';
                            ctx.shadowBlur = 15 * s;
                            ctx.fillText(this.data.emoji, 0, 0);
                            ctx.shadowBlur = 0;
                        } else if (this.data.drawFn) {
                            const drawFn = this.data.drawFn;
                            if (drawFn === 'drawConeIceCream')
                                drawConeIceCream(0, 0, s, this.data.color || '#FF8FA3');
                            else if (drawFn === 'drawDoubleScoop') {
                                const pair = this.data.colorPair || ['#FF8FA3', '#FFF5E1'];
                                drawDoubleScoop(0, 0, s, pair[0], pair[1]);
                            } else if (drawFn === 'drawPopsicle')
                                drawPopsicle(0, 0, s, this.data.color || '#FF4757');
                            else if (drawFn === 'drawSoftServe')
                                drawSoftServe(0, 0, s, this.data.color || '#FFF5E1');
                            else if (drawFn === 'drawSundae')
                                drawSundae(0, 0, s, this.data.color || '#FFB3BA');
                            else if (drawFn === 'drawIceCreamSandwich')
                                drawIceCreamSandwich(0, 0, s, this.data.color || '#FFF5E1');
                            else if (drawFn === 'drawRolledIceCream')
                                drawRolledIceCream(0, 0, s, this.data.color || '#FF8FA3');
                            else if (drawFn === 'drawChocoDippedBar')
                                drawChocoDippedBar(0, 0, s, this.data.color || '#FFF5E1');
                            else if (drawFn === 'drawRainbowScoopCone')
                                drawRainbowScoopCone(0, 0, s);
                        }
                    } else {
                        if (this.data.emoji) {
                            ctx.font =
                                `${40 * s}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(this.data.emoji, 0, 0);
                        } else if (this.data.drawFn) {
                            if (this.data.drawFn === 'drawSpikyBall') drawSpikyBall(0, 0, s);
                            else if (this.data.drawFn === 'drawGarbage') drawGarbage(0, 0, s);
                            else if (this.data.drawFn === 'drawRock') drawRock(0, 0, s);
                        }
                        ctx.strokeStyle = 'rgba(255,60,60,0.35)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 0, 22 * s, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                getHitbox() {
                    return { x: this.x, y: this.y, radius: 22 * this.scale };
                }
            }

            // ==================== فئة الجسيمات ====================
            class Particle {
                constructor(x, y, color, size) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 8;
                    this.vy = (Math.random() - 0.5) * 8 - 3;
                    this.life = 1.0;
                    this.decay = 0.015 + Math.random() * 0.04;
                    this.color = color;
                    this.size = size || (2 + Math.random() * 6);
                    this.gravity = 0.15;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += this.gravity;
                    this.life -= this.decay;
                }
                draw(ctx) {
                    if (this.life <= 0) return;
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
                get alive() { return this.life > 0; }
            }

            // ==================== فئة النص العائم ====================
            class FloatingText {
                constructor(x, y, text, color, size) {
                    this.x = x;
                    this.y = y;
                    this.text = text;
                    this.color = color;
                    this.size = size || 22;
                    this.life = 1.0;
                    this.vy = -2.5;
                    this.decay = 0.025;
                }
                update() {
                    this.y += this.vy;
                    this.vy *= 0.98;
                    this.life -= this.decay;
                }
                draw(ctx) {
                    if (this.life <= 0) return;
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.font = `bold ${this.size}px "Segoe UI","Tahoma","Arial",sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.text, this.x, this.y);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 2;
                    ctx.strokeText(this.text, this.x, this.y);
                    ctx.globalAlpha = 1;
                }
                get alive() { return this.life > 0; }
            }

            // ==================== دالة التوليد ====================
            function spawnItem() {
                const x = 30 + Math.random() * (W - 60);
                const baseSpeed = 1.5 + difficulty * 0.5;
                const speed = baseSpeed + Math.random() * 2;
                const goodChance = Math.max(0.45, 0.8 - difficulty * 0.04);
                const isGood = Math.random() < goodChance;

                if (isGood) {
                    const typeData = GOOD_ICE_CREAM_TYPES[Math.floor(Math.random() * GOOD_ICE_CREAM_TYPES.length)];
                    let data = { ...typeData };
                    if (typeData.colors) {
                        data.color = typeData.colors[Math.floor(Math.random() * typeData.colors.length)];
                    }
                    if (typeData.colorPairs) {
                        data.colorPair = typeData.colorPairs[Math.floor(Math.random() * typeData.colorPairs
                            .length)];
                    }
                    const item = new FallingItem(typeData.name, true, x, -40, speed, data);
                    fallingItems.push(item);
                } else {
                    const typeData = BAD_ITEM_TYPES[Math.floor(Math.random() * BAD_ITEM_TYPES.length)];
                    const item = new FallingItem(typeData.name, false, x, -40, speed * 0.9, { ...typeData });
                    fallingItems.push(item);
                }
            }

            function resetStreak() {
                streak = 0;
                streakGlowAlpha = 0;
                updateUI();
            }

            function incrementStreak() {
                streak++;
                if (streak > maxStreak) maxStreak = streak;
                // تأثير توهج عند التتابع العالي
                if (streak >= 5) streakGlowAlpha = Math.min(1, streakGlowAlpha + 0.15);
                // صوت خاص عند معالم التتابع
                if (streak === 5 || streak === 10 || streak === 15 || streak === 20 || streak === 25) {
                    sound.playStreak();
                    // جسيمات ذهبية خاصة
                    for (let i = 0; i < 25; i++) {
                        const p = new Particle(playerX, BOWL_Y - 20, '#FFD700', 3 + Math.random() * 8);
                        p.vy = -6 - Math.random() * 8;
                        p.vx = (Math.random() - 0.5) * 14;
                        p.gravity = 0.08;
                        p.decay = 0.01 + Math.random() * 0.02;
                        particles.push(p);
                    }
                    floatingTexts.push(new FloatingText(playerX, BOWL_Y - 50,
                        streak >= 20 ? '🌟 مذهل! 🌟' : streak >= 10 ? '🔥 ممتاز!' : '✨ رائع!',
                        '#FFD700', 26 + Math.min(streak, 10)));
                }
                updateUI();
            }

            // ==================== تأثيرات الالتقاط ====================
            function onCatchGood(item) {
                incrementStreak();
                const bonusMultiplier = Math.min(streak, 10);
                const points = item.data.points + Math.floor(streak / 3) * 5;
                score += points;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('iceCreamHighScore', highScore);
                }
                sound.playCatch();
                const colors = item.data.color ? [item.data.color, lightenColor(item.data.color, 30), '#FFD700'] : [
                    '#FFD700', '#FFA502', '#FFF'
                ];
                for (let i = 0; i < 22; i++) {
                    particles.push(new Particle(item.x, item.y, colors[Math.floor(Math.random() * colors.length)],
                        2 + Math.random() * 7));
                }
                let displayText = `+${points}`;
                if (streak >= 5) displayText += ' 🔥';
                if (streak >= 10) displayText += ' ممتاز!';
                floatingTexts.push(new FloatingText(item.x, item.y - 10, displayText, '#FFD700', 20 + Math.min(streak,
                    10)));
                bowlExpression = 'happy';
                bowlExpressionTimer = 40;
                bowlSquish = 0.2;
                bowlFlashColor = 'rgba(255,255,200,0.35)';
                bowlFlashTimer = 25;
                item.caught = true;
                item.alive = false;
                updateUI();
            }

            function onCatchBad(item) {
                lives--;
                resetStreak();
                shakeAmount = 15;
                sound.playDamage();
                bowlExpression = 'shocked';
                bowlExpressionTimer = 50;
                bowlFlashColor = 'rgba(255,50,50,0.55)';
                bowlFlashTimer = 35;
                for (let i = 0; i < 15; i++) {
                    particles.push(new Particle(item.x, item.y,
                        ['#5D4E37', '#3D2E1E', '#8B0000', '#333'][Math.floor(Math.random() * 4)], 3 + Math.random() *
                        6));
                }
                floatingTexts.push(new FloatingText(item.x, item.y - 10, '💔 -1', '#FF4444', 24));
                item.caught = true;
                item.alive = false;
                updateUI();
                if (lives <= 0) {
                    endGame();
                }
            }

            function endGame() {
                gameState = STATE.OVER;
                sound.playGameOver();
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('iceCreamHighScore', highScore);
                }
                updateUI();
            }

            function restartGame() {
                score = 0;
                lives = 5;
                streak = 0;
                maxStreak = 0;
                difficulty = 1;
                spawnTimer = 0;
                spawnInterval = 80;
                fallingItems = [];
                particles = [];
                floatingTexts = [];
                streakParticles = [];
                shakeAmount = 0;
                streakGlowAlpha = 0;
                bowlExpression = 'normal';
                bowlExpressionTimer = 0;
                bowlSquish = 0;
                bowlFlashTimer = 0;
                bowlFlashColor = null;
                playerX = W / 2;
                targetX = W / 2;
                gameState = STATE.PLAYING;
                sound.playStart();
                updateUI();
            }

            function updateUI() {
                scoreDisplay.textContent = score;
                const heartsFull = '❤️'.repeat(Math.max(0, lives));
                const heartsEmpty = '🖤'.repeat(Math.max(0, 5 - lives));
                livesDisplay.textContent = heartsFull + heartsEmpty;
                if (lives <= 0 && gameState === STATE.OVER) {
                    livesDisplay.textContent = '💔💔💔💔💔';
                }
                streakDisplay.textContent = streak;
                if (streak >= 10) streakDisplay.textContent = streak + ' 🔥';
                if (streak >= 20) streakDisplay.textContent = streak + ' 💫';
            }

            // ==================== رسم شخصية الوعاء ====================
            function drawBowl() {
                ctx.save();
                const bx = playerX;
                const by = BOWL_Y;
                const squishY = bowlSquish * 8;
                const squishX = bowlSquish * 6;

                // توهج التتابع حول الوعاء
                if (streakGlowAlpha > 0.02) {
                    const glowGrad = ctx.createRadialGradient(bx, by, 30, bx, by, 80);
                    glowGrad.addColorStop(0, `rgba(255,180,50,${streakGlowAlpha * 0.5})`);
                    glowGrad.addColorStop(0.5, `rgba(255,150,20,${streakGlowAlpha * 0.2})`);
                    glowGrad.addColorStop(1, 'rgba(255,100,0,0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(bx, by, 80, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ظل الوعاء
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(bx, by + 42, 42, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                const topWidth = 44;
                const bottomWidth = 28;
                const bowlHeight = 38;

                if (bowlFlashTimer > 0 && bowlFlashColor) {
                    ctx.fillStyle = bowlFlashColor;
                    ctx.beginPath();
                    ctx.ellipse(bx, by, topWidth + 12, bowlHeight + 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                const bodyGrad = ctx.createLinearGradient(bx, by - bowlHeight / 2, bx, by + bowlHeight / 2);
                bodyGrad.addColorStop(0, '#FFE4C4');
                bodyGrad.addColorStop(0.4, '#F5D5B0');
                bodyGrad.addColorStop(0.7, '#E8C49A');
                bodyGrad.addColorStop(1, '#D4A878');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(bx - topWidth + squishX, by - bowlHeight / 2 + squishY);
                ctx.lineTo(bx + topWidth - squishX, by - bowlHeight / 2 + squishY);
                ctx.lineTo(bx + bottomWidth + squishX * 0.5, by + bowlHeight / 2);
                ctx.lineTo(bx - bottomWidth - squishX * 0.5, by + bowlHeight / 2);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#C4906A';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(bx, by - bowlHeight / 2 + squishY, topWidth - squishX, 9, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#FFECD2';
                ctx.beginPath();
                ctx.ellipse(bx, by - bowlHeight / 2 + squishY, topWidth - squishX - 2, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#E8C49A';
                ctx.strokeStyle = '#C4906A';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(bx - topWidth - 2, by - 4, 10, 14, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.ellipse(bx + topWidth + 2, by - 4, 10, 14, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                const faceY = by - 5;
                const faceX = bx;

                if (bowlExpression === 'happy') {
                    ctx.strokeStyle = '#5D3A1A';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(faceX - 11, faceY - 4, 7, 0, Math.PI, false);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(faceX + 11, faceY - 4, 7, 0, Math.PI, false);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(faceX, faceY + 3, 14, 0.1, Math.PI - 0.1, false);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,150,150,0.5)';
                    ctx.beginPath();
                    ctx.arc(faceX - 18, faceY + 2, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(faceX + 18, faceY + 2, 6, 0, Math.PI * 2);
                    ctx.fill();
                } else if (bowlExpression === 'shocked') {
                    ctx.strokeStyle = '#5D3A1A';
                    ctx.lineWidth = 3;
                    const ex = 11;
                    const ey = -4;
                    ctx.beginPath();
                    ctx.moveTo(faceX - ex - 5, faceY + ey - 5);
                    ctx.lineTo(faceX - ex + 5, faceY + ey + 5);
                    ctx.moveTo(faceX - ex + 5, faceY + ey - 5);
                    ctx.lineTo(faceX - ex - 5, faceY + ey + 5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(faceX + ex - 5, faceY + ey - 5);
                    ctx.lineTo(faceX + ex + 5, faceY + ey + 5);
                    ctx.moveTo(faceX + ex + 5, faceY + ey - 5);
                    ctx.lineTo(faceX + ex - 5, faceY + ey + 5);
                    ctx.stroke();
                    ctx.fillStyle = '#5D3A1A';
                    ctx.beginPath();
                    ctx.ellipse(faceX, faceY + 6, 7, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(faceX - 11, faceY - 3, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.arc(faceX + 11, faceY - 3, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#3D2010';
                    ctx.beginPath();
                    ctx.arc(faceX - 9, faceY - 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.arc(faceX + 13, faceY - 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(faceX - 7, faceY - 4, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.arc(faceX + 15, faceY - 4, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#5D3A1A';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(faceX, faceY + 2, 10, 0.2, Math.PI - 0.2, false);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,160,160,0.35)';
                    ctx.beginPath();
                    ctx.arc(faceX - 17, faceY + 3, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(faceX + 17, faceY + 3, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // ==================== رسم الخلفية ====================
            function drawBackground() {
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                skyGrad.addColorStop(0, '#87CEEB');
                skyGrad.addColorStop(0.5, '#B8E4F0');
                skyGrad.addColorStop(0.85, '#E8F4F8');
                skyGrad.addColorStop(1, '#F0E6D3');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);

                backgroundClouds.forEach(cloud => {
                    cloud.x += cloud.speed;
                    if (cloud.x > W + 120) cloud.x = -120;
                    ctx.fillStyle = `rgba(255,255,255,${cloud.opacity})`;
                    ctx.beginPath();
                    ctx.ellipse(cloud.x, cloud.y, cloud.w, cloud.h, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cloud.x - cloud.w * 0.5, cloud.y + cloud.h * 0.3, cloud.w * 0.6, cloud.h * 0.7, 0, 0,
                        Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cloud.x + cloud.w * 0.4, cloud.y - cloud.h * 0.2, cloud.w * 0.5, cloud.h * 0.6, 0, 0,
                        Math.PI * 2);
                    ctx.fill();
                });

                const groundGrad = ctx.createLinearGradient(0, H - 60, 0, H);
                groundGrad.addColorStop(0, '#E8D5C4');
                groundGrad.addColorStop(0.3, '#DBC8B0');
                groundGrad.addColorStop(1, '#C4A882');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, H - 60, W, 60);
                ctx.strokeStyle = '#C4A882';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, H - 60);
                ctx.lineTo(W, H - 60);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(180,150,120,0.3)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 6; i++) {
                    const ly = H - 55 + i * 9;
                    ctx.beginPath();
                    ctx.moveTo(0, ly);
                    for (let x = 0; x < W; x += 30) {
                        ctx.lineTo(x + 15, ly + (Math.sin(x * 0.1 + i) * 1.5));
                    }
                    ctx.stroke();
                }
            }

            // ==================== شاشة البداية ====================
            function drawStartScreen() {
                drawBackground();
                const titleY = 190;
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.font = 'bold 48px "Segoe UI","Tahoma","Arial",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🍦 التقاط المثلجات 🍦', W / 2 + 3, titleY + 3);
                const titleGrad = ctx.createLinearGradient(W / 2 - 180, titleY, W / 2 + 180, titleY);
                titleGrad.addColorStop(0, '#FF6B6B');
                titleGrad.addColorStop(0.3, '#FFD93D');
                titleGrad.addColorStop(0.6, '#6BCB77');
                titleGrad.addColorStop(1, '#4D96FF');
                ctx.fillStyle = titleGrad;
                ctx.fillText('🍦 التقاط المثلجات 🍦', W / 2, titleY);

                const decorEmojis = ['🍦', '🍨', '🍧', '🧁'];
                decorEmojis.forEach((emoji, i) => {
                    const angle = (i / decorEmojis.length) * Math.PI * 2 + frameCount * 0.02;
                    const dx = Math.cos(angle) * 160;
                    const dy = Math.sin(angle) * 50 + titleY - 10;
                    ctx.font = '36px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(emoji, W / 2 + dx, dy);
                });

                // أنواع المثلجات المعروضة
                const sampleY = 390;
                const samples = [
                    { fn: 'drawConeIceCream', color: '#FF8FA3', x: 80, label: 'مخروط' },
                    { fn: 'drawSundae', color: '#FFB3BA', x: 170, label: 'سنداي' },
                    { fn: 'drawRainbowScoopCone', x: 260, label: 'قوس قزح' },
                    { fn: 'drawRolledIceCream', color: '#B2F2BB', x: 350, label: 'رول' },
                    { fn: 'drawChocoDippedBar', color: '#FFF5E1', x: 430, label: 'مغطس' },
                ];
                samples.forEach(s => {
                    ctx.save();
                    ctx.translate(s.x, sampleY);
                    ctx.scale(0.75, 0.75);
                    if (s.fn === 'drawConeIceCream') drawConeIceCream(0, 0, 1, s.color);
                    else if (s.fn === 'drawSundae') drawSundae(0, 0, 1, s.color);
                    else if (s.fn === 'drawRainbowScoopCone') drawRainbowScoopCone(0, 0, 1);
                    else if (s.fn === 'drawRolledIceCream') drawRolledIceCream(0, 0, 1, s.color);
                    else if (s.fn === 'drawChocoDippedBar') drawChocoDippedBar(0, 0, 1, s.color);
                    ctx.restore();
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 11px "Segoe UI","Tahoma","Arial",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(s.label, s.x, sampleY + 40);
                });

                // وعاء متحرك
                ctx.save();
                const tempBX = W / 2 + Math.sin(frameCount * 0.03) * 50;
                const tbby = 520;
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(tempBX, tbby + 30, 36, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                const bGrad = ctx.createLinearGradient(tempBX, tbby - 16, tempBX, tbby + 16);
                bGrad.addColorStop(0, '#FFE4C4');
                bGrad.addColorStop(1, '#D4A878');
                ctx.fillStyle = bGrad;
                ctx.beginPath();
                ctx.moveTo(tempBX - 36, tbby - 16);
                ctx.lineTo(tempBX + 36, tbby - 16);
                ctx.lineTo(tempBX + 22, tbby + 30);
                ctx.lineTo(tempBX - 22, tbby + 30);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#FFECD2';
                ctx.beginPath();
                ctx.ellipse(tempBX, tbby - 16, 36, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 18px "Segoe UI","Tahoma","Arial",sans-serif';
                ctx.textAlign = 'center';
                const instY = 600;
                ctx.fillText('🕹️ حرّك الوعاء لالتقاط المثلجات!', W / 2, instY);
                ctx.fillText('⚠️ تجنب الأشياء الضارة!', W / 2, instY + 30);

                const btnY = 670;
                const pulse = Math.sin(frameCount * 0.06) * 4;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.roundRect(W / 2 - 130, btnY - 24, 260, 48 + pulse, 28);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(W / 2 - 130, btnY - 24, 260, 48 + pulse, 28);
                ctx.stroke();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 20px "Segoe UI","Tahoma","Arial",sans-serif';
                const tapText = isMobileDevice() ? '👆 المس للبدء' : '⌨️ اضغط SPACE أو 👆 انقر للبدء';
                ctx.fillText(tapText, W / 2, btnY + 2);

                if (highScore > 0) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 15px "Segoe UI","Tahoma","Arial",sans-serif';
                    ctx.fillText(`🏆 أفضل نتيجة: ${highScore}`, W / 2, btnY + 42);
                }
            }

            function isMobileDevice() {
                return /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) ||
                    ('ontouchstart' in window && window.innerWidth < 768);
            }

            // ==================== شاشة النهاية ====================
            function drawGameOverScreen() {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, W, H);
                const panelY = 250;
                ctx.fillStyle = 'rgba(30,30,50,0.9)';
                ctx.beginPath();
                ctx.roundRect(40, panelY - 60, W - 80, 290, 30);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';

                ctx.stroke();

                ctx.strokeStyle = '#FFD700';

                ctx.beginPath();
                ctx.roundRect(W / 2 - 100, restartY - 22, 200, 44 + pulse2, 25);
