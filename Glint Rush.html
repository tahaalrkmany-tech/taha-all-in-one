<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎮</title>
<style>
:root{
  --bg:#070811;
  --fg:#e8f7ff;
  --a:#00f5ff;
  --b:#7a5cff;
  --c:#ff3cac;
  --g1:#0ff;
  --g2:#f0f;
  --g3:#fffa5c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
.ui{position:fixed;inset:0;pointer-events:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
.score{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  left:12px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  font-size:28px;
  text-shadow:0 0 10px var(--g1), 0 0 24px var(--g2);
  mix-blend-mode:screen;
  user-select:none;
}
.btn{
  pointer-events:auto;
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  right:12px;
  width:48px;height:48px;border:0;border-radius:12px;
  background:linear-gradient(135deg,rgba(15,255,255,.18),rgba(255,0,255,.12));
  color:var(--fg);
  box-shadow:0 6px 24px rgba(127,0,255,.25), inset 0 0 24px rgba(0,255,255,.2);
  backdrop-filter:blur(8px);
  font-size:22px;display:grid;place-items:center;
}
.btn:active{transform:scale(.96)}
.overlay{
  position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(1200px 1200px at 50% 50%, rgba(127,0,255,.12), transparent 60%);
  pointer-events:auto;transition:opacity .3s ease;
}
.hidden{opacity:0;pointer-events:none}
.card{
  display:grid;gap:16px;place-items:center;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  padding:24px;border-radius:20px;border:1px solid rgba(255,255,255,.08);
  box-shadow:0 30px 80px rgba(0,0,0,.35), inset 0 0 60px rgba(0,255,255,.08);
}
.big{font-size:40px;font-weight:900;letter-spacing:1px;text-shadow:0 0 14px var(--g1), 0 0 30px var(--g2)}
.row{display:flex;gap:12px}
.bigbtn{
  width:64px;height:64px;border-radius:16px;border:0;
  background:linear-gradient(135deg,rgba(15,255,255,.2),rgba(255,0,255,.12));
  color:var(--fg);font-size:28px;display:grid;place-items:center;
  box-shadow:0 6px 30px rgba(0,255,255,.25), inset 0 0 24px rgba(255,0,255,.2);
}
#tap{
  width:140px;height:140px;border-radius:50%;
  display:grid;place-items:center;font-size:56px;color:var(--fg);
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), rgba(255,255,255,.05));
  box-shadow:0 40px 120px rgba(0,255,255,.25), inset 0 0 60px rgba(127,0,255,.2);
  border:1px solid rgba(255,255,255,.15);
  animation:pulse 1.6s infinite ease-in-out;
}
@keyframes pulse {
  0%{transform:scale(1); box-shadow:0 40px 120px rgba(0,255,255,.25), inset 0 0 60px rgba(127,0,255,.2)}
  50%{transform:scale(1.06); box-shadow:0 55px 150px rgba(255,0,255,.28), inset 0 0 70px rgba(0,255,255,.28)}
  100%{transform:scale(1)}
}
.hint{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);
  opacity:.7;font-size:14px;letter-spacing:.4px
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="score" id="score">0</div>
  <button id="pause" class="btn" aria-label="⏸">⏸</button>

  <div id="intro" class="overlay">
    <div class="card">
      <div id="tap">▶</div>
      <div class="hint">⬅️🖱️ ➕ ☝️📱</div>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <div class="big" id="final">0</div>
      <div class="row">
        <button id="again" class="bigbtn" aria-label="↻">↻</button>
        <button id="start" class="bigbtn" aria-label="▶">▶</button>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const scoreEl = document.getElementById('score');
  const intro = document.getElementById('intro');
  const over = document.getElementById('over');
  const finalEl = document.getElementById('final');
  const againBtn = document.getElementById('again');
  const startBtn = document.getElementById('start');
  const pauseBtn = document.getElementById('pause');

  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=1, t=0, dt=0, lt=0;
  let raf=0, state='idle', paused=false, shake=0, level=0, spawnBias=0;
  const rnd = (a=1,b=0)=>Math.random()*(a-b)+b;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,x)=>a+(b-a)*x;
  const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);

  const keys = new Set();
  const pointer = {x:0,y:0,dx:0,dy:0,down:false};
  let usePointer = false;

  const game = {
    score:0,
    best:0,
    time:0,
    mult:1,
    multTime:0,
    speed:1,
  };

  const player = {
    x:0,y:0,vx:0,vy:0,r:12,baseR:12,speed:620,alive:true,inv:0,trail:[],
    targetX:0,targetY:0,
  };

  const enemies=[], orbs=[], pulses=[], parts=[];
  let audio, master, startedAudio=false;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = Math.floor(innerWidth*DPR);
    H = Math.floor(innerHeight*DPR);
    canvas.width=W; canvas.height=H;
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize, {passive:true}); resize();

  function sfx(freq=440, type='sine', dur=0.08, vol=0.2){
    if(!startedAudio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.02);
  }
  function sfxChord(base=220){
    sfx(base,'sawtooth',0.06,0.12);
    setTimeout(()=>sfx(base*1.25,'square',0.06,0.08),10);
    setTimeout(()=>sfx(base*1.5,'sine',0.08,0.08),16);
  }

  function initAudio(){
    if(startedAudio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audio = new AC();
    master = audio.createGain();
    master.gain.value = 0.5;
    master.connect(audio.destination);
    startedAudio = true;
  }

  function reset(){
    game.score=0; game.time=0; game.mult=1; game.multTime=0;
    game.speed=1; level=0; spawnBias=0;
    enemies.length=0; orbs.length=0; pulses.length=0; parts.length=0;
    player.x=W/DPR/2; player.y=H/DPR/2; player.vx=0; player.vy=0; player.alive=true; player.inv=0; player.r=player.baseR; player.trail.length=0;
    usePointer = false; pointer.down=false;
    scoreEl.textContent='0';
    shake=0; t=0; lt=performance.now();
    spawnOrb();
  }

  function start(){
    initAudio();
    reset();
    state='playing'; paused=false;
    intro.classList.add('hidden');
    over.classList.add('hidden');
    pauseBtn.textContent='⏸';
    if(!raf) loop();
    sfxChord(220+rnd(0,50));
  }

  function gameOver(){
    state='over';
    over.classList.remove('hidden');
    finalEl.textContent=String(game.score);
    game.best = Math.max(game.best, game.score);
    sfx(120,'square',0.25,0.25);
    sfx(90,'sawtooth',0.25,0.18);
  }

  function spawnEnemy(){
    const speed = 120 + level*8 + rnd(0,80);
    const size = rnd(8, 16 + level*0.6);
    const side = Math.floor(rnd(0,4));
    let x,y;
    if(side===0){ x=-size-10; y=rnd(0,innerHeight); }
    else if(side===1){ x=innerWidth+size+10; y=rnd(0,innerHeight); }
    else if(side===2){ x=rnd(0,innerWidth); y=-size-10; }
    else { x=rnd(0,innerWidth); y=innerHeight+size+10; }
    const angle = Math.atan2(player.y - y, player.x - x) + rnd(-0.6,0.6);
    enemies.push({
      x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      r:size, t:0, hue:rnd(0,360), spin:rnd(-2,2), life:20
    });
  }

  function spawnOrb(){
    const x = rnd(40, innerWidth-40);
    const y = rnd(40, innerHeight-40);
    orbs.push({x,y,r:9, t:0, hue:rnd(0,360)});
  }

  function spawnPulse(x,y,col='#0ff',power=1){
    pulses.push({x,y,r:0, a:1, col, power});
  }

  function addParts(x,y,col,count=10,spd=260){
    for(let i=0;i<count;i++){
      const a = rnd(0,Math.PI*2);
      const v = rnd(spd*0.25, spd);
      parts.push({
        x,y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
        life:rnd(.4,1.2), t:0, col,
      });
    }
  }

  function control(dt){
    let ax=0, ay=0;
    if(keys.has('ArrowLeft')||keys.has('a')) ax-=1;
    if(keys.has('ArrowRight')||keys.has('d')) ax+=1;
    if(keys.has('ArrowUp')||keys.has('w')) ay-=1;
    if(keys.has('ArrowDown')||keys.has('s')) ay+=1;

    if(pointer.down){
      usePointer = true;
      const dx = pointer.x - player.x;
      const dy = pointer.y - player.y;
      const len = Math.hypot(dx,dy) || 1;
      ax = dx/len; ay = dy/len;
      const distMul = clamp(len/140, 0.35, 1.6);
      const sp = player.speed * distMul;
      player.vx = lerp(player.vx, ax*sp, 0.14);
      player.vy = lerp(player.vy, ay*sp, 0.14);
    }else if(ax||ay){
      const len = Math.hypot(ax,ay)||1;
      ax/=len; ay/=len;
      player.vx = lerp(player.vx, ax*player.speed, 0.12);
      player.vy = lerp(player.vy, ay*player.speed, 0.12);
    }else{
      player.vx = lerp(player.vx, 0, 0.08);
      player.vy = lerp(player.vy, 0, 0.08);
    }
    player.x += player.vx*dt;
    player.y += player.vy*dt;
    player.x = clamp(player.x, player.r+2, innerWidth - player.r-2);
    player.y = clamp(player.y, player.r+2, innerHeight - player.r-2);

    player.trail.unshift({x:player.x, y:player.y, r:player.r, a:0.8});
    if(player.trail.length>18) player.trail.pop();
    if(player.inv>0) player.inv -= dt;
  }

  function update(dt){
    t += dt; game.time += dt;
    game.speed = 1 + Math.min(1.8, game.time/60);
    level = Math.floor(game.time*0.8);
    spawnBias += dt * (0.6 + level*0.03);
    while(spawnBias>1){ spawnBias-=1; spawnEnemy(); if(Math.random()<0.1) spawnEnemy(); }
    if(Math.random() < 0.002 + Math.min(0.01, game.time/2000)) spawnOrb();

    for(let e of enemies){
      e.t += dt;
      const toP = Math.atan2(player.y - e.y, player.x - e.x);
      const spd = Math.hypot(e.vx,e.vy);
      const desired = toP + Math.sin(t*1.5 + e.hue)*0.25;
      e.vx = lerp(e.vx, Math.cos(desired)*spd, 0.04*game.speed);
      e.vy = lerp(e.vy, Math.sin(desired)*spd, 0.04*game.speed);
      e.x += e.vx*dt*game.speed;
      e.y += e.vy*dt*game.speed;
      if(e.x<-120||e.y<-120||e.x>innerWidth+120||e.y>innerHeight+120) e.life-=dt;
    }
    for(let i=enemies.length-1;i>=0;i--){ if(enemies[i].life<=0) enemies.splice(i,1); }

    for(let o of orbs){ o.t += dt; }
    for(let i=orbs.length-1;i>=0;i--){
      const o = orbs[i];
      if(dist(player.x,player.y,o.x,o.y) < player.r + o.r + 2){
        orbs.splice(i,1);
        const add = 10 * game.mult;
        game.score += add;
        scoreEl.textContent = String(game.score);
        game.mult = clamp(game.mult+0.1, 1, 6);
        game.multTime = 2.2;
        spawnPulse(o.x,o.y,'#0ff',1.2);
        addParts(o.x,o.y,'#00ffff',14,300);
        sfx(880,'sine',0.06,0.18);
        sfx(1320,'triangle',0.06,0.14);
      }
    }

    for(let i=pulses.length-1;i>=0;i--){
      const p = pulses[i]; p.r += (420 * p.power) * dt; p.a -= dt*0.9;
      if(p.a<=0) pulses.splice(i,1);
    }

    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      for(let p of pulses){
        const d = dist(e.x,e.y,p.x,p.y);
        if(d < p.r + e.r){
          const ang = Math.atan2(e.y-p.x, e.x-p.x);
          e.vx += Math.cos(ang)*80*p.power; e.vy += Math.sin(ang)*80*p.power;
          e.life -= dt*3*p.power;
        }
      }
    }

    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i]; p.t += dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx*=Math.pow(0.9, dt*60); p.vy*=Math.pow(0.9, dt*60);
      if(p.t>p.life) parts.splice(i,1);
    }

    if(game.multTime>0){ game.multTime-=dt; if(game.multTime<=0) game.mult = Math.max(1, Math.floor(game.mult-0.4)); }

    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      if(player.inv>0) continue;
      const d = dist(player.x,player.y,e.x,e.y);
      if(d < player.r + e.r){
        shake = 16;
        player.inv = 1.2;
        player.r = player.baseR*0.7;
        setTimeout(()=>player.r=player.baseR,220);
        spawnPulse(player.x,player.y,'#ff3c7e',1.3);
        addParts(player.x,player.y,'#ff3c7e',22,380);
        sfx(180,'square',0.14,0.22);
        sfx(120,'sawtooth',0.2,0.18);
        if(state==='playing') gameOver();
        break;
      }
    }
  }

  function bgGradient(time){
    const g = ctx.createLinearGradient(0,0,innerWidth,innerHeight);
    const a = (Math.sin(time*0.2)+1)/2;
    g.addColorStop(0, `rgba(0, 255, 255, ${0.06 + a*0.06})`);
    g.addColorStop(1, `rgba(255, 0, 255, ${0.06 + (1-a)*0.06})`);
    return g;
  }

  function draw(){
    const ox = (Math.random()-0.5)*(shake>0?shake:0);
    const oy = (Math.random()-0.5)*(shake>0?shake:0);
    if(shake>0) shake = Math.max(0, shake - 0.9);

    ctx.save();
    ctx.translate(ox, oy);

    ctx.fillStyle = bgGradient(t);
    ctx.fillRect(0,0,innerWidth,innerHeight);

    const bgGlow = ctx.createRadialGradient(player.x,player.y,10, player.x,player.y, 400);
    bgGlow.addColorStop(0, 'rgba(0,255,255,.08)');
    bgGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bgGlow;
    ctx.fillRect(0,0,innerWidth,innerHeight);

    for(let i=player.trail.length-1;i>=0;i--){
      const tr = player.trail[i];
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=`rgba(0,255,255,${0.04 + i/player.trail.length*0.08})`;
      ctx.beginPath();
      ctx.arc(tr.x,tr.y,tr.r + i*0.2,0,Math.PI*2);
      ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }

    for(let p of pulses){
      const grd = ctx.createRadialGradient(p.x,p.y,Math.max(1,p.r-40), p.x,p.y, p.r+40);
      grd.addColorStop(0, 'rgba(255,255,255,0)');
      grd.addColorStop(0.6, p.col.replace(')', ', 0.28)').replace('#','rgba('));
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r+60,0,Math.PI*2);
      ctx.fill();
    }

    for(let o of orbs){
      const r = o.r + Math.sin(o.t*6)*1.2;
      ctx.shadowBlur=20; ctx.shadowColor='#0ff';
      const g = ctx.createRadialGradient(o.x-2,o.y-2,2,o.x,o.y,r+16);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(1, 'rgba(0,255,255,0.2)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(o.x,o.y,r,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }

    for(let e of enemies){
      ctx.save();
      ctx.translate(e.x,e.y);
      ctx.rotate(e.t*e.spin*0.8);
      ctx.shadowBlur=18; ctx.shadowColor='rgba(255,0,127,.8)';
      ctx.fillStyle='rgba(255,60,126,.9)';
      ctx.beginPath();
      const r=e.r;
      ctx.moveTo(r,0);
      for(let a=0;a<Math.PI*2;a+=Math.PI/3){
        ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur=0;
      ctx.restore();
    }

    for(let p of parts){
      const a = 1 - (p.t/p.life);
      ctx.fillStyle = p.col.replace('#','rgba(').replace('ff','') || 'rgba(255,255,255,1)';
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.shadowBlur = 24; ctx.shadowColor='#0ff';
    const grad = ctx.createRadialGradient(player.x-4,player.y-4,2, player.x,player.y, player.r+22);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(1,'rgba(0,255,255,.25)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    ctx.restore();
  }

  function loop(){
    raf = requestAnimationFrame(loop);
    const now = performance.now();
    dt = Math.min(0.033, (now - lt)/1000);
    lt = now;

    if(state==='playing' && !paused){
      control(dt);
      update(dt);
    }
    draw();
  }

  addEventListener('keydown', e=>{
    if(e.repeat) return;
    keys.add(e.key);
    if(state==='idle'){ start(); }
    if(e.key===' '){
      e.preventDefault();
      if(state==='playing'){ paused = !paused; pauseBtn.textContent = paused?'▶':'⏸'; sfx(500,'sine',0.06,0.12); }
    }
    if(e.key==='Enter' && state==='over'){ start(); }
  });
  addEventListener('keyup', e=>keys.delete(e.key));

  function setPointer(e, down){
    const rect = canvas.getBoundingClientRect();
    let x,y;
    if(e.touches && e.touches[0]){ x=e.touches[0].clientX; y=e.touches[0].clientY; }
    else { x=e.clientX; y=e.clientY; }
    pointer.x = clamp((x - rect.left), 0, rect.width);
    pointer.y = clamp((y - rect.top), 0, rect.height);
    pointer.down = down ?? pointer.down;
  }
  canvas.addEventListener('pointerdown', (e)=>{ setPointer(e,true); if(state!=='playing') start(); });
  canvas.addEventListener('pointermove', (e)=> setPointer(e));
  addEventListener('pointerup', ()=> pointer.down=false);
  canvas.addEventListener('touchstart', (e)=>{ setPointer(e,true); if(state!=='playing') start(); }, {passive:true});
  canvas.addEventListener('touchmove', (e)=> setPointer(e), {passive:true});
  addEventListener('touchend', ()=> pointer.down=false);

  document.getElementById('tap').addEventListener('click', ()=> start());
  againBtn.addEventListener('click', ()=> start());
  startBtn.addEventListener('click', ()=> start());
  pauseBtn.addEventListener('click', ()=>{
    if(state!=='playing') return;
    paused=!paused; pauseBtn.textContent = paused?'▶':'⏸';
    sfx(500,'triangle',0.06,0.12);
  });

  const vis = ()=>{ if(document.hidden) { paused=true; pauseBtn.textContent='▶'; } };
  document.addEventListener('visibilitychange', vis);

  loop();
})();
</script>
</body>
</html>
