<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لعبة الديناصور - شاشة بداية بتصميم شاطئ وديناصور كبير</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      direction: rtl;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    /* شاشة البداية والفشل تغطي كامل الشاشة */
    #startScreen,
    #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    #startScreen h1,
    #gameOverScreen h2 {
      margin-bottom: 20px;
    }
    .btn {
      margin: 10px;
      padding: 15px 30px;
      background-color: #4CAF50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 20px;
      color: white;
    }
    .btn:hover {
      background-color: #45a049;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }
    .modal-content {
      background: #444;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .modal-content button {
      margin: 5px;
      font-size: 30px;
      padding: 10px 20px;
      background: #666;
      border: none;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- Canvas (خلفية اللعبة) ستُستخدم في الوضعين: شاشة البداية ولعبة اللعب -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- شاشة البداية التي تحتوي على الأزرار -->
    <div id="startScreen">
      <h1>لعبة الديناصور المطورة</h1>
      <button id="startBtn" class="btn">ابدأ</button>
      <button id="selectDinoBtn" class="btn">اختر ديناصور</button>
      <button id="selectBgBtn" class="btn">اختر خلفية</button>
    </div>
    
    <!-- شاشة الفشل -->
    <div id="gameOverScreen" style="display: none;">
      <h2>فشلت! :(</h2>
      <p id="scoreDisplay"></p>
      <button id="retryBtn" class="btn">إعادة محاولة</button>
    </div>
  </div>
  
  <!-- نوافذ الاختيار -->
  <div id="dinoModal" class="modal-overlay">
    <div class="modal-content">
      <h3>اختر ديناصور</h3>
      <button class="dinoOption" data-dino="🦕">🦕</button>
      <button class="dinoOption" data-dino="🦖">🦖</button>
      <br>
      <button id="closeDinoModal" class="btn">إغلاق</button>
    </div>
  </div>
  
  <div id="bgModal" class="modal-overlay">
    <div class="modal-content">
      <h3>اختر خلفية</h3>
      <button class="bgOption" data-bg="🏖">🏖</button>
      <button class="bgOption" data-bg="🏕">🏕</button>
      <button class="bgOption" data-bg="🏜">🏜</button>
      <button class="bgOption" data-bg="🌋">🌋</button>
      <button class="bgOption" data-bg="🌇">🌇</button>
      <br>
      <button id="closeBgModal" class="btn">إغلاق</button>
    </div>
  </div>
  
  <script>
    // نتأكد من عدم إعادة تعريف متغير واحد مرتين
    let walkCycle = 0;
    
    // تعريف خريطة ألوان الأرض
    const groundColors = {
      "🏖": "#F4A460",
      "🏕": "#8B4513",
      "🏜": "#EDC9AF",
      "🌋": "#800000",
      "🌇": "#708090"
    };
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const dinoModal = document.getElementById('dinoModal');
    const bgModal = document.getElementById('bgModal');
    
    let selectedDino = '🦕';
    let selectedBg = '🏖'; // قد تختار لاحقًا الخلفية الأخرى
    let gameRunning = false;
    let score = 0;
    let highScore = localStorage.getItem('highScore') || 0;
    
    let bgOffset = 0;
    const bgSpeed = 2;
    let groundHeight = Math.floor(window.innerHeight * 0.1);
    
    // كائن الديناصور (الخاصة بلعبة اللعب)
    const dino = {
      x: 50,
      y: window.innerHeight - 100 - groundHeight,
      width: 80,
      height: 80,
      velocityY: 0,
      jumpForce: -20,
      gravity: 0.7,
      grounded: false,
      jumpCount: 0,
      maxJump: 2,
      emoji: selectedDino,
      draw: function() {
        ctx.save();
        // إضافة تأثير اهتزاز بسيط لمحاكاة المشي
        const offsetY = this.grounded ? Math.sin(walkCycle) * 3 : 0;
        ctx.translate(this.x + this.width/2, this.y + this.height/2 + offsetY);
        ctx.scale(-1, 1);
        ctx.font = this.height + "px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.emoji, 0, 0);
        ctx.restore();
      },
      update: function() {
        this.velocityY += this.gravity;
        this.y += this.velocityY;
        if (this.y + this.height >= canvas.height - groundHeight) {
          this.y = canvas.height - this.height - groundHeight;
          this.velocityY = 0;
          this.grounded = true;
          this.jumpCount = 0;
        } else {
          this.grounded = false;
        }
      },
      jump: function() {
        if (this.grounded || this.jumpCount < this.maxJump) {
          this.velocityY = this.jumpForce;
          this.jumpCount++;
          this.grounded = false;
        }
      }
    };
    
    function resizeGame() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      groundHeight = Math.floor(canvas.height * 0.1);
      if (!gameRunning) {
        dino.y = canvas.height - dino.height - groundHeight;
      }
    }
    window.addEventListener('resize', resizeGame);
    resizeGame();
    
    // دالة رسم خلفية شاشة البداية (تصميم خاص)
    function drawStartScreenBackground() {
      // المشهد هنا: شاطئ
      const horizonY = canvas.height * 0.6; // خط أفق منخفض قليلاً
      // رسم السماء بتدرج أزرق
      let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, "#87CEEB");
      skyGrad.addColorStop(1, "#B0E0E6");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, horizonY);
      
      // رسم شمس صغيرة في الزاوية
      let sunX = canvas.width * 0.85, sunY = canvas.height * 0.2, sunRadius = 40;
      let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
      sunGrad.addColorStop(0, "rgba(255,255,0,1)");
      sunGrad.addColorStop(1, "rgba(255,255,0,0)");
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
      ctx.fill();
      
      // رسم الرمل (الشاطئ)
      ctx.fillStyle = "#F4A460";
      ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);
      
      // رسم أمواج بسيطة على الشاطئ
      ctx.strokeStyle = "#ADD8E6";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x < canvas.width; x += 5) {
        let y = horizonY + Math.sin(x*0.05 + bgOffset)*5;
        if(x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      
      // رسم ديناصور كبير على الشاطئ (كخلفية خاصة لشاشة البداية)
      // سنختار حجم كبير جدًا ليكون عرض الديناصور 40% من ارتفاع الشاشة
      let dinoSize = canvas.height * 0.4;
      ctx.font = dinoSize + "px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      // موضع الديناصور: منتصف الشاشة أفقياً، وموقعه على الشاطئ بحيث يكون فوق الرمل
      let dinoX = canvas.width / 2;
      let dinoY = horizonY + (canvas.height - horizonY) * 0.5;
      // هنا نرسم الديناصور باستخدام إيموجي "🦖"
      ctx.fillText("🦖", dinoX, dinoY);
    }
    
    // دالة لتحديث تأثير المشي (اهتزاز بسيط) للديناصور في وضع اللعب
    function updateWalkCycle() {
      if(dino.grounded) {
        walkCycle += 0.2;
      }
    }
    
    // كائن النيزك (الشهابي) خاص بثيمة البركان
    let meteor = {
      x: canvas.width * 0.8,
      y: 0,
      speed: 4,
      angle: Math.PI / 4, // 45 درجة
      emoji: "☄️",
      update: function() {
        this.x -= this.speed * Math.cos(this.angle);
        this.y += this.speed * Math.sin(this.angle);
        if(this.x < 0 || this.y > canvas.height) {
          this.x = canvas.width;
          this.y = 0;
        }
      },
      draw: function() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.emoji, 0, 0);
        ctx.restore();
      }
    };

    // دالة رسم الخلفية الخاصة بوضع اللعب (باقي الثيمات)
    function drawThemedBackground() {
      switch(selectedBg) {
        case "🏖":
          {
            const horizonY = canvas.height * 0.4;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#87CEEB");
            skyGrad.addColorStop(1, "#B0E0E6");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            ctx.beginPath();
            ctx.arc(canvas.width*0.2 + bgOffset, horizonY, 20, Math.PI, 2*Math.PI);
            ctx.fill();
            const sunX = canvas.width * 0.8, sunY = canvas.height * 0.2, sunRadius = 50;
            let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
            sunGrad.addColorStop(0, "rgba(255,255,0,1)");
            sunGrad.addColorStop(1, "rgba(255,255,0,0)");
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#F4A460";
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - groundHeight - horizonY);
          }
          break;
        case "🏕":
          {
            const horizonY = canvas.height * 0.5;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#87CEFA");
            skyGrad.addColorStop(1, "#4682B4");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            const sunX = canvas.width * 0.8, sunY = canvas.height * 0.25, sunRadius = 40;
            let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
            sunGrad.addColorStop(0, "rgba(255,215,0,1)");
            sunGrad.addColorStop(1, "rgba(255,215,0,0)");
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - groundHeight - horizonY);
          }
          break;
        case "🏜":
          {
            const horizonY = canvas.height * 0.4;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#87CEEB");
            skyGrad.addColorStop(1, "#B0E0E6");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            const sunX = canvas.width * 0.5, sunY = canvas.height * 0.2, sunRadius = 60;
            let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
            sunGrad.addColorStop(0, "rgba(255,255,0,1)");
            sunGrad.addColorStop(1, "rgba(255,255,0,0)");
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#EDC9AF";
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - groundHeight - horizonY);
            ctx.fillStyle = "#EDC9AF";
            for (let x = 0; x < canvas.width; x += 100) {
              ctx.beginPath();
              ctx.ellipse(x, canvas.height - groundHeight - 20, 60, 20, 0, 0, Math.PI*2);
              ctx.fill();
            }
          }
          break;
        case "🌋":
          {
            const horizonY = canvas.height - groundHeight;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#8B0000");
            skyGrad.addColorStop(1, "#000000");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.moveTo(canvas.width*0.5 - 50, horizonY);
            ctx.lineTo(canvas.width*0.5, horizonY - 100);
            ctx.lineTo(canvas.width*0.5 + 50, horizonY);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#FF4500";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width*0.5, horizonY - 100);
            for (let t = 0; t < 100; t += 10) {
              ctx.lineTo(canvas.width*0.5 + Math.sin((t+bgOffset)*0.2)*20, horizonY - 100 + t);
            }
            ctx.stroke();
          }
          break;
        case "🌇":
          {
            // المدينة: رسم السماء خلف الأبنية كخلفية ثابتة
            const horizonY = canvas.height * 0.6;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#87CEEB");
            skyGrad.addColorStop(1, "#B0E0E6");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            // استعادة الأبنية كما كانت النسخة الأولى
            if (!window.cityBuildings) {
              window.cityBuildings = [];
              const buildingColors = ["#FF6347", "#FFD700", "#00FA9A", "#1E90FF", "#FF69B4"];
              let x = 0;
              while (x < canvas.width) {
                let bWidth = 50 + Math.random() * 50;
                let availableHeight = canvas.height - horizonY;
                let bHeight = (0.4 + Math.random() * 0.6) * availableHeight;
                let bX = x;
                let bY = horizonY - bHeight; // قاعدة الأبنية
                let color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                window.cityBuildings.push({x: bX, y: bY, width: bWidth, height: bHeight, color: color});
                x += bWidth + 20;
              }
            }
            window.cityBuildings.forEach(b => {
              ctx.fillStyle = b.color;
              ctx.fillRect(b.x, b.y, b.width, b.height);
              ctx.fillStyle = "rgba(255,255,255,0.8)";
              let winW = 8, winH = 8, gapX = 5, gapY = 5;
              for(let wy = b.y + gapY; wy < b.y + b.height - gapY - winH; wy += winH + gapY) {
                for(let wx = b.x + gapX; wx < b.x + b.width - gapX - winW; wx += winW + gapX){
                  ctx.fillRect(wx, wy, winW, winH);
                }
              }
            });
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - groundHeight);
            ctx.lineTo(canvas.width, canvas.height - groundHeight);
            ctx.stroke();
          }
          break;
        default:
          ctx.fillStyle = "#444";
          ctx.fillRect(0, 0, canvas.width, canvas.height - groundHeight);
          break;
      }
    }
    
    function drawBackground() {
      if(selectedBg === "🌇"){
        drawThemedBackground();
      } else {
        drawThemedBackground();
        drawHorizonDetails();
      }
    }
    
    function drawHorizonDetails() {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      switch(selectedBg) {
        case "🏖":
          {
            let horizonY = canvas.height * 0.4;
            ctx.fillRect(canvas.width * 0.1, horizonY, 10, 60);
            ctx.beginPath();
            ctx.arc(canvas.width * 0.1 + 5, horizonY, 20, Math.PI, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.7, horizonY);
            ctx.lineTo(canvas.width * 0.75, horizonY - 15);
            ctx.lineTo(canvas.width * 0.8, horizonY);
            ctx.closePath();
            ctx.fill();
          }
          break;
        case "🏕":
          {
            let horizonY = canvas.height * 0.5;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.2, horizonY);
            ctx.lineTo(canvas.width * 0.25, horizonY - 40);
            ctx.lineTo(canvas.width * 0.3, horizonY);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.4, horizonY);
            ctx.lineTo(canvas.width * 0.42, horizonY - 50);
            ctx.lineTo(canvas.width * 0.44, horizonY);
            ctx.fill();
          }
          break;
        case "🏜":
          {
            let horizonY = canvas.height * 0.4;
            ctx.beginPath();
            ctx.ellipse(canvas.width * 0.3, horizonY, 50, 15, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(canvas.width * 0.6, horizonY - 30, 8, 30);
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.6, horizonY - 30);
            ctx.lineTo(canvas.width * 0.59, horizonY - 40);
            ctx.lineTo(canvas.width * 0.62, horizonY - 40);
            ctx.closePath();
            ctx.fill();
          }
          break;
        case "🌋":
          {
            let horizonY = canvas.height - groundHeight;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.15, horizonY);
            ctx.lineTo(canvas.width * 0.2, horizonY - 40);
            ctx.lineTo(canvas.width * 0.25, horizonY);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.arc(canvas.width * 0.7, horizonY, 30, 0, Math.PI, true);
            ctx.fill();
          }
          break;
        default:
          break;
      }
    }
    
    // دالة رسم الخلفية الخاصة بشاشة البداية
    function drawStartScreenBackground() {
      // مشهد شاطئ:
      const horizonY = canvas.height * 0.6;
      // السماء:
      let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, "#87CEEB");
      skyGrad.addColorStop(1, "#B0E0E6");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, horizonY);
      // شمس:
      let sunX = canvas.width * 0.85, sunY = canvas.height * 0.3, sunRadius = 40;
      let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
      sunGrad.addColorStop(0, "rgba(255,255,0,1)");
      sunGrad.addColorStop(1, "rgba(255,255,0,0)");
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
      ctx.fill();
      // الرمل:
      ctx.fillStyle = "#F4A460";
      ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);
      // رسم أمواج:
      ctx.strokeStyle = "#ADD8E6";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let x = 0; x < canvas.width; x += 5){
        let y = horizonY + Math.sin(x * 0.05 + bgOffset) * 5;
        if(x===0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // رسم ديناصور كبير في منتصف الخلفية (كجزء من التصميم)
      let dinoSize = canvas.height * 0.4;
      ctx.font = dinoSize + "px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      // ضع الديناصور في منتصف شاطئ خلف شاشة البداية
      let dinoX = canvas.width/2;
      let dinoY = horizonY + (canvas.height - horizonY)*0.5;
      ctx.fillText("🦖", dinoX, dinoY);
    }
    
    // دالة رسم الخلفية (لأوضاع اللعبة)
    function drawThemedBackground() {
      switch(selectedBg) {
        case "🏖":
          {
            const horizonY = canvas.height * 0.4;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#87CEEB");
            skyGrad.addColorStop(1, "#B0E0E6");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            ctx.beginPath();
            ctx.arc(canvas.width*0.2 + bgOffset, horizonY, 20, Math.PI, 2*Math.PI);
            ctx.fill();
            const sunX = canvas.width * 0.8, sunY = canvas.height * 0.2, sunRadius = 50;
            let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
            sunGrad.addColorStop(0, "rgba(255,255,0,1)");
            sunGrad.addColorStop(1, "rgba(255,255,0,0)");
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#F4A460";
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - groundHeight - horizonY);
          }
          break;
        case "🏕":
          {
            const horizonY = canvas.height * 0.5;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#87CEFA");
            skyGrad.addColorStop(1, "#4682B4");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            const sunX = canvas.width * 0.8, sunY = canvas.height * 0.25, sunRadius = 40;
            let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
            sunGrad.addColorStop(0, "rgba(255,215,0,1)");
            sunGrad.addColorStop(1, "rgba(255,215,0,0)");
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - groundHeight - horizonY);
          }
          break;
        case "🏜":
          {
            const horizonY = canvas.height * 0.4;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#87CEEB");
            skyGrad.addColorStop(1, "#B0E0E6");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            const sunX = canvas.width * 0.5, sunY = canvas.height * 0.2, sunRadius = 60;
            let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
            sunGrad.addColorStop(0, "rgba(255,255,0,1)");
            sunGrad.addColorStop(1, "rgba(255,255,0,0)");
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#EDC9AF";
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - groundHeight - horizonY);
            ctx.fillStyle = "#EDC9AF";
            for (let x = 0; x < canvas.width; x += 100) {
              ctx.beginPath();
              ctx.ellipse(x, canvas.height - groundHeight - 20, 60, 20, 0, 0, Math.PI*2);
              ctx.fill();
            }
          }
          break;
        case "🌋":
          {
            const horizonY = canvas.height - groundHeight;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#8B0000");
            skyGrad.addColorStop(1, "#000000");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.moveTo(canvas.width*0.5 - 50, horizonY);
            ctx.lineTo(canvas.width*0.5, horizonY - 100);
            ctx.lineTo(canvas.width*0.5 + 50, horizonY);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#FF4500";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width*0.5, horizonY - 100);
            for (let t = 0; t < 100; t += 10) {
              ctx.lineTo(canvas.width*0.5 + Math.sin((t+bgOffset)*0.2)*20, horizonY - 100 + t);
            }
            ctx.stroke();
          }
          break;
        case "🌇":
          {
            // ثيمة المدينة باستخدام النسخة الأولى للأبنية الثابتة في الخلفية
            const horizonY = canvas.height * 0.6;
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, "#87CEEB");
            skyGrad.addColorStop(1, "#B0E0E6");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            if(!window.cityBuildings){
              window.cityBuildings = [];
              const buildingColors = ["#FF6347", "#FFD700", "#00FA9A", "#1E90FF", "#FF69B4"];
              let x = 0;
              while(x < canvas.width){
                let bWidth = 50 + Math.random() * 50;
                let availableHeight = canvas.height - horizonY;
                let bHeight = (0.4 + Math.random() * 0.6) * availableHeight;
                let bX = x;
                let bY = horizonY - bHeight; // قاعدة كل مبنى عند خط الأفق
                let color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                window.cityBuildings.push({x: bX, y: bY, width: bWidth, height: bHeight, color: color});
                x += bWidth + 20;
              }
            }
            window.cityBuildings.forEach(b => {
              ctx.fillStyle = b.color;
              ctx.fillRect(b.x, b.y, b.width, b.height);
              // رسم النوافذ على الأبنية لإضفاء عمق
              ctx.fillStyle = "rgba(255,255,255,0.8)";
              let winW = 8, winH = 8, gapX = 5, gapY = 5;
              for(let wy = b.y + gapY; wy < b.y + b.height - gapY - winH; wy += winH + gapY){
                for(let wx = b.x + gapX; wx < b.x + b.width - gapX - winW; wx += winW + gapX){
                  ctx.fillRect(wx, wy, winW, winH);
                }
              }
            });
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - groundHeight);
            ctx.lineTo(canvas.width, canvas.height - groundHeight);
            ctx.stroke();
          }
          break;
        default:
          ctx.fillStyle = "#444";
          ctx.fillRect(0, 0, canvas.width, canvas.height - groundHeight);
          break;
      }
    }
    
    function drawBackground() {
      if(selectedBg==="🌇"){
        drawThemedBackground();
      } else {
        drawThemedBackground();
        drawHorizonDetails();
      }
    }
    
    // دالة رسم الخلفية الخاصة بشاشة البداية
    function drawStartScreenBackground() {
      const horizonY = canvas.height * 0.6;
      // السماء:
      let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, "#87CEEB");
      skyGrad.addColorStop(1, "#B0E0E6");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, horizonY);
      // شمس:
      let sunX = canvas.width * 0.85, sunY = canvas.height * 0.3, sunRadius = 40;
      let sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius*0.1, sunX, sunY, sunRadius);
      sunGrad.addColorStop(0, "rgba(255,255,0,1)");
      sunGrad.addColorStop(1, "rgba(255,255,0,0)");
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius, 0, Math.PI*2);
      ctx.fill();
      // الرمل:
      ctx.fillStyle = "#F4A460";
      ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);
      // أمواج بسيطة:
      ctx.strokeStyle = "#ADD8E6";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let x=0; x<canvas.width; x+=5){
        let y = horizonY + Math.sin(x*0.05 + bgOffset)*5;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      // الديناصور الكبير:
      let dinoSize = canvas.height * 0.4;
      ctx.font = dinoSize + "px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      // وضع الديناصور في منتصف الشاشة أفقياً وعلى الرمل
      let dinoX = canvas.width/2, dinoY = horizonY + (canvas.height - horizonY)*0.5;
      ctx.fillText("🦖", dinoX, dinoY);
    }
    
    // منطق ظهور العقبات: زوج واحد فقط بفجوة ثابتة 200 بكسل
    function maybeSpawnObstacle() {
      const pairGap = 200;
      if (obstacles.length === 0 ||
         (canvas.width - (obstacles[obstacles.length - 1].x + obstacles[obstacles.length - 1].width)) >= pairGap) {
        let spawnChance = 0.02;
        if (selectedBg === "🏜") spawnChance = 0.03;
        else if (selectedBg === "🌋") spawnChance = 0.04;
        if (Math.random() < spawnChance) {
          obstacles.push(new Obstacle());
          let second = new Obstacle();
          second.x = obstacles[obstacles.length - 1].x + 10;
          obstacles.push(second);
        }
      }
    }
    
    function updateObstacleSpeeds() {
      obstacles.forEach(obs => {
        obs.speed = 3 + Math.floor(score/100);
      });
    }
    
    function updateBackgroundEffect() {
      bgOffset = (bgOffset + bgSpeed) % 100;
    }
    
    function updateWalkCycle() {
      if(dino.grounded) {
        walkCycle += 0.2;
      }
    }
    
    canvas.addEventListener('click', () => { dino.jump(); });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      dino.jump();
    });
    
    document.getElementById('startBtn').addEventListener('click', () => {
      // عند بدء اللعبة، أخفي شاشة البداية
      startScreen.style.display = 'none';
      startGame();
    });
    document.getElementById('selectDinoBtn').addEventListener('click', () => { dinoModal.style.display = 'flex'; });
    document.getElementById('selectBgBtn').addEventListener('click', () => { bgModal.style.display = 'flex'; });
    document.getElementById('closeDinoModal').addEventListener('click', () => { dinoModal.style.display = 'none'; });
    document.getElementById('closeBgModal').addEventListener('click', () => { bgModal.style.display = 'none'; });
    
    const dinoOptions = document.querySelectorAll('.dinoOption');
    dinoOptions.forEach(btn => {
      btn.addEventListener('click', function() {
        selectedDino = this.getAttribute('data-dino');
        dino.emoji = selectedDino;
        dinoModal.style.display = 'none';
      });
    });
    
    const bgOptions = document.querySelectorAll('.bgOption');
    bgOptions.forEach(btn => {
      btn.addEventListener('click', function() {
        selectedBg = this.getAttribute('data-bg');
        bgModal.style.display = 'none';
        if(selectedBg === "🌇"){
          window.cityBuildings = null;
        }
      });
    });
    
    document.getElementById('retryBtn').addEventListener('click', resetGame);
    
    // تعريف العقبات (40×40)
    let obstacles = [];
    function Obstacle() {
      this.width = 40;
      this.height = 40;
      this.x = canvas.width;
      this.speed = 3;
      this.emoji = getObstacleEmoji();
      this.y = canvas.height - groundHeight - this.height;
      
      this.update = function() { this.x -= this.speed; };
      this.draw = function() {
        ctx.font = "40px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText(this.emoji, this.x, this.y + this.height);
      };
    }
    
    function getObstacleEmoji() {
      switch(selectedBg) {
        case "🏖":
          return Math.random() < 0.5 ? "🦀" : "🐚";
        case "🏕":
          return "🌲";
        case "🏜":
          return "🌵";
        case "🌋":
          return "🔥";
        default:
          return "💣";
      }
    }
    
    function gameLoop() {
      if (!gameRunning) return;
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    function update() {
      dino.update();
      updateWalkCycle();
      updateBackgroundEffect();
      updateObstacleSpeeds();
      obstacles.forEach(obs => obs.update());
      obstacles = obstacles.filter(o => o.x + o.width > 0);
      maybeSpawnObstacle();
      if(selectedBg === "🌋"){
        meteor.update();
      }
      for (let obs of obstacles) {
        if (detectCollision(dino, obs)) {
          gameOver();
        }
      }
      score++;
    }
    
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // إذا لم يبدأ اللعب: نجعل الخلفية خاصة بشاشة البداية
      if (!gameRunning) {
        drawStartScreenBackground();
      } else {
        drawBackground();
        if(selectedBg === "🌋"){
          meteor.draw();
        }
      }
      ctx.fillStyle = groundColors[selectedBg] || "#555";
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
      dino.draw();
      obstacles.forEach(obs => obs.draw());
      if(selectedBg === "🌇" && window.cityBuildings){
        window.cityBuildings.forEach(b => {
          ctx.fillStyle = b.color;
          ctx.fillRect(b.x, b.y, b.width, b.height);
          ctx.fillStyle = "rgba(255,255,255,0.8)";
          let winW = 8, winH = 8, gapX = 5, gapY = 5;
          for(let wy = b.y + gapY; wy < b.y + b.height - gapY - winH; wy += winH + gapY){
            for(let wx = b.x + gapX; wx < b.x + b.width - gapX - winW; wx += winW + gapX){
              ctx.fillRect(wx, wy, winW, winH);
            }
          }
        });
      }
      ctx.fillStyle = "#fff";
      ctx.font = "20px Arial";
      ctx.fillText("النقاط: " + score, 10, 30);
      ctx.fillText("أفضل: " + highScore, 10, 55);
    }
    
    function detectCollision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }
    
    function startGame() {
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      score = 0;
      obstacles = [];
      dino.x = 50;
      dino.y = canvas.height - dino.height - groundHeight;
      dino.velocityY = 0;
      dino.jumpCount = 0;
      bgOffset = 0;
      gameRunning = true;
      if(selectedBg === "🌇"){
        window.cityBuildings = [];
        const horizonY = canvas.height * 0.6;
        const buildingColors = ["#FF6347", "#FFD700", "#00FA9A", "#1E90FF", "#FF69B4"];
        let x = 0;
        while(x < canvas.width) {
          let bWidth = 50 + Math.random() * 50;
          let availableHeight = canvas.height - horizonY;
          let bHeight = (0.4 + Math.random() * 0.6) * availableHeight;
          let bX = x;
          let bY = horizonY - bHeight;
          let color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
          window.cityBuildings.push({x: bX, y: bY, width: bWidth, height: bHeight, color: color});
          x += bWidth + 20;
        }
      }
      requestAnimationFrame(gameLoop);
    }
    
    function gameOver() {
      gameRunning = false;
      if(score > highScore) {
        highScore = score;
        localStorage.setItem('highScore', highScore);
      }
      scoreDisplay.textContent = "النقاط: " + score;
      gameOverScreen.style.display = 'flex';
    }
    
    function resetGame() {
      gameOverScreen.style.display = 'none';
      startScreen.style.display = 'flex';
      // عند إعادة ظهور شاشة البداية، نبدأ حلقة خلفية شاشة البداية
      startScreenLoop();
    }
    
    // حلقة لتحديث خلفية شاشة البداية في حالة عدم بدء اللعبة
    function startScreenLoop() {
      if(gameRunning) return;
      updateBackgroundEffect();
      updateWalkCycle();
      drawStartScreenBackground();
      requestAnimationFrame(startScreenLoop);
    }
    
    // عند التحميل، ابدأ حلقة خلفية شاشة البداية
    window.onload = function() {
      startScreen.style.display = 'flex';
      startScreenLoop();
    };
  </script>
</body>
</html>
