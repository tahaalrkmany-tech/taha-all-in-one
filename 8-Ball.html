            }

            function fireAim(e) {
                if (!isAiming) return;
                isAiming = false;
                if (gameOver || !gameStarted) return;
                if (!PlayerManager.isCurrentHuman()) return;

                const cueBall = balls.find(b => b.isCue && b.active && !b.inPocket);
                if (!cueBall || ballsMoving || cueBallInHand) return;

                const dx = aimStart.x - aimCurrent.x;
                const dy = aimStart.y - aimCurrent.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 5) {
                    powerFill.style.width = '0%';
                    return;
                }

                const power = Math.min(dist, AIM_MAX_DIST) / AIM_MAX_DIST;
                const angle = Math.atan2(dy, dx);
                const force = power * MAX_POWER;

                cueBall.vx = Math.cos(angle) * force;
                cueBall.vy = Math.sin(angle) * force;

                soundCueHit();
                cueBall.spin = (Math.random() - 0.5) * 0.02;

                const currentPlayer = PlayerManager.getCurrent();
                showStatus(`💥 ${currentPlayer.name} يضرب! قوة: ${Math.round(power * 100)}%`);
                powerFill.style.width = '0%';

                // إعادة ضبط مؤشرات التحكم في الدور
                scoredThisTurn = false;
                turnProcessed = false;
                ballsMoving = true; // سننتظر حتى تتوقف الكرات
            }

            // ربط الأحداث
            canvas.addEventListener('mousedown', startAim);
            canvas.addEventListener('mousemove', moveAim);
            canvas.addEventListener('mouseup', fireAim);
            canvas.addEventListener('mouseleave', () => {
                if (isAiming) {
                    isAiming = false;
                    powerFill.style.width = '0%';
                }
            });

            canvas.addEventListener('touchstart', startAim, { passive: false });
            canvas.addEventListener('touchmove', moveAim, { passive: false });
            canvas.addEventListener('touchend', fireAim, { passive: false });

            // =====================================================================
            // 16. أحداث واجهة المستخدم
            // =====================================================================
            document.querySelectorAll('#start-rack button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#start-rack button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            document.querySelectorAll('#start-cueball button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#start-cueball button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            document.querySelectorAll('#start-cue button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#start-cue button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            document.querySelectorAll('#mode-selector button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#mode-selector button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    gameMode = this.dataset.mode;
                });
            });

            startBtn.addEventListener('click', startGame);

            // الأزرار الجانبية
            document.getElementById('rack-btns').addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON') return;
                if (ballsMoving) return;
                document.querySelectorAll('#rack-btns button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                rackType = e.target.dataset.rack;
                if (gameStarted && !gameOver) {
                    createRack(rackType);
                    showStatus(`🎱 تم تغيير التشكيلة إلى: ${e.target.textContent}`);
                }
            });

            document.getElementById('cueball-btns').addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON') return;
                document.querySelectorAll('#cueball-btns button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                cueBallStyle = e.target.dataset.cue;
                if (gameStarted) showStatus(`⚪ تم تغيير الكرة البيضاء إلى: ${e.target.textContent}`);
            });

            document.getElementById('cue-btns').addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON') return;
                document.querySelectorAll('#cue-btns button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                cueStyle = e.target.dataset.cuestyle;
                if (gameStarted) showStatus(`🎯 تم تغيير العصا إلى: ${e.target.textContent}`);
            });

            // أشرطة التمرير
            document.getElementById('friction-slider').addEventListener('input', (e) => {
                friction = parseFloat(e.target.value);
                document.getElementById('fric-val').textContent = friction.toFixed(3);
            });

            document.getElementById('spin-friction-slider').addEventListener('input', (e) => {
                spinFriction = parseFloat(e.target.value);
                document.getElementById('spin-fric-val').textContent = spinFriction.toFixed(3);
            });

            document.getElementById('restitution-slider').addEventListener('input', (e) => {
                restitution = parseFloat(e.target.value);
                document.getElementById('rest-val').textContent = restitution.toFixed(2);
            });

            document.getElementById('stop-threshold-slider').addEventListener('input', (e) => {
                stopThreshold = parseFloat(e.target.value);
                document.getElementById('stop-threshold-val').textContent = stopThreshold.toFixed(2);
            });

            document.getElementById('reset-btn').addEventListener('click', resetGame);
            document.getElementById('play-again-btn').addEventListener('click', resetGame);

            // =====================================================================
            // 17. التهيئة النهائية
            // =====================================================================
            initTable();
            createRack('standard');
            updateScore();
            gameLoop();

            document.addEventListener('touchmove', (e) => {
                if (e.target === canvas) e.preventDefault();
            }, { passive: false });

        })();
    </script>

</body>
</html>
