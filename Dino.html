<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة العقبات - نسخة محسنة</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        :root {
            --bg: #1a1a2e;
            --neon: #00d2ff;
            --accent: #ff4757;
            --gold: #ffa502;
            --glass: rgba(255,255,255,0.12);
            --border: rgba(255,255,255,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 30%, rgba(108,99,255,0.2) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(0,210,255,0.1) 0%, transparent 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border-radius: 25px;
            padding: 10px;
            box-shadow: 0 0 50px rgba(0,210,255,0.2);
            border: 1px solid var(--border);
        }

        #game-canvas {
            width: 100%;
            height: 65vh;
            border-radius: 18px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(2px);
            box-shadow: 0 0 30px rgba(0,210,255,0.35);
            transition: all 0.3s;
            image-rendering: auto;
        }

        .ui-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 8px 18px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon);
            background: rgba(0,0,0,0.5);
            border-radius: 14px;
            margin-bottom: 6px;
        }

        .score-display,
        .best-display {
            font-size: 1.1em;
            background: var(--glass);
            padding: 6px 16px;
            border-radius: 25px;
            border: 1px solid var(--border);
        }

        .best-display {
            color: var(--gold);
        }

        .btn {
            padding: 12px 25px;
            margin: 8px 5px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--neon), #0099cc);
            color: #fff;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,210,255,0.5);
            text-transform: uppercase;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0,210,255,0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.secondary {
            background: linear-gradient(135deg, var(--accent), #c0392b);
            box-shadow: 0 0 15px rgba(255,71,87,0.5);
        }

        .btn.small {
            padding: 8px 15px;
            font-size: 0.85em;
        }

        .character-selection {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .character-btn {
            background: var(--glass);
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .character-btn.selected {
            border-color: var(--neon);
            box-shadow: 0 0 25px var(--neon);
            transform: scale(1.1);
        }

        .control-buttons {
            display: none;
            position: absolute;
            bottom: 140px;
            right: 25px;
            flex-direction: column;
            gap: 15px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            font-size: 28px;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--neon);
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .control-btn:active {
            background: var(--neon);
            transform: scale(0.9);
        }

        #game-over {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            color: #fff;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--accent);
            box-shadow: 0 0 40px rgba(255,71,87,0.5);
            z-index: 10;
        }

        #game-over h2 {
            font-size: 2em;
            margin-bottom: 10px;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {
            .container {
                height: 95vh;
                padding: 5px;
            }
            #game-canvas {
                height: 55vh;
            }
            .character-btn {
                width: 55px;
                height: 55px;
                font-size: 32px;
            }
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="ui-bar">
        <div class="score-display" id="current-score">🏆 0</div>
        <div class="best-display" id="best-score">⭐ أفضل: 0</div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="game-over">
        <h2>💥 لقد خسرت!</h2>
        <p style="font-size:1.4em; margin:10px 0" id="final-score">النقاط: 0</p>
        <button class="btn secondary" id="restart-button">🔄 أعد المحاولة</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px;">
        <button class="btn" id="start-button">▶️ ابدأ</button>
        <button class="btn small" id="choose-character-button">🎭 اختر شخصيتك</button>
        <button class="btn small hidden" id="pause-button">⏸️ إيقاف</button>
    </div>

    <div id="character-selection" class="character-selection" style="display: none;">
        <button class="character-btn" data-character="dino1" title="قفز مزدوج">🦖</button>
        <button class="character-btn" data-character="dino2" title="قفزة عالية">🦕</button>
        <button class="character-btn" data-character="bird" title="طائر يطير">🐦</button>
    </div>

    <div class="control-buttons" id="bird-controls">
        <div class="control-btn" id="up-button">⬆️</div>
        <div class="control-btn" id="down-button">⬇️</div>
    </div>
</div>

<script>
    (function() {
        // ---------- Service Worker للتحديث التلقائي ----------
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'dino-game-v4';
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => {
                    e.waitUntil(caches.keys().then(keys => Promise.all(
                        keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))
                    )));
                    self.clients.claim();
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        fetch(e.request).then(res => {
                            const clone = res.clone();
                            caches.open(CACHE_NAME).then(cache => cache.put(e.request, clone));
                            return res;
                        }).catch(() => caches.match(e.request))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    });
                });
            }).catch(() => {});
        }

        // ---------- العناصر ----------
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('start-button');
        const chooseCharacterButton = document.getElementById('choose-character-button');
        const characterSelection = document.getElementById('character-selection');
        const gameOverScreen = document.getElementById('game-over');
        const restartButton = document.getElementById('restart-button');
        const currentScoreDisplay = document.getElementById('current-score');
        const bestScoreDisplay = document.getElementById('best-score');
        const finalScoreDisplay = document.getElementById('final-score');
        const upButton = document.getElementById('up-button');
        const downButton = document.getElementById('down-button');
        const birdControls = document.getElementById('bird-controls');
        const pauseButton = document.getElementById('pause-button');

        let chosenCharacter = null;
        let score = 0;
        let gameOver = false;
        let gamePaused = false;
        let gameStarted = false;
        let animationFrameId;
        let gameSpeed = 4.5; // بداية أبطأ قليلاً
        let bestScore = parseInt(localStorage.getItem('dinoBestScore')) || 0;
        let lastObstacleX = 0;

        let mountains = [];
        let trees = [];
        let clouds = [];

        const characterSprites = {
            dino1: '🦖',
            dino2: '🦕',
            bird: '🐦'
        };

        let character = {
            x: 50,
            y: 100,
            width: 40,
            height: 40,
            dy: 0,
            gravity: 0.6,   // جاذبية أخف
            lift: -10,       // قيمة افتراضية سيتم تعديلها حسب الشخصية
            jumping: false,
            doubleJumping: false,
            canDoubleJump: true
        };

        let obstacles = [];
        let coins = [];

        bestScoreDisplay.textContent = `⭐ أفضل: ${bestScore}`;

        function setCharacterAbilities() {
            if (chosenCharacter === 'dino1') {
                character.lift = -9.5;        // قفزة متوسطة
                character.canDoubleJump = true;
            } else if (chosenCharacter === 'dino2') {
                character.lift = -12.5;       // قفزة عالية جداً
                character.canDoubleJump = false;
            } else if (chosenCharacter === 'bird') {
                character.lift = -11;
                character.canDoubleJump = false;
            }
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = Math.min(rect.width * 0.95, 700);
            canvas.height = Math.min(rect.height * 0.65, 400);
            if (canvas.height < 250) canvas.height = 250;
            generateEnvironment();
        }

        window.addEventListener('resize', resizeCanvas);

        function generateEnvironment() {
            mountains = [];
            for (let i = 0; i < 8; i++) {
                mountains.push({
                    x: i * (canvas.width / 7),
                    width: 80 + Math.random() * 100,
                    height: 60 + Math.random() * 80,
                });
            }
            trees = [];
            for (let i = 0; i < 6; i++) {
                trees.push({
                    x: i * (canvas.width / 5) + Math.random() * 40,
                    width: 15,
                    height: 30 + Math.random() * 25,
                });
            }
            clouds = [];
            for (let i = 0; i < 4; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: 20 + Math.random() * 60,
                    width: 60 + Math.random() * 70,
                });
            }
        }

        function startGame() {
            if (gameStarted && !gameOver && !gamePaused) return;
            if (!chosenCharacter) {
                alert('يرجى اختيار شخصية أولاً!');
                return;
            }
            resizeCanvas();
            setCharacterAbilities();
            gameStarted = true;
            gameOver = false;
            gamePaused = false;
            score = 0;
            gameSpeed = 4.5;
            character.x = 50;
            character.y = canvas.height - 80;
            character.dy = 0;
            character.jumping = false;
            character.doubleJumping = false;
            obstacles = [];
            coins = [];
            lastObstacleX = canvas.width;
            gameOverScreen.style.display = 'none';
            pauseButton.classList.remove('hidden');
            startButton.classList.add('hidden');
            chooseCharacterButton.classList.add('hidden');
            characterSelection.style.display = 'none';
            updateScoreDisplay();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function updateScoreDisplay() {
            currentScoreDisplay.textContent = `🏆 ${score}`;
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0a0a2e');
            grad.addColorStop(0.7, '#2a1a4e');
            grad.addColorStop(1, '#1a1a3a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.ellipse(cloud.x, cloud.y, cloud.width/2, 15, 0, 0, Math.PI*2);
                ctx.fill();
                cloud.x -= 0.2;
                if (cloud.x + cloud.width < 0) cloud.x = canvas.width + 50;
            });

            ctx.fillStyle = '#1a1a3a';
            mountains.forEach(m => {
                ctx.beginPath();
                ctx.moveTo(m.x, canvas.height - 15);
                ctx.lineTo(m.x + m.width/2, canvas.height - 15 - m.height);
                ctx.lineTo(m.x + m.width, canvas.height - 15);
                ctx.fill();
                ctx.fillStyle = '#2a2a4a';
                ctx.beginPath();
                ctx.moveTo(m.x + m.width*0.3, canvas.height - 15);
                ctx.lineTo(m.x + m.width/2, canvas.height - 15 - m.height + 15);
                ctx.lineTo(m.x + m.width*0.8, canvas.height - 15);
                ctx.fill();
                ctx.fillStyle = '#1a1a3a';
            });

            ctx.fillStyle = '#2a4a2a';
            trees.forEach(tree => {
                ctx.fillRect(tree.x, canvas.height - 15 - tree.height, tree.width, tree.height);
                ctx.fillStyle = '#3a5a3a';
                ctx.fillRect(tree.x - 4, canvas.height - 15 - tree.height + 10, 8, 15);
                ctx.fillRect(tree.x + tree.width - 4, canvas.height - 15 - tree.height + 5, 8, 20);
                ctx.fillStyle = '#2a4a2a';
            });

            ctx.fillStyle = '#3a3a5a';
            ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
            ctx.fillStyle = '#4a4a6a';
            for (let i = 0; i < 20; i++) {
                let x = (Date.now() * 0.1 + i * 45) % (canvas.width + 45) - 22;
                ctx.fillRect(x, canvas.height - 15, 25, 6);
            }
        }

        function gameLoop() {
            if (gameOver || gamePaused) {
                if (gameOver) endGame();
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            updateCharacter();
            updateObstacles();
            updateCoins();
            checkCollisions();
            drawCharacter();
            drawObstacles();
            drawCoins();
            updateScoreDisplay();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function updateCharacter() {
            if (chosenCharacter === 'bird') {
                character.dy += character.gravity * 0.4;
                character.y += character.dy;
                if (character.y < 0) {
                    character.y = 0;
                    character.dy = 0;
                }
                if (character.y + character.height > canvas.height - 15) {
                    character.y = canvas.height - 15 - character.height;
                    character.dy = 0;
                }
            } else {
                character.dy += character.gravity;
                character.y += character.dy;

                if (character.y + character.height > canvas.height - 15) {
                    character.y = canvas.height - 15 - character.height;
                    character.dy = 0;
                    character.jumping = false;
                    character.doubleJumping = false;
                }
            }
        }

        function updateObstacles() {
            const minDistance = Math.max(200, gameSpeed * 26);
            let canSpawn = true;
            if (obstacles.length > 0) {
                const lastObs = obstacles[obstacles.length-1];
                if (lastObs.x > canvas.width - minDistance) {
                    canSpawn = false;
                }
            }
            if (canSpawn && Math.random() < 0.016 + (score * 0.00025)) {
                let yPos;
                if (chosenCharacter === 'bird') {
                    yPos = Math.random() * (canvas.height - 80) + 20;
                } else {
                    yPos = canvas.height - 15 - 30;
                }
                obstacles.push({
                    x: canvas.width + 10,
                    y: yPos,
                    width: 18 + Math.random() * 12,
                    height: 30 + Math.random() * 15,
                });
            }

            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= gameSpeed;
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                    score++;
                    if (score % 10 === 0) gameSpeed += 0.12; // زيادة أبطأ للسرعة
                }
            }
        }

        function updateCoins() {
            if (Math.random() < 0.006) {
                coins.push({
                    x: canvas.width + 30,
                    y: Math.random() * (canvas.height - 70) + 25,
                    radius: 9,
                });
            }
            for (let i = 0; i < coins.length; i++) {
                coins[i].x -= gameSpeed;
                if (coins[i].x + coins[i].radius < 0) {
                    coins.splice(i, 1);
                    i--;
                }
            }
        }

        function drawCharacter() {
            const sprite = characterSprites[chosenCharacter];
            const cx = character.x + character.width/2;
            const cy = character.y + character.height/2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(-1, 1);
            ctx.font = `${character.height}px serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            if (!gameOver) {
                ctx.shadowColor = '#00d2ff';
                ctx.shadowBlur = 18;
                ctx.fillText(sprite, 0, 0);
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            }

            ctx.fillStyle = '#fff';
            ctx.fillText(sprite, 0, 0);
            ctx.restore();
        }

        function drawObstacles() {
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 12;
            obstacles.forEach(o => {
                ctx.fillRect(o.x, o.y, o.width, o.height);
            });
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        function drawCoins() {
            ctx.fillStyle = '#ffa502';
            ctx.shadowColor = '#ffa502';
            ctx.shadowBlur = 10;
            coins.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function checkCollisions() {
            for (let o of obstacles) {
                if (
                    character.x < o.x + o.width &&
                    character.x + character.width > o.x &&
                    character.y < o.y + o.height &&
                    character.y + character.height > o.y
                ) {
                    gameOver = true;
                    break;
                }
            }
            for (let i = 0; i < coins.length; i++) {
                let c = coins[i];
                let dx = (character.x + character.width/2) - c.x;
                let dy = (character.y + character.height/2) - c.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < c.radius + character.width/2) {
                    coins.splice(i, 1);
                    i--;
                    score += 3;
                }
            }
        }

        function endGame() {
            cancelAnimationFrame(animationFrameId);
            gameStarted = false;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('dinoBestScore', bestScore);
                bestScoreDisplay.textContent = `⭐ أفضل: ${bestScore}`;
            }
            finalScoreDisplay.textContent = `النقاط: ${score}`;
            gameOverScreen.style.display = 'block';
            pauseButton.classList.add('hidden');
            startButton.classList.remove('hidden');
            chooseCharacterButton.classList.remove('hidden');
        }

        function handleJump() {
            if (chosenCharacter === 'bird' || !gameStarted || gameOver || gamePaused) return;

            if (chosenCharacter === 'dino1') {
                // ديناصور 1: قفز مزدوج
                if (!character.jumping) {
                    character.dy = character.lift;
                    character.jumping = true;
                } else if (!character.doubleJumping) {
                    character.dy = character.lift * 0.85; // القفزة الثانية أقل قليلاً
                    character.doubleJumping = true;
                }
            } else if (chosenCharacter === 'dino2') {
                // ديناصور 2: قفزة واحدة عالية
                if (!character.jumping) {
                    character.dy = character.lift;
                    character.jumping = true;
                }
                // لا يوجد قفز مزدوج
            }
        }

        function handleFly() {
            if (chosenCharacter === 'bird' && gameStarted && !gameOver && !gamePaused) {
                character.dy = character.lift;
            }
        }

        function handleDive() {
            if (chosenCharacter === 'bird' && gameStarted && !gameOver && !gamePaused) {
                character.dy = 7;
            }
        }

        // ---------- الأحداث ----------
        startButton.addEventListener('click', startGame);
        chooseCharacterButton.addEventListener('click', () => {
            characterSelection.style.display = 'flex';
        });
        restartButton.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            startGame();
        });
        pauseButton.addEventListener('click', () => {
            gamePaused = !gamePaused;
            pauseButton.textContent = gamePaused ? '▶️ استئناف' : '⏸️ إيقاف';
            if (!gamePaused) gameLoop();
        });

        document.querySelectorAll('.character-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                chosenCharacter = this.getAttribute('data-character');
                document.querySelectorAll('.character-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                characterSelection.style.display = 'none';
                if (chosenCharacter === 'bird') {
                    birdControls.style.display = 'flex';
                } else {
                    birdControls.style.display = 'none';
                }
            });
        });

        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (chosenCharacter !== 'bird') handleJump();
                else handleFly();
            } else if (e.code === 'ArrowDown' && chosenCharacter === 'bird') {
                e.preventDefault();
                handleDive();
            } else if (e.code === 'KeyP') {
                pauseButton.click();
            }
        });

        canvas.addEventListener('mousedown', function(e) {
            e.preventDefault();
            if (chosenCharacter !== 'bird') handleJump();
            else handleFly();
        });

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (chosenCharacter !== 'bird') handleJump();
            else handleFly();
        });

        upButton.addEventListener('click', handleFly);
        downButton.addEventListener('click', handleDive);
        canvas.addEventListener('dragstart', e => e.preventDefault());

        resizeCanvas();
        generateEnvironment();
        bestScoreDisplay.textContent = `⭐ أفضل: ${bestScore}`;
    })();
</script>
</body>
</html>
