<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/taha-all-in-one/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TahaTechPro | ألعاب وأدوات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #0d1b2a;
            --secondary: #1b3a5c;
            --gold: #ffd700;
            --card-bg: #ffffff;
            --text-dark: #1a2a3f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: var(--text-dark);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            border-bottom: 3px solid var(--gold);
        }
        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .logo h1 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .logo h1 span { color: var(--gold); }
        .search-box {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.6); }
        .search-box input:focus {
            background: rgba(255,255,255,0.2);
            outline: none;
            border-color: var(--gold);
        }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 20px 0;
            flex: 1;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #dce4ef;
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            font-weight: 600;
            color: #5c6f87;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover { color: var(--primary); background: rgba(0,0,0,0.03); }
        .tab-btn.active {
            color: #fff;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(13,27,42,0.2);
        }
        .tab-btn .badge {
            background: var(--gold);
            color: #000;
            font-size: 11px;
            padding: 0 8px;
            border-radius: 20px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
            margin-top: 10px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 16px 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
            border: 1px solid #e9f0f5;
            transition: all 0.25s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: var(--gold);
            box-shadow: 0 14px 30px rgba(0,0,0,0.07);
        }
        .card .icon { font-size: 38px; margin-bottom: 6px; }
        .card h3 { font-size: 17px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .card p { font-size: 13px; color: #6f8eae; line-height: 1.4; margin-bottom: 6px; flex: 1; }
        .card .channel-tag {
            font-size: 11px;
            color: var(--gold);
            font-weight: 600;
            background: rgba(13,27,42,0.04);
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px dashed var(--gold);
        }
        .card .link-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .card .link-btn:hover {
            background: var(--gold);
            color: #000;
            transform: scale(1.02);
        }

        .social-section {
            margin: 30px 0 10px;
            text-align: center;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .social-links a {
            background: #eef2fa;
            color: var(--primary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: 0.25s;
            text-decoration: none;
        }
        .social-links a:hover {
            background: var(--gold);
            color: #000;
            transform: translateY(-4px);
            box-shadow: 0 6px 14px rgba(201,168,76,0.3);
        }

        footer {
            background: var(--primary);
            color: rgba(255,255,255,0.7);
            text-align: center;
            padding: 18px 20px;
            margin-top: 30px;
            border-top: 2px solid var(--gold);
            font-size: 14px;
        }
        footer a { color: var(--gold); text-decoration: none; font-weight: 600; }

        @media (max-width: 700px) {
            .header-container { flex-direction: column; align-items: stretch; text-align: center; }
            .search-box { max-width: 100%; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .tabs { justify-content: center; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card { padding: 14px 10px; }
            .card .icon { font-size: 28px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo"><h1>⚜️ Taha<span>TechPro</span></h1></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث...">
            <i class="fas fa-search"></i>
        </div>
    </div>
</header>

<main class="container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="games">🎮 ألعاب <span class="badge" id="gamesCount">0</span></button>
        <button class="tab-btn" data-tab="tools">🛠️ أدوات <span class="badge" id="toolsCount">0</span></button>
        <button class="tab-btn" data-tab="all">🌟 الكل <span class="badge" id="allCount">0</span></button>
    </div>
    <div class="grid" id="cardGrid"></div>
    <div class="social-section">
        <div class="social-links">
            <a href="https://youtube.com/@superss2824?si=dFcVrqzzPXhuPXZu" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="https://www.facebook.com/share/1BpdpMCkyj/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/thlrqmny?igsh=MW50eHlseHJ6ampzdQ==" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/963993382234" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            <a href="https://t.me/TahaTecH2026Bot" target="_blank" aria-label="Telegram"><i class="fab fa-telegram-plane"></i></a>
        </div>
    </div>
</main>

<footer>
    © 2026 TahaTechPro | 
    <a href="https://t.me/TahaAllinOne" target="_blank">@TahaAllinOne</a> | 
    <a href="https://t.me/TahaTecH2026Bot" target="_blank">البوت</a>
</footer>

<script>
    // ==================== تجاوز الكاش تلقائياً ====================
    (function() {
        const version = Date.now();
        document.querySelectorAll('link[rel="stylesheet"]').forEach(el => {
            const href = el.getAttribute('href');
            if (href && !href.includes('?v=')) el.setAttribute('href', href + '?v=' + version);
        });
        document.querySelectorAll('script[src]').forEach(el => {
            const src = el.getAttribute('src');
            if (src && !src.includes('?v=')) el.setAttribute('src', src + '?v=' + version);
        });
    })();

    // ==================== البيانات ====================
    const BASE = 'https://tahaalrkmany-tech.github.io/taha-all-in-one/';
    const PLAY_URL = BASE + 'Play.html?file=';
    const version = Date.now();
    const v = (f) => BASE + f + '?v=' + version;

    // الألعاب (21 لعبة، مستبعد: bayblade.html)
    const games = [
        { id: 'BALLONe', icon: '🎈', name: 'بالونات', desc: 'تسلية سريعة', file: 'BALLONe.html' },
        { id: 'Dino', icon: '🦖', name: 'ديناصور', desc: 'قفز وتفادي العقبات', file: 'Dino.html' },
        { id: 'Draw', icon: '🎨', name: 'تحدي الرسم', desc: 'إبداع وتلوين', file: 'Draw.html' },
        { id: 'GlintRush', icon: '💫', name: 'Glint Rush', desc: 'تحدي سرعة', file: 'Glint Rush.html' },
        { id: 'hockey', icon: '🏒', name: 'هوكي', desc: 'هوكي سريعة', file: 'هوكي.html' },
        { id: 'SeaStrike', icon: '⚓', name: 'Sea Strike', desc: 'معركة بحرية', file: 'SeaStrike.html' },
        { id: 'Super-dino', icon: '🦕', name: 'Dino-2', desc: 'ديناصور متقدم', file: 'Super-dino.html' },
        { id: 'XOGame', icon: '❌', name: 'X-O', desc: 'تيك تاك تو', file: 'X-OGame.html' },
        { id: 'YT-CRUSH4', icon: '💥', name: 'YT Crush', desc: 'ألغاز ومطابقة', file: 'YT-CRUSH4.html' },
        { id: 'Summerblaze', icon: '🔥', name: 'Summerblaze', desc: 'مغامرة نارية', file: 'Summerblaze.html' },
        { id: 'FalconsFortune', icon: '🦅', name: 'Falcon\'s Fortune', desc: 'حظ الصقر', file: 'Falcon\'s Fortune.html' },
        { id: 'MeteorSlayer', icon: '🚀', name: 'Meteor Slayer', desc: 'دمر النيازك', file: 'MeteorSlayer.html' },
        { id: 'Snakeladder', icon: '🎲', name: 'الدودة والسلالم', desc: 'لعبة عائلية', file: 'Snakeladder.html' },
        { id: '8Ball', icon: '🎱', name: '8 Ball Pool', desc: 'بلياردو كلاسيكي', file: '8Ball.html' },
        { id: 'IceCreamBlitz', icon: '🍦', name: 'IceCream Blitz', desc: 'مغامرة مثلجات', file: 'IceCreamBlitz.html' },
        { id: 'FruitNinja', icon: '🍉', name: 'Fruit Ninja', desc: 'تقطيع الفواكه', file: 'FruitNinja.html' },
        { id: 'CubexMaster', icon: '🧱', name: 'Cubex Master', desc: 'تكديس المكعبات', file: 'CubexMaster.html' },
        { id: 'Sudoku', icon: '🧩', name: 'سودوكو', desc: 'ألغاز ذهنية', file: 'Sudoku.html' },
        { id: 'BowlingStrike', icon: '🎳', name: 'بولينغ', desc: 'إسقاط الأعمدة', file: 'BowlingStrike.html' },
        { id: 'DamascusDash', icon: '🏘️', name: 'Damascus Dash', desc: 'مغامرة دمشقية', file: 'DamascusDash.html' }
    ];

    // الأدوات (5 أدوات)
    const tools = [
        { id: 'Files write and edit', icon: '✍️', name: 'محرر نصوص', desc: 'تحرير وتنسيق النصوص', file: 'Files write and edit.html', special: true },
        { id: 'PDFCONVERTOR', icon: '📄', name: 'محول PDF', desc: 'تحويل النصوص إلى PDF', file: 'PDFCONVERTOR.html' },
        { id: 'TahaProCalculator', icon: '🧮', name: 'حاسبة علمية', desc: 'عمليات رياضية متقدمة', file: 'TahaProCalculator.html' },
        { id: 'TahaSignature', icon: '✒️', name: 'توقيعات فنية', desc: 'تحويل النص إلى توقيع', file: 'TahaSignature.html' },
        { id: 'Translate_weather', icon: '🌐', name: 'مترجم وطقس', desc: 'ترجمة وطقس فوري', file: 'Translate_weather.html' }
    ];

    const allItems = [
        ...games.map(g => ({ ...g, type: 'game' })),
        ...tools.map(t => ({ ...t, type: 'tool' }))
    ];

    // تحديث الأعداد
    document.getElementById('gamesCount').textContent = games.length;
    document.getElementById('toolsCount').textContent = tools.length;
    document.getElementById('allCount').textContent = allItems.length;

    const grid = document.getElementById('cardGrid');
    const searchInput = document.getElementById('searchInput');

    function renderCards(filterType = 'all', searchTerm = '') {
        grid.innerHTML = '';
        const term = searchTerm.toLowerCase().trim();
        const filtered = allItems.filter(item => {
            if (filterType === 'games' && item.type !== 'game') return false;
            if (filterType === 'tools' && item.type !== 'tool') return false;
            if (term) {
                const matchName = item.name.toLowerCase().includes(term);
                const matchDesc = item.desc.toLowerCase().includes(term);
                if (!matchName && !matchDesc) return false;
            }
            return true;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#6f8eae; padding:40px 0;">🔍 لا نتائج</div>`;
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            const finalUrl = item.special ? PLAY_URL + encodeURIComponent(item.file) : v(item.file);
            card.innerHTML = `
                <div class="icon">${item.icon}</div>
                <h3>${item.name}</h3>
                <p>${item.desc}</p>
                <span class="channel-tag">✨ @TahaAllinOne</span>
                <a href="${finalUrl}" class="link-btn" target="_blank">🚀 استكشف</a>
            `;
            grid.appendChild(card);
        });
    }

    // الأحداث
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            renderCards(this.dataset.tab, searchInput.value);
        });
    });

    searchInput.addEventListener('input', function() {
        const activeTab = document.querySelector('.tab-btn.active');
        renderCards(activeTab ? activeTab.dataset.tab : 'all', this.value);
    });

    renderCards('all', '');
</script>
    <
            <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/taha-all-in-one/sw.js');
      }

      // استقبال رسائل التحديث من Service Worker
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'UPDATE_READY') {
          alert(event.data.message);
        }
      });
    </script>
</body>
</html>
