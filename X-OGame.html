ابدأ الكتابة هنا...<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>XO</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      text-align: center;
      direction: rtl;
    }
    .selector {
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .symbol-box {
      width: 60px;
      height: 60px;
      font-size: 40px;
      background: #222;
      color: white;
      margin: 0 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
    }
    .arrow {
      font-size: 30px;
      cursor: pointer;
      margin: 0 10px;
    }
    .choose-btn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }
    .cell {
      width: 60px;
      height: 60px;
      font-size: 40px;
      background: white;
      border: 2px solid #444;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .status {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h2>اختر رمزي اللعب</h2>
  <div class="selector">
    <div class="arrow" onclick="prevPair()">⬅️</div>
    <div class="symbol-box" id="symbol1">⚽</div>
    <div class="symbol-box" id="symbol2">👾</div>
    <div class="arrow" onclick="nextPair()">➡️</div>
  </div>
  <button class="choose-btn" onclick="startGame()">اختيار</button>

  <div class="board" id="board" style="display:none;"></div>
  <div class="status" id="status"></div>

  <script>
    const sports = ["⚽", "🏀", "🏈", "🎾", "🥊", "🏓", "🏸", "⛷️", "🚴‍♂️", "🏋️‍♀️"];
    const fantasy = ["🦄", "👾", "🧙‍♂️", "🐉", "🧞", "🧚", "🧟", "🧜‍♀️"];
    const mental = ["🧠", "🧩", "🌀", "🧿", "💡", "🔮", "🎭"];
    const tech = ["🎮", "🛡️", "⚡", "💎", "🎲", "📡", "🔧"];
    const elements = [...sports, ...fantasy, ...mental, ...tech];

    let pairs = [];
    let currentPairIndex = 0;
    let playerSymbol = "";
    let aiSymbol = "";
    let boardState = Array(9).fill(null);
    let gameOver = false;
    let isPlayerTurn = true;

    // توليد التوافيق الثنائية
    for (let i = 0; i < elements.length; i++) {
      for (let j = i + 1; j < elements.length; j++) {
        pairs.push([elements[i], elements[j]]);
      }
    }

    function updateDisplay() {
      document.getElementById("symbol1").textContent = pairs[currentPairIndex][0];
      document.getElementById("symbol2").textContent = pairs[currentPairIndex][1];
    }

    function prevPair() {
      currentPairIndex = (currentPairIndex - 1 + pairs.length) % pairs.length;
      updateDisplay();
    }

    function nextPair() {
      currentPairIndex = (currentPairIndex + 1) % pairs.length;
      updateDisplay();
    }

    function startGame() {
      playerSymbol = pairs[currentPairIndex][0];
      aiSymbol = pairs[currentPairIndex][1];
      document.querySelector(".selector").style.display = "none";
      document.querySelector(".choose-btn").style.display = "none";
      document.getElementById("board").style.display = "grid";
      renderBoard();
      updateStatus("دورك الآن");
    }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.onclick = () => playerMove(i);
        cell.textContent = boardState[i] || "";
        board.appendChild(cell);
      }
    }

    function playerMove(index) {
      if (gameOver || boardState[index] || !isPlayerTurn) return;
      boardState[index] = playerSymbol;
      renderBoard();
      if (checkWin(playerSymbol)) {
        updateStatus("🎉 فزت!");
        gameOver = true;
        return;
      }
      if (boardState.every(cell => cell)) {
        updateStatus("🤝 تعادل");
        gameOver = true;
        return;
      }
      isPlayerTurn = false;
      updateStatus("دور الخصم...");
      setTimeout(aiMove, 500);
    }

    function aiMove() {
      let move = findBestMove();
      boardState[move] = aiSymbol;
      renderBoard();
      if (checkWin(aiSymbol)) {
        updateStatus("❌ خسرت! الخصم فاز");
        gameOver = true;
        return;
      }
      if (boardState.every(cell => cell)) {
        updateStatus("🤝 تعادل");
        gameOver = true;
        return;
      }
      isPlayerTurn = true;
      updateStatus("دورك الآن");
    }

    function findBestMove() {
      // محاولة الفوز
      for (let i = 0; i < 9; i++) {
        if (!boardState[i]) {
          boardState[i] = aiSymbol;
          if (checkWin(aiSymbol)) {
            boardState[i] = null;
            return i;
          }
          boardState[i] = null;
        }
      }
      // منع اللاعب من الفوز
      for (let i = 0; i < 9; i++) {
        if (!boardState[i]) {
          boardState[i] = playerSymbol;
          if (checkWin(playerSymbol)) {
            boardState[i] = null;
            return i;
          }
          boardState[i] = null;
        }
      }
      // اختيار أول خانة متاحة
      for (let i = 0; i < 9; i++) {
        if (!boardState[i]) return i;
      }
    }

    function checkWin(symbol) {
      const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      return wins.some(line => 
        line.every(i => boardState[i] === symbol)
      );
    }

    function updateStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    updateDisplay();
  </script>

</body>
</html>
