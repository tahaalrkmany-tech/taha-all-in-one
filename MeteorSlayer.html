<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: none">
  <title>  | Meteor Slayer 2026</title>
  <!-- 
    ============================================================
    لعبة قاهر النيازك - TahaTechPro 2026
    * رسوميات واقعية محسنة مع نظام جسيمات متطور
    * نمطان للرسم: كلاسيكي وكرتوني
    * قصة سردية غامرة بدون إشارات شخصية
    * نظام رحمة يضمن فرصة دائمة للنجاة
    * 4 أنماط طائرات متوازنة
    ============================================================
  -->
  <style>
    :root {
      --bg: #010314;
      --hud-bg: rgba(5, 10, 30, 0.75);
      --glow: 0 0 20px rgba(70, 130, 255, 0.6);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Segoe UI', 'Cairo', sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }
    /* واجهة المستخدم */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
      z-index: 20;
    }
    .hud-item {
      background: var(--hud-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 7px 18px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      transition: 0.3s;
    }
    .hud-item.pulse {
      animation: pulse 0.5s ease-out;
    }
    @keyframes pulse {
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.18); border-color: #ffaa00; box-shadow: 0 0 30px #ffaa00; }
    }
    /* القوائم */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 18, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      z-index: 100;
      transition: opacity 0.4s;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .title {
      color: #fff;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 900;
      text-shadow: 0 0 45px #3f7fff, 0 0 80px #0044cc;
      letter-spacing: 3px;
      text-align: center;
    }
    .subtitle {
      color: #aab;
      font-size: 16px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }
    .menu-btn {
      padding: 14px 36px;
      font-size: 18px;
      font-weight: 700;
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 34px;
      cursor: pointer;
      background: rgba(255,255,255,0.07);
      color: #fff;
      backdrop-filter: blur(6px);
      min-width: 210px;
      text-align: center;
      transition: 0.3s;
      letter-spacing: 1px;
    }
    .menu-btn:hover {
      background: rgba(255,255,255,0.18);
      border-color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 0 35px rgba(80,150,255,0.5);
    }
    .menu-btn.accent {
      background: rgba(255,140,0,0.25);
      border-color: #ff8c00;
      animation: glowPulse 2s infinite;
    }
    @keyframes glowPulse {
      0%,100%{ box-shadow: 0 0 25px rgba(255,140,0,0.4); }
      50%{ box-shadow: 0 0 55px rgba(255,140,0,0.9); }
    }
    .plane-selector {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .plane-card {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 22px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      min-width: 100px;
    }
    .plane-card.selected {
      border-color: #ffb347;
      background: rgba(255,180,70,0.2);
      box-shadow: 0 0 35px #ffb347;
    }
    .plane-emoji { font-size: 42px; }
    /* صندوق القصة */
    #storyBox {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(14px);
      border: 1px solid #ffb347;
      border-radius: 28px;
      padding: 12px 28px;
      color: #fff;
      font-size: 17px;
      text-align: center;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      max-width: 92vw;
      box-shadow: 0 0 40px rgba(255,180,70,0.5);
    }
    #storyBox.show {
      opacity: 1;
    }
    #footer {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 2px;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-item" id="scoreHud">🏆 <span id="scoreVal">0</span></div>
    <div class="hud-item" id="levelHud">📊 المستوى <span id="levelVal">1</span></div>
    <div class="hud-item" id="livesHud">❤️ <span id="livesVal">3</span></div>
    <div class="hud-item" id="planeHud">🚀 <span id="planeName">مقاتلة</span></div>
    <div class="hud-item" id="shieldHud" style="display:none;">🛡️ نشط</div>
    <div class="hud-item" id="multHud" style="display:none;">✨ x<span id="multVal">2</span></div>
  </div>

  <div id="storyBox"></div>
  <div id="footer">TahaTechPro | 2026</div>

  <!-- القائمة الرئيسية -->
  <div id="mainMenu" class="overlay">
    <h1 class="title">☄️ قاهر النيازك</h1>
    <div class="subtitle">METEOR SLAYER</div>
    <div style="color:#ccc; margin-bottom:4px;">النمط: <span id="modeIndicator">كلاسيكي</span></div>
    <button class="menu-btn accent" onclick="startGame()">🔥 ابدأ القتال</button>
    <button class="menu-btn" onclick="showPlaneSelection()">✈️ اختر المركبة</button>
    <button class="menu-btn" onclick="toggleVisualMode()">🎨 النمط الرسومي</button>
    <button class="menu-btn" onclick="showHelp()">📖 الدليل</button>
  </div>

  <!-- قائمة الطائرات -->
  <div id="planeMenu" class="overlay hidden">
    <h2 style="color:#fff;">اختر مركبتك</h2>
    <div class="plane-selector" id="planeCards"></div>
    <button class="menu-btn" onclick="backToMenu()">✅ تأكيد</button>
  </div>

  <!-- نهاية اللعبة -->
  <div id="gameOverOverlay" class="overlay hidden">
    <h2 style="color:#ff4d4d; font-size:44px; text-shadow:0 0 35px red;">💔 انتهت المهمة</h2>
    <div style="color:#ffd700; font-size:28px;">النقاط: <span id="finalScore">0</span></div>
    <div style="color:#ccc;">المستوى: <span id="finalLevel">1</span></div>
    <div id="finalStoryMsg" style="color:#aaa; margin-top:8px;"></div>
    <button class="menu-btn accent" onclick="restartGame()">🔄 حاول مجدداً</button>
    <button class="menu-btn" onclick="backToMenu()">🏠 القائمة</button>
  </div>

  <script>
    (function() {
      // ==================== [ 1. الإعدادات الأساسية ] ====================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let W, H;
      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // DOM
      const mainMenu = document.getElementById('mainMenu');
      const planeMenu = document.getElementById('planeMenu');
      const gameOverOverlay = document.getElementById('gameOverOverlay');
      const storyBox = document.getElementById('storyBox');
      const scoreVal = document.getElementById('scoreVal');
      const levelVal = document.getElementById('levelVal');
      const livesVal = document.getElementById('livesVal');
      const planeNameEl = document.getElementById('planeName');
      const shieldHud = document.getElementById('shieldHud');
      const multHud = document.getElementById('multHud');
      const multVal = document.getElementById('multVal');
      const modeIndicator = document.getElementById('modeIndicator');
      const finalScore = document.getElementById('finalScore');
      const finalLevel = document.getElementById('finalLevel');
      const finalStoryMsg = document.getElementById('finalStoryMsg');
      const planeCardsContainer = document.getElementById('planeCards');

      // ==================== [ 2. الصوتيات المتطورة ] ====================
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      function playTone(freq, type, duration, vol = 0.12, glide = null) {
        if (!audioCtx) return;
        try {
          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          if (glide) osc.frequency.linearRampToValueAtTime(glide, t + duration);
          gain.gain.setValueAtTime(vol, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + duration);
        } catch (e) {}
      }
      const sfx = {
        shoot: () => playTone(750, 'square', 0.06, 0.07, 180),
        hit: () => playTone(45, 'sawtooth', 0.22, 0.15),
        explosion: () => { playTone(20, 'sawtooth', 0.4, 0.22); playTone(40, 'triangle', 0.25, 0.1); },
        powerUp: () => { playTone(380, 'sine', 0.09, 0.1, 780); playTone(520, 'sine', 0.07, 0.12, 1050); },
        combo: () => { playTone(480, 'sine', 0.08, 0.07, 920); playTone(650, 'sine', 0.06, 0.08, 1250); },
        levelUp: () => { playTone(280, 'sine', 0.12, 0.15, 580); playTone(450, 'sine', 0.1, 0.14, 780); },
        bossWarning: () => playTone(80, 'square', 0.45, 0.28, 150),
        shieldBreak: () => playTone(25, 'triangle', 0.38, 0.35),
      };

      // ==================== [ 3. حالة اللعبة ] ====================
      let gameRunning = false;
      let score = 0, level = 1, lives = 3;
      let comboCount = 0, comboTimer = 0;
      let shieldActive = false, shieldTimer = 0;
      let scoreMultiplier = 1, multiplierTimer = 0;
      let rapidFire = false, rapidFireTimer = 0;
      let spreadShot = false, spreadShotTimer = 0;
      let invincibleTimer = 0;
      let shakeAmount = 0;
      let bossActive = false, bossWarningTimer = 0;
      let frameCount = 0, lastTime = performance.now();
      let visualMode = 'classic'; // 'classic' | 'cartoon'

      // الطائرة وأنماطها
      const planeTypes = {
        fighter: { name: 'مقاتلة', speed: 11.5, fireRate: 0.21, invulnBonus: 0, desc: 'متوازنة الأداء' },
        rocket: { name: 'صاروخية', speed: 16, fireRate: 0.14, invulnBonus: 0, desc: 'سرعة فائقة وإطلاق نار سريع' },
        tank: { name: 'مدرعة', speed: 8, fireRate: 0.3, invulnBonus: 0, desc: 'بطيئة لكنها تبدأ بدرع مؤقت' },
        ghost: { name: 'شبحية', speed: 10.5, fireRate: 0.24, invulnBonus: 1.4, desc: 'فترة حصانة أطول بعد الإصابة' },
      };
      let currentPlaneType = 'fighter';
      let plane = {
        x: W / 2, y: H - 100, width: 68, height: 54,
        targetX: W / 2, tilt: 0, flashTimer: 0,
      };
      function applyPlaneStats() {
        const s = planeTypes[currentPlaneType];
        plane.speed = s.speed;
      }

      // الكيانات
      let bullets = [], enemies = [], particles = [], powerUps = [], scorePopups = [], stars = [];

      function initStars() {
        stars = [];
        for (let i = 0; i < 220; i++) {
          stars.push({
            x: Math.random() * W, y: Math.random() * H,
            radius: Math.random() * 2.6 + 0.3,
            speed: 22 + Math.random() * 65,
            twinkle: Math.random() * Math.PI * 2,
            twinkleSpeed: Math.random() * 2.2 + 1,
            layer: Math.floor(Math.random() * 3),
          });
        }
      }
      initStars();

      function spawnParticles(x, y, count, color, spd = 220, life = 0.65, size = 3.5) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = spd * (0.4 + Math.random());
          particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, color, size: size*(0.5+Math.random()) });
        }
      }
      function spawnPopup(x, y, text, color = '#ffd700') {
        scorePopups.push({ x, y, text, color, life: 1.15, maxLife: 1.15, vy: -120 });
      }

      function createEnemy(type = 'normal') {
        const r = type==='boss' ? 48+Math.random()*28 : type==='large' ? 26+Math.random()*18 : type==='fast' ? 10+Math.random()*9 : type==='ice' ? 14+Math.random()*13 : 12+Math.random()*18;
        const x = Math.random()*(W-r*2)+r;
        const y = -r - Math.random()*100;
        const baseSpd = type==='fast'?270:type==='boss'?75:130;
        const spd = baseSpd + Math.random()*90 + level*11;
        const hp = type==='boss'?8+level*3 : type==='large'?2+Math.floor(level/2) : type==='ice'?2+Math.floor(level/3) : 1;
        return { x,y,radius:r,speed:spd,hp,maxHp:hp,type,scoreValue:type==='boss'?220+level*45:type==='large'?35:type==='fast'?22:type==='ice'?28:12,
          wobble:Math.random()*Math.PI*2, wobbleSpeed:0.7+Math.random()*2, wobbleAmp:type==='boss'?0:(Math.random()*38+12), glowPhase:Math.random()*Math.PI*2 };
      }

      function createPowerUp(x, y, mercy = false) {
        const types = ['shield','rapidFire','spreadShot','multiplier','extraLife','bomb'];
        let weights = mercy ? [20,20,16,16,26,2] : [21,22,18,17,15,7];
        const total = weights.reduce((a,b)=>a+b,0);
        let r = Math.random()*total, idx=0, cum=0;
        for(let i=0;i<types.length;i++){ cum+=weights[i]; if(r<=cum){ idx=i; break; } }
        return { x,y,type:types[idx], radius:16, speed:80+Math.random()*48, glowPhase:Math.random()*Math.PI*2 };
      }

      // ==================== [ 4. السردية الواقعية ] ====================
      const storyMessages = [
        { score:0, msg:'🌌 الفضاء المظلم... إشارة استغاثة من كوكب بعيد.' },
        { score:70, msg:'🛰️ النيازك تقترب. النظام الشمسي في خطر.' },
        { score:180, msg:'💫 كل نيزك مدمر يكشف جزءاً من اللغز.' },
        { score:350, msg:'🛡️ المحطة الفضائية ترسل إمدادات. استمر.' },
        { score:550, msg:'👾 كائن فضائي معادٍ يظهر في الأفق.' },
        { score:800, msg:'✨ الطاقة الغامضة تتدفق. أنت أمل المجرة.' },
        { score:1100, msg:'🕳️ ثقب دودي ينفتح. الرحلة لم تنته بعد.' },
      ];
      let lastStoryIdx = -1, storyTimer = 0;
      function checkStory() {
        for(let i=storyMessages.length-1; i>=0; i--) {
          if(score >= storyMessages[i].score && i > lastStoryIdx) {
            showStory(storyMessages[i].msg);
            lastStoryIdx = i;
            break;
          }
        }
      }
      function showStory(msg) {
        storyBox.textContent = msg;
        storyBox.classList.add('show');
        storyTimer = 4.8;
      }

      // ==================== [ 5. الرحمة المتطورة ] ====================
      function mercySpawnInterval() {
        let base = 0.8 / (1 + level*0.14);
        if(lives <= 1) base *= 1.5;
        return Math.max(0.3, base);
      }
      function mercyPowerUp(x,y) { return createPowerUp(x,y,true); }

      // ==================== [ 6. آليات اللعب ] ====================
      function shoot() {
        if(!gameRunning) return;
        const s = planeTypes[currentPlaneType];
        const bx = plane.x, by = plane.y - plane.height/2;
        if(spreadShot) {
          for(let a=-2; a<=2; a++) {
            const ang = -Math.PI/2 + a*0.15;
            bullets.push({ x:bx, y:by, vx:Math.cos(ang)*880, vy:Math.sin(ang)*880, dmg:s.damage||1 });
          }
        } else {
          [-13,0,13].forEach(off => {
            bullets.push({ x:bx+off, y:by, vx:off*1.3, vy:-880, dmg:s.damage||1 });
          });
        }
        sfx.shoot();
        spawnParticles(bx, by, 4, '#ffaa22', 80, 0.14, 1.6);
      }

      function bomb() {
        enemies.forEach(e => {
          spawnParticles(e.x, e.y, 22, '#ff5e00', 340, 0.65, 5.5);
          spawnPopup(e.x, e.y, '+'+(e.scoreValue*scoreMultiplier), '#ffaa00');
          score += e.scoreValue * scoreMultiplier;
        });
        if(enemies.length>2) { comboCount+=enemies.length; comboTimer=2; }
        enemies = []; sfx.explosion(); shakeAmount=17;
        updateHUD();
      }

      function applyPowerUp(p) {
        sfx.powerUp();
        spawnParticles(p.x,p.y,18,'#ffffff',180,0.45,2.8);
        switch(p.type) {
          case 'shield': shieldActive=true; shieldTimer=11; pulseHud(shieldHud); break;
          case 'rapidFire': rapidFire=true; rapidFireTimer=7.5; break;
          case 'spreadShot': spreadShot=true; spreadShotTimer=8.5; break;
          case 'multiplier': scoreMultiplier=Math.min(scoreMultiplier+1,5); multiplierTimer=9.5; pulseHud(multHud); break;
          case 'extraLife': lives=Math.min(lives+1,5); pulseHud(document.getElementById('livesHud')); break;
          case 'bomb': bomb(); break;
        }
      }

      function updateHUD() {
        scoreVal.textContent = score;
        levelVal.textContent = level;
        livesVal.textContent = lives;
        planeNameEl.textContent = planeTypes[currentPlaneType].name;
        shieldHud.style.display = shieldActive ? 'flex' : 'none';
        multHud.style.display = scoreMultiplier>1 ? 'flex' : 'none';
        if(scoreMultiplier>1) multVal.textContent = scoreMultiplier;
      }
      function pulseHud(el) { el.classList.add('pulse'); setTimeout(()=>el.classList.remove('pulse'), 480); }

      function gameOver() {
        gameRunning = false;
        finalScore.textContent = score;
        finalLevel.textContent = level;
        finalStoryMsg.textContent = lastStoryIdx>=0 ? storyMessages[lastStoryIdx].msg : 'المجرة بحاجة إليك مجدداً.';
        gameOverOverlay.classList.remove('hidden');
        sfx.explosion();
      }

      function restartGame() {
        score=0; level=1; lives=3; comboCount=0; comboTimer=0;
        shieldActive=false; shieldTimer=0; scoreMultiplier=1; multiplierTimer=0;
        rapidFire=false; rapidFireTimer=0; spreadShot=false; spreadShotTimer=0;
        invincibleTimer=0; shakeAmount=0; bossActive=false; bossWarningTimer=0;
        bullets=[]; enemies=[]; particles=[]; powerUps=[]; scorePopups=[];
        plane.x=W/2; plane.targetX=W/2; plane.tilt=0; plane.flashTimer=0;
        window._shootCd=0; window._enemyCd=1;
        lastStoryIdx=-1; storyTimer=0; storyBox.classList.remove('show');
        gameOverOverlay.classList.add('hidden');
        gameRunning=true;
        updateHUD();
        lastTime=performance.now();
      }

      function startGame() {
        initAudio();
        restartGame();
        mainMenu.classList.add('hidden');
        planeMenu.classList.add('hidden');
        gameRunning=true;
        requestAnimationFrame(gameLoop);
      }

      function backToMenu() {
        gameRunning=false;
        mainMenu.classList.remove('hidden');
        planeMenu.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
      }

      function showPlaneSelection() {
        mainMenu.classList.add('hidden');
        planeMenu.classList.remove('hidden');
        renderPlaneCards();
      }

      function renderPlaneCards() {
        planeCardsContainer.innerHTML = '';
        Object.entries(planeTypes).forEach(([key, s]) => {
          const card = document.createElement('div');
          card.className = 'plane-card' + (currentPlaneType===key?' selected':'');
          card.innerHTML = `<div class="plane-emoji">${key==='fighter'?'✈️':key==='rocket'?'🚀':key==='tank'?'🛡️':'👻'}</div><div>${s.name}</div><small>${s.desc}</small>`;
          card.onclick = () => { currentPlaneType=key; applyPlaneStats(); renderPlaneCards(); };
          planeCardsContainer.appendChild(card);
        });
      }

      function toggleVisualMode() {
        visualMode = visualMode==='classic'?'cartoon':'classic';
        modeIndicator.textContent = visualMode==='classic'?'كلاسيكي':'كرتوني';
        initAudio();
      }

      function showHelp() {
        alert('📖 الدليل:\n\n🖱️ اسحب للتحكم.\n🔫 إطلاق نار تلقائي.\n💎 اجمع التعزيزات.\n👾 دمر الزعماء.\n❤️ نظام رحمة عند قلة الأرواح.\n📖 قصة تتطور مع تقدمك.\n\n© TahaTechPro 2026');
        initAudio();
      }

      window.startGame = startGame;
      window.toggleVisualMode = toggleVisualMode;
      window.showHelp = showHelp;
      window.restartGame = restartGame;
      window.backToMenu = backToMenu;
      window.showPlaneSelection = showPlaneSelection;

      // ==================== [ 7. حلقة التحديث ] ====================
      function update(dt) {
        if(!gameRunning) return;
        deltaTime = Math.min(dt, 0.1);
        frameCount++;

        // حركة الطائرة
        plane.x += (plane.targetX - plane.x) * Math.min(deltaTime*14, 1);
        plane.tilt += ((plane.targetX-plane.x)*0.01 - plane.tilt) * Math.min(deltaTime*11, 1);
        plane.x = Math.max(plane.width/2, Math.min(W-plane.width/2, plane.x));
        if(plane.flashTimer>0) plane.flashTimer-=dt;

        // مؤقتات
        if(invincibleTimer>0) invincibleTimer-=dt;
        if(shieldTimer>0) { shieldTimer-=dt; if(shieldTimer<=0&&shieldActive){ shieldActive=false; sfx.shieldBreak(); spawnParticles(plane.x,plane.y,28,'#0099ff',220,0.55,3.2); } }
        if(multiplierTimer>0) { multiplierTimer-=dt; if(multiplierTimer<=0) scoreMultiplier=1; }
        if(rapidFireTimer>0) { rapidFireTimer-=dt; if(rapidFireTimer<=0) rapidFire=false; }
        if(spreadShotTimer>0) { spreadShotTimer-=dt; if(spreadShotTimer<=0) spreadShot=false; }
        if(comboTimer>0) { comboTimer-=dt; if(comboTimer<=0) comboCount=0; }
        if(storyTimer>0) { storyTimer-=dt; if(storyTimer<=0) storyBox.classList.remove('show'); }

        // إطلاق نار
        const s = planeTypes[currentPlaneType];
        const interval = rapidFire ? s.fireRate*0.3 : s.fireRate;
        if(!window._shootCd) window._shootCd=0;
        window._shootCd -= dt;
        if(window._shootCd <= 0) { shoot(); window._shootCd = interval; }

        // ظهور الأعداء
        if(!window._enemyCd) window._enemyCd=0;
        window._enemyCd -= dt;
        if(window._enemyCd<=0 && !bossActive) {
          let type='normal'; const r=Math.random();
          if(r<0.07&&level>=3) type='large';
          else if(r<0.15&&level>=2) type='fast';
          else if(r<0.25&&level>=2) type='ice';
          enemies.push(createEnemy(type));
          window._enemyCd = mercySpawnInterval() * (0.8+Math.random()*0.5);
        }

        // تحريك الكيانات
        bullets.forEach(b=>{ b.x+=b.vx*dt; b.y+=b.vy*dt; });
        bullets = bullets.filter(b=>b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);
        enemies.forEach(e=>{ e.y+=e.speed*dt; e.wobble+=e.wobbleSpeed*dt; e.glowPhase+=dt*3.5; if(!e.isBoss&&e.wobbleAmp>0) e.x+=Math.sin(e.wobble)*e.wobbleAmp*dt; e.x=Math.max(e.radius,Math.min(W-e.radius,e.x)); });
        enemies = enemies.filter(e=>e.y<H+100);
        powerUps.forEach(p=>{ p.y+=p.speed*dt; p.glowPhase+=dt*4; });
        powerUps = powerUps.filter(p=>p.y<H+45);
        particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; });
        particles = particles.filter(p=>p.life>0);
        scorePopups.forEach(p=>{ p.y+=p.vy*dt; p.life-=dt; });
        scorePopups = scorePopups.filter(p=>p.life>0);
        stars.forEach(s=>{ s.y+=s.speed*dt; s.twinkle+=s.twinkleSpeed*dt; if(s.y>H+12){ s.y=-12; s.x=Math.random()*W; } });

        // تصادمات
        for(let bi=bullets.length-1; bi>=0; bi--) {
          const b = bullets[bi]; let hit=false;
          for(let ei=enemies.length-1; ei>=0; ei--) {
            const e = enemies[ei];
            if(Math.hypot(b.x-e.x, b.y-e.y) < e.radius+6) {
              e.hp -= b.dmg; hit=true;
              spawnParticles(b.x,b.y,5,'#ff9900',150,0.28,2.2);
              sfx.hit();
              if(e.hp<=0) {
                spawnParticles(e.x,e.y, e.type==='boss'?48:18, e.type==='ice'?'#77ccff':'#ff4400', 300,0.65,4.5);
                spawnPopup(e.x,e.y, '+'+(e.scoreValue*scoreMultiplier), '#ffd700');
                score += e.scoreValue*scoreMultiplier;
                comboCount++; comboTimer=2.3;
                if(comboCount>=5) sfx.combo();
                if(e.type==='boss') { sfx.explosion(); shakeAmount=22; bossActive=false; for(let pu=0; pu<2; pu++) powerUps.push(mercyPowerUp(e.x+(Math.random()-0.5)*60, e.y)); }
                else { shakeAmount=Math.max(shakeAmount, e.type==='large'?8:3); if(Math.random()<(e.type==='large'?0.5:e.type==='ice'?0.28:0.14)) powerUps.push(mercyPowerUp(e.x,e.y)); }
                enemies.splice(ei,1);
                const nl = Math.floor(score/140)+1;
                if(nl>level) { level=nl; sfx.levelUp(); pulseHud(document.getElementById('levelHud')); }
                checkStory();
              }
              break;
            }
          }
          if(hit) bullets.splice(bi,1);
        }

        if(invincibleTimer<=0) {
          for(let ei=enemies.length-1; ei>=0; ei--) {
            const e = enemies[ei];
            if(Math.hypot(plane.x-e.x, plane.y-e.y) < e.radius+plane.width*0.32) {
              if(shieldActive) {
                shieldActive=false; shieldTimer=0; sfx.shieldBreak();
                spawnParticles(plane.x,plane.y,32,'#00aaff',260,0.6,4);
                enemies.splice(ei,1); shakeAmount=11; invincibleTimer=1.5;
              } else {
                lives--; pulseHud(document.getElementById('livesHud'));
                sfx.explosion(); spawnParticles(plane.x,plane.y,42,'#ff3333',320,0.75,5.5);
                shakeAmount=20; invincibleTimer=2.3 + planeTypes[currentPlaneType].invulnBonus;
                plane.flashTimer=invincibleTimer; comboCount=0; comboTimer=0;
                if(lives<=0) { gameOver(); return; }
              }
              updateHUD();
              break;
            }
          }
        }

        for(let pi=powerUps.length-1; pi>=0; pi--) {
          const p = powerUps[pi];
          if(Math.hypot(plane.x-p.x, plane.y-p.y) < p.radius+plane.width*0.38) {
            applyPowerUp(p);
            powerUps.splice(pi,1);
          }
        }

        if(shakeAmount>0) shakeAmount *= Math.exp(-dt*7.5);
        updateHUD();
      }

      // ==================== [ 8. الرسم الواقعي ] ====================
      function drawStars() {
        stars.forEach(s => {
          const alpha = 0.25 + Math.sin(s.twinkle)*0.35 + 0.3;
          const sz = s.radius * (0.7+Math.sin(s.twinkle*1.8)*0.3);
          ctx.fillStyle = visualMode==='cartoon' ? `rgba(255,245,200,${alpha})` : `rgba(190,210,255,${alpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, sz, 0, Math.PI*2);
          ctx.fill();
          if(visualMode==='classic' && sz>1.4 && Math.sin(s.twinkle)>0.7) {
            ctx.fillStyle = `rgba(255,255,255,${alpha*0.5})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, sz*2.2, 0, Math.PI*2); ctx.fill();
          }
        });
      }

      function drawPlane() {
        ctx.save(); ctx.translate(plane.x, plane.y); ctx.rotate(plane.tilt*0.5);
        if(invincibleTimer>0 && Math.floor(invincibleTimer*15)%2===0) ctx.globalAlpha=0.45;
        const w=plane.width, h=plane.height;
        if(visualMode==='cartoon') {
          ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=3;
          ctx.fillStyle='#ff6b6b';
          ctx.beginPath(); ctx.ellipse(0,-h*0.05,w*0.42,h*0.44,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.fillStyle='#4ecdc4';
          ctx.beginPath(); ctx.arc(0,-h*0.14,w*0.19,0,Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-w*0.05,-h*0.18,w*0.05,0,Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(w*0.05,-h*0.18,w*0.05,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='#1a1a2e'; ctx.beginPath(); ctx.arc(-w*0.06,-h*0.2,2.5,0,Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(w*0.04,-h*0.2,2.5,0,Math.PI*2); ctx.fill();
        } else {
          const grad = ctx.createLinearGradient(0,-h/2,0,h/2);
          grad.addColorStop(0,'#d8e0f0'); grad.addColorStop(0.6,'#667799'); grad.addColorStop(1,'#2a3a55');
          ctx.fillStyle=grad;
          ctx.beginPath(); ctx.moveTo(0,-h/2);
          ctx.bezierCurveTo(-w*0.32,-h*0.25,-w*0.38,h*0.2,-w*0.22,h*0.38);
          ctx.lineTo(w*0.22,h*0.38);
          ctx.bezierCurveTo(w*0.38,h*0.2,w*0.32,-h*0.25,0,-h/2);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1.8; ctx.stroke();
          const cGrad = ctx.createRadialGradient(0,-h*0.1,w*0.05,0,-h*0.1,w*0.24);
          cGrad.addColorStop(0,'#b0ddff'); cGrad.addColorStop(0.6,'#3377bb'); cGrad.addColorStop(1,'#0a2244');
          ctx.fillStyle=cGrad; ctx.beginPath(); ctx.ellipse(0,-h*0.1,w*0.22,h*0.22,0,0,Math.PI*2); ctx.fill();
        }
        if(shieldActive) {
          ctx.globalAlpha=0.4+Math.sin(frameCount*0.18)*0.3;
          ctx.fillStyle='rgba(0,190,255,0.2)'; ctx.beginPath(); ctx.arc(0,0,w*0.78,0,Math.PI*2); ctx.fill();
          ctx.strokeStyle='#88eeff'; ctx.lineWidth=2.5; ctx.stroke();
          ctx.globalAlpha=1;
        }
        ctx.restore();
      }

      function drawEnemies() {
        enemies.forEach(e => {
          ctx.save(); ctx.translate(e.x, e.y);
          if(visualMode==='cartoon') {
            ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=3;
            ctx.fillStyle = e.type==='ice'?'#88ddff':e.type==='fast'?'#ff9f43':e.type==='large'?'#ee5a24':e.type==='boss'?'#a0298b':'#c8a882';
            ctx.beginPath(); ctx.arc(0,0,e.radius,0,Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-e.radius*0.25,-e.radius*0.2,e.radius*0.22,0,Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(e.radius*0.25,-e.radius*0.2,e.radius*0.22,0,Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle='#1a1a2e'; ctx.beginPath(); ctx.arc(-e.radius*0.25,-e.radius*0.18,2.2,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(e.radius*0.25,-e.radius*0.18,2.2,0,Math.PI*2); ctx.fill();
          } else {
            const grad = ctx.createRadialGradient(0,0,e.radius*0.15,0,0,e.radius);
            grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.5,'#cc8844'); grad.addColorStop(1,'#331100');
            ctx.fillStyle=grad; ctx.shadowColor='#ff6611'; ctx.shadowBlur=12;
            ctx.beginPath(); ctx.arc(0,0,e.radius,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
          }
          if(e.maxHp>2) {
            const bw=e.radius*1.5; ctx.fillStyle='#222'; ctx.fillRect(-bw/2,-e.radius-14,bw,5);
            ctx.fillStyle='#ff4444'; ctx.fillRect(-bw/2,-e.radius-14,bw*(e.hp/e.maxHp),5);
          }
          ctx.restore();
        });
      }

      function drawBullets() {
        bullets.forEach(b => {
          ctx.fillStyle = visualMode==='cartoon' ? '#ffdd00' : '#ffffff';
          ctx.shadowColor = visualMode==='classic' ? '#ffaa00' : 'transparent';
          ctx.shadowBlur = visualMode==='classic' ? 9 : 0;
          ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, Math.PI*2); ctx.fill();
          ctx.shadowBlur=0;
        });
      }

      function drawPowerUps() {
        powerUps.forEach(p => {
          ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='#000'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(p.type==='extraLife'?'❤️':p.type==='bomb'?'💣':'?', p.x, p.y);
        });
      }

      function drawParticles() {
        particles.forEach(p => {
          ctx.globalAlpha = p.life/p.maxLife;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha=1;
        scorePopups.forEach(p => {
          ctx.globalAlpha = p.life/p.maxLife;
          ctx.fillStyle = p.color;
          ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
          ctx.fillText(p.text, p.x, p.y);
        });
        ctx.globalAlpha=1;
      }

      function render() {
        ctx.clearRect(0,0,W,H);
        ctx.save();
        if(shakeAmount>0.1) {
          const sx=(Math.random()-0.5)*shakeAmount, sy=(Math.random()-0.5)*shakeAmount;
          ctx.translate(sx,sy);
        }
        ctx.fillStyle = visualMode==='cartoon' ? '#110522' : '#000015';
        ctx.fillRect(-15,-15,W+30,H+30);
        drawStars(); drawPowerUps(); drawEnemies(); drawBullets(); drawPlane(); drawParticles();
        ctx.restore();
      }

      function gameLoop(ts) {
        if(gameRunning) {
          const dt=(ts-lastTime)/1000;
          lastTime=ts;
          if(dt>0&&dt<0.5) update(dt);
        } else lastTime=ts;
        render();
        requestAnimationFrame(gameLoop);
      }

      // ==================== [ 9. التحكم ] ====================
      function handleMove(cx) {
        if(!gameRunning) return;
        const rect = canvas.getBoundingClientRect();
        plane.targetX = cx - rect.left;
        plane.targetX = Math.max(plane.width/2, Math.min(W-plane.width/2, plane.targetX));
      }
      canvas.addEventListener('mousemove', e=>handleMove(e.clientX));
      canvas.addEventListener('touchmove', e=>{ e.preventDefault(); handleMove(e.touches[0].clientX); }, {passive:false});
      canvas.addEventListener('touchstart', e=>{ e.preventDefault(); initAudio(); handleMove(e.touches[0].clientX); }, {passive:false});
      canvas.addEventListener('click', ()=>initAudio());

      // بدء التشغيل
      applyPlaneStats();
      updateHUD();
      renderPlaneCards();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
