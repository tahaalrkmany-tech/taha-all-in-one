<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم + طقس | Taha alrakamany-Teck</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f9ff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9f0f5;
        }
        h1 {
            font-size: 26px;
            color: #1e3c72;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sub {
            font-size: 14px;
            color: #4a627a;
            margin-bottom: 24px;
            border-right: 3px solid #2a7faa;
            padding-right: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
        .card {
            background: #fafdff;
            border-radius: 18px;
            padding: 18px 16px 20px;
            border: 1px solid #e2edf5;
            transition: 0.2s;
        }
        .card:hover {
            border-color: #cbdff2;
        }
        .card h2 {
            font-size: 18px;
            color: #1e3c72;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .lang-row select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 30px;
            border: 2px solid #dce7f0;
            background: white;
            font-size: 14px;
            min-width: 80px;
        }
        textarea, .weather-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: 2px solid #dce7f0;
            font-size: 15px;
            font-family: inherit;
            background: white;
            transition: 0.2s;
            resize: vertical;
        }
        textarea:focus, .lang-row select:focus, .weather-input:focus {
            border-color: #2a7faa;
            outline: none;
            box-shadow: 0 0 0 4px rgba(42, 127, 170, 0.08);
        }
        textarea {
            min-height: 100px;
        }
        .btn {
            background: #2a5298;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background: #1e3c72;
            transform: translateY(-2px);
        }
        .result-box {
            background: #f2f8ff;
            border-radius: 16px;
            padding: 14px 16px;
            margin-top: 12px;
            border: 1px solid #d6e6f5;
            min-height: 60px;
            color: #1e3c72;
            line-height: 1.6;
            font-size: 15px;
        }
        .weather-input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .weather-input-group input {
            flex: 2;
            min-width: 120px;
        }
        .weather-input-group button {
            flex: 1;
            min-width: 80px;
            background: #1f6e8c;
        }
        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .weather-item {
            background: #eef4fa;
            border-radius: 12px;
            padding: 8px 12px;
            text-align: center;
            font-size: 14px;
            color: #1e3c72;
        }
        .weather-item strong {
            display: block;
            font-size: 20px;
        }
        footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #6f8eae;
            border-top: 1px solid #e2edf5;
            padding-top: 16px;
        }
        footer a {
            color: #1e3c72;
            text-decoration: none;
            font-weight: 600;
        }
        .error-msg {
            color: #b13e3e;
            background: #ffe8e5;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌐 مترجم + طقس</h1>
    <div class="sub">ترجمة فورية بين العربية والإنجليزية • طقس حقيقي لأي مدينة</div>

    <div class="grid">
        <!-- مترجم -->
        <div class="card">
            <h2>📖 مترجم</h2>
            <div class="lang-row">
                <select id="srcLang">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
                <select id="tgtLang">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
            <textarea id="inputText" placeholder="اكتب النص هنا..."></textarea>
            <button class="btn" id="translateBtn">ترجم</button>
            <div class="result-box" id="translatedResult">⏳ الترجمة ستظهر هنا</div>
        </div>

        <!-- طقس -->
        <div class="card">
            <h2>🌦️ طقس</h2>
            <div class="weather-input-group">
                <input type="text" id="cityInput" class="weather-input" placeholder="اسم المدينة" value="دمشق">
                <button class="btn" id="weatherBtn" style="margin-top:0;">جلب</button>
            </div>
            <div class="result-box" id="weatherResult">⏳ بيانات الطقس ستظهر هنا</div>
            <div id="weatherExtra" style="font-size:12px;color:#4a627a;margin-top:6px;"></div>
        </div>
    </div>

    <footer>
        © 2026 Taha alrakamany-Teck | <a href="https://t.me/superTsybot" target="_blank">@superTsybot</a>
    </footer>
</div>

<script>
    (function() {
        // ---------- الترجمة ----------
        const srcLang = document.getElementById('srcLang');
        const tgtLang = document.getElementById('tgtLang');
        const inputText = document.getElementById('inputText');
        const translateBtn = document.getElementById('translateBtn');
        const translatedResult = document.getElementById('translatedResult');

        // منع تطابق اللغات تلقائياً
        function syncLangs() {
            if (srcLang.value === tgtLang.value) {
                tgtLang.value = (srcLang.value === 'ar') ? 'en' : 'ar';
            }
        }
        srcLang.addEventListener('change', syncLangs);
        tgtLang.addEventListener('change', syncLangs);

        async function translate(text, source, target) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('فشل الاتصال');
                const data = await resp.json();
                if (data && data[0] && data[0][0] && data[0][0][0]) {
                    return data[0][0][0];
                }
                return '⚠️ لم يتم العثور على ترجمة.';
            } catch {
                return '❌ خطأ في الترجمة، تأكد من الاتصال.';
            }
        }

        translateBtn.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (!text) {
                translatedResult.innerText = '✏️ الرجاء إدخال نص.';
                return;
            }
            translatedResult.innerText = '⏳ جاري الترجمة...';
            const result = await translate(text, srcLang.value, tgtLang.value);
            translatedResult.innerText = result;
        });

        // Enter للترجمة
        inputText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                translateBtn.click();
            }
        });

        // ---------- الطقس ----------
        const cityInput = document.getElementById('cityInput');
        const weatherBtn = document.getElementById('weatherBtn');
        const weatherResult = document.getElementById('weatherResult');
        const weatherExtra = document.getElementById('weatherExtra');

        async function getCoordinates(city) {
            try {
                const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ar&format=json`;
                const resp = await fetch(url);
                const data = await resp.json();
                if (data.results && data.results.length > 0) {
                    const { latitude, longitude, name, country } = data.results[0];
                    return { lat: latitude, lon: longitude, name, country };
                }
                return null;
            } catch {
                return null;
            }
        }

        async function fetchWeather(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,windspeed_10m&timezone=auto`;
                const resp = await fetch(url);
                const data = await resp.json();
                const current = data.current_weather;
                if (!current) return null;
                let humidity = 'غير متاح';
                if (data.hourly && data.hourly.relativehumidity_2m && data.hourly.time) {
                    const now = new Date();
                    const currentHour = now.toISOString().slice(0, 13) + ':00';
                    const idx = data.hourly.time.indexOf(currentHour);
                    if (idx !== -1 && data.hourly.relativehumidity_2m[idx] !== undefined) {
                        humidity = data.hourly.relativehumidity_2m[idx] + '%';
                    }
                }
                const desc = getWeatherDesc(current.weathercode || 0);
                return {
                    temp: current.temperature,
                    wind: current.windspeed,
                    humidity,
                    desc,
                    code: current.weathercode
                };
            } catch {
                return null;
            }
        }

        function getWeatherDesc(code) {
            const map = {
                0: '☀️ صافي', 1: '🌤️ غالباً صافي', 2: '⛅ غائم جزئياً', 3: '☁️ غائم',
                45: '🌫️ ضباب', 48: '🌫️ ضباب متجمد',
                51: '🌦️ رذاذ خفيف', 53: '🌧️ رذاذ متوسط', 55: '🌧️ رذاذ كثيف',
                56: '❄️ رذاذ متجمد', 57: '❄️ رذاذ متجمد كثيف',
                61: '🌧️ مطر خفيف', 63: '🌧️ مطر متوسط', 65: '🌧️ مطر غزير',
                71: '❄️ ثلوج خفيفة', 73: '❄️ ثلوج متوسطة', 75: '❄️ ثلوج كثيفة',
                80: '🌧️ زخات مطر خفيفة', 81: '🌧️ زخات مطر متوسطة', 82: '🌧️ زخات مطر غزيرة',
                95: '⛈️ عاصفة رعدية', 96: '⛈️ عواصف رعدية مع بَرَد خفيف', 99: '⛈️ عواصف رعدية مع بَرَد كثيف'
            };
            return map[code] || '🌡️ متغير';
        }

        weatherBtn.addEventListener('click', async () => {
            const city = cityInput.value.trim();
            if (!city) {
                weatherResult.innerText = '❌ أدخل اسم مدينة.';
                return;
            }
            weatherResult.innerText = '⏳ جلب بيانات الطقس...';
            weatherExtra.innerText = '';
            const coords = await getCoordinates(city);
            if (!coords) {
                weatherResult.innerText = `😞 لم يتم العثور على "${city}".`;
                return;
            }
            const data = await fetchWeather(coords.lat, coords.lon);
            if (!data) {
                weatherResult.innerText = '⚠️ خطأ في جلب بيانات الطقس.';
                return;
            }
            weatherResult.innerHTML = `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;">
                    <div class="weather-item"><strong>${data.temp}°C</strong>الحرارة</div>
                    <div class="weather-item"><strong>${data.humidity}</strong>الرطوبة</div>
                    <div class="weather-item"><strong>${data.wind} كم/س</strong>الرياح</div>
                    <div class="weather-item"><strong>${data.desc}</strong>الحالة</div>
                </div>
            `;
            weatherExtra.innerText = `📍 ${coords.name}${coords.country ? '، ' + coords.country : ''} • تحديث فوري`;
        });

        // تحميل الطقس الافتراضي
        async function loadDefaultWeather() {
            const coords = await getCoordinates('دمشق');
            if (coords) {
                const data = await fetchWeather(coords.lat, coords.lon);
                if (data) {
                    weatherResult.innerHTML = `
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;">
                            <div class="weather-item"><strong>${data.temp}°C</strong>الحرارة</div>
                            <div class="weather-item"><strong>${data.humidity}</strong>الرطوبة</div>
                            <div class="weather-item"><strong>${data.wind} كم/س</strong>الرياح</div>
                            <div class="weather-item"><strong>${data.desc}</strong>الحالة</div>
                        </div>
                    `;
                    weatherExtra.innerText = `📍 دمشق، سوريا • تحديث فوري`;
                }
            }
        }
        loadDefaultWeather();

        // Enter للطقس
        cityInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                weatherBtn.click();
            }
        });

        syncLangs();
    })();
</script>
</body>
</html>
