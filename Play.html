<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المشغل | Taha alrakamany-Teck</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1b2a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-size: 18px;
            background: #0d1b2a;
            z-index: 2;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .loading.hidden {
            opacity: 0;
        }
        .loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 215, 0, 0.2);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.85);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 3;
            display: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .error-msg.show {
            display: block;
        }
        .back-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 4;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
            color: #ffd700;
        }
        .back-btn i { font-size: 14px; }
    </style>
</head>
<body>

    <div class="loading" id="loadingIndicator">
        <div class="spinner"></div>
        <span>⏳ جاري تحميل المحتوى...</span>
    </div>

    <div class="error-msg" id="errorMsg">⚠️ تعذر تحميل الملف. حاول مرة أخرى.</div>

    <a href="javascript:history.back()" class="back-btn">↩️ رجوع</a>

    <iframe id="gameFrame" src=""></iframe>

    <script>
        (function() {
            const frame = document.getElementById('gameFrame');
            const loading = document.getElementById('loadingIndicator');
            const errorMsg = document.getElementById('errorMsg');
            let loadTimeout = null;
            let isLoaded = false;

            // استخراج اسم الملف من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            let file = urlParams.get('file');

            // إذا لم يكن هناك ملف، نستخدم ملفاً افتراضياً
            if (!file) {
                file = 'index.html';
            }

            // إزالة أي ترميز زائد
            file = decodeURIComponent(file);

            // تنظيف المسار (إزالة ../ أو أي محاولة للهروب)
            const cleanFile = file.replace(/\.\.\//g, '').replace(/^\/+/, '');
            const fullUrl = cleanFile;

            // تعيين المصدر
            frame.src = fullUrl;

            // --- إدارة التحميل ---
            function showLoading() {
                loading.classList.remove('hidden');
                errorMsg.classList.remove('show');
                isLoaded = false;
                if (loadTimeout) clearTimeout(loadTimeout);
                loadTimeout = setTimeout(() => {
                    if (!isLoaded) {
                        loading.classList.add('hidden');
                        errorMsg.classList.add('show');
                    }
                }, 12000); // 12 ثانية كحد أقصى للتحميل
            }

            function hideLoading() {
                isLoaded = true;
                loading.classList.add('hidden');
                if (loadTimeout) {
                    clearTimeout(loadTimeout);
                    loadTimeout = null;
                }
            }

            // --- أحداث الـ iframe ---
            frame.addEventListener('load', function() {
                hideLoading();
            });

            // في حالة حدوث خطأ في الـ iframe
            frame.addEventListener('error', function() {
                hideLoading();
                errorMsg.classList.add('show');
            });

            // بدء التحميل
            showLoading();

            // --- إعادة المحاولة عند النقر على رسالة الخطأ ---
            errorMsg.addEventListener('click', function() {
                errorMsg.classList.remove('show');
                frame.src = fullUrl;
                showLoading();
            });

            // --- عند العودة من الخلف (history) ---
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    // إذا تم استرجاع الصفحة من الكاش، نعيد تحميل الإطار
                    frame.src = fullUrl;
                    showLoading();
                }
            });

            // --- تصحيح: بعض المتصفحات قد لا تطلق حدث load إذا كان الملف مخزناً في الكاش ---
            // نضغط على التحميل بعد 3 ثوانٍ كحل احتياطي
            setTimeout(function() {
                if (!isLoaded) {
                    // إذا لم يتم التحميل بعد 3 ثوانٍ، نحاول مرة أخرى
                    hideLoading();
                }
            }, 3000);

        })();
    </script>

</body>
</html>
