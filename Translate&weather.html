<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم + طقس | Taha-tech2026</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f9ff; font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 16px; direction: rtl;
        }
        .container {
            max-width: 980px; width: 100%; background: #ffffff;
            border-radius: 28px; padding: 28px 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06); border: 1px solid #e9f0f5;
        }
        h1 { font-size: 26px; color: #1e3c72; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
        .sub { font-size: 14px; color: #4a627a; margin-bottom: 24px; border-right: 3px solid #2a7faa; padding-right: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 750px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: #fafdff; border-radius: 18px; padding: 18px 16px 20px;
            border: 1px solid #e2edf5; transition: 0.2s;
        }
        .card:hover { border-color: #cbdff2; }
        .card h2 { font-size: 18px; color: #1e3c72; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .lang-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .lang-row select { flex: 1; padding: 8px 10px; border-radius: 30px; border: 2px solid #dce7f0; background: white; font-size: 14px; min-width: 70px; }
        .swap-btn {
            background: #e8f0f8; border: 2px solid #dce7f0; border-radius: 50%;
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; transition: 0.2s; color: #1e3c72; flex-shrink: 0;
        }
        .swap-btn:hover { background: #d0e2f2; transform: rotate(180deg); }
        textarea, .weather-input {
            width: 100%; padding: 12px 14px; border-radius: 16px; border: 2px solid #dce7f0;
            font-size: 15px; font-family: inherit; background: white; transition: 0.2s; resize: vertical;
        }
        textarea:focus, .lang-row select:focus, .weather-input:focus, .country-select:focus, .location-select:focus {
            border-color: #2a7faa; outline: none; box-shadow: 0 0 0 4px rgba(42,127,170,0.08);
        }
        textarea { min-height: 100px; }
        .btn {
            background: #2a5298; border: none; color: white; padding: 10px 18px;
            border-radius: 40px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: 0.2s; width: 100%; margin-top: 10px;
        }
        .btn:hover { background: #1e3c72; transform: translateY(-2px); }
        .btn-sm { width: auto; padding: 8px 14px; font-size: 13px; margin-top: 0; background: #3a6ea5; }
        .btn-locate { background: #2d6a4f; margin-top: 6px; }
        .btn-locate:hover { background: #1b4d36; }
        .btn-map {
            background: #c25a3c; margin-top: 6px; width: auto; display: inline-flex;
            align-items: center; gap: 4px; padding: 6px 14px; font-size: 13px;
            text-decoration: none; color: white; border-radius: 40px; font-weight: 600; transition: 0.2s;
        }
        .btn-map:hover { background: #a0462c; }
        .result-box {
            background: #f2f8ff; border-radius: 16px; padding: 14px 16px; margin-top: 12px;
            border: 1px solid #d6e6f5; min-height: 60px; color: #1e3c72; line-height: 1.6; font-size: 15px;
        }
        .weather-input-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .weather-input-group input { flex: 2; min-width: 110px; }
        .weather-input-group .country-select { flex: 1; min-width: 90px; padding: 10px 8px; border-radius: 30px; border: 2px solid #dce7f0; background: white; font-size: 13px; }
        .weather-input-group button { flex: 1; min-width: 70px; background: #1f6e8c; }
        .weather-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .weather-item { background: #eef4fa; border-radius: 12px; padding: 8px 10px; text-align: center; font-size: 13px; color: #1e3c72; }
        .weather-item strong { display: block; font-size: 20px; }
        .weather-item .margin { font-size: 10px; color: #4a627a; }
        .map-link-container { margin-top: 8px; text-align: left; }
        .update-badge { display: inline-block; background: #e0f2e9; color: #1b5e3a; font-size: 11px; padding: 2px 10px; border-radius: 20px; margin-top: 4px; }
        footer { margin-top: 28px; text-align: center; font-size: 13px; color: #6f8eae; border-top: 1px solid #e2edf5; padding-top: 16px; }
        .forecast-title { font-size: 16px; color: #1e3c72; margin: 16px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .forecast-table { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; overflow-x: auto; }
        .forecast-day { background: #f0f6fd; border-radius: 10px; padding: 6px 4px; text-align: center; font-size: 12px; border: 1px solid #dce7f0; }
        .forecast-day .day-name { font-weight: bold; margin-bottom: 4px; }
        .forecast-day .temps { margin: 4px 0; display: flex; justify-content: center; gap: 6px; }
        .forecast-day .high { color: #b13e3e; font-weight: bold; }
        .forecast-day .low { color: #2a7faa; font-weight: bold; }
        .forecast-day .rain { font-size: 11px; color: #1f6e8c; }
        .no-forecast { background: #ffe8e5; color: #b13e3e; padding: 8px; border-radius: 10px; font-size: 13px; margin-top: 8px; }

        /* تنسيق قائمة اختيار الموقع */
        .location-select-container {
            margin-top: 8px;
            display: none;
        }
        .location-select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 30px;
            border: 2px solid #dce7f0;
            background: white;
            font-size: 13px;
        }
        .location-note {
            font-size: 12px;
            color: #b13e3e;
            margin-bottom: 4px;
        }
        @media (max-width: 500px) { .forecast-table { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>
<div class="container">
    <h1>🌐 مترجم + طقس</h1>
    <div class="sub">ترجمة دقيقة اكثر من20 لغة وطقس ببيانات دقيقة</div>

    <div class="grid">
        <!-- بطاقة المترجم -->
        <div class="card">
            <h2>📖 مترجم</h2>
            <div class="lang-row">
                <select id="srcLang"></select>
                <button class="swap-btn" id="swapLangBtn" title="تبديل اللغات">⇄</button>
                <select id="tgtLang"></select>
            </div>
            <textarea id="inputText" placeholder="اكتب النص هنا..."></textarea>
            <button class="btn" id="translateBtn">ترجم</button>
            <div class="result-box" id="translatedResult">⏳ الترجمة ستظهر هنا</div>
        </div>

        <!-- بطاقة الطقس -->
        <div class="card">
            <h2>🌦️ طقس</h2>
            <div class="weather-input-group">
                <input type="text" id="cityInput" class="weather-input" placeholder="اسم المدينة أو القرية (أو 'موقعي')" value="دمشق">
                <select id="countrySelect" class="country-select">
                    <option value="">🌍 كل الدول</option>
                    <option value="sy" selected>🇸🇾 سوريا</option>
                    <option value="eg">🇪🇬 مصر</option>
                    <option value="sa">🇸🇦 السعودية</option>
                    <option value="ae">🇦🇪 الإمارات</option>
                    <option value="iq">🇮🇶 العراق</option>
                    <option value="jo">🇯🇴 الأردن</option>
                    <option value="lb">🇱🇧 لبنان</option>
                    <option value="ye">🇾🇪 اليمن</option>
                    <option value="ma">🇲🇦 المغرب</option>
                    <option value="dz">🇩🇿 الجزائر</option>
                    <option value="tn">🇹🇳 تونس</option>
                    <option value="ly">🇱🇾 ليبيا</option>
                    <option value="ps">🇵🇸 فلسطين</option>
                </select>
                <button class="btn" id="weatherBtn" style="margin-top:0;">جلب</button>
            </div>
            <!-- قائمة اختيار الموقع عند التضارب -->
            <div class="location-select-container" id="locationSelectContainer">
                <div class="location-note">⚠️ توجد عدة مناطق بهذا الاسم. اختر منطقتك (النوع يساعدك):</div>
                <select class="location-select" id="locationSelect"></select>
            </div>
            <button class="btn btn-sm btn-locate" id="locateBtn">📍 استخدم موقعي الحالي</button>
            <div class="result-box" id="weatherResult">⏳ بيانات الطقس ستظهر هنا</div>
            <div id="forecastContainer"></div>
            <div id="mapLinkContainer" class="map-link-container" style="display: none;">
                <a href="#" target="_blank" class="btn-map" id="mapLink">🗺️ عرض الموقع على خرائط جوجل</a>
            </div>
            <div id="weatherExtra" style="font-size:12px;color:#4a627a;margin-top:6px;"></div>
            <div class="update-badge" id="autoUpdateBadge" style="display:none;">🔄 تحديث تلقائي كل 30 دقيقة</div>
        </div>
    </div>

    <footer>© 2026 Taha-tech2026</footer>
</div>

<script>
    (function() {
        // ==================== 1. قائمة اللغات (>30) ====================
        const languages = [
            { code: 'ar', name: 'العربية', icon: '🇸🇦' }, { code: 'en', name: 'English', icon: '🇬🇧' },
            { code: 'fr', name: 'Français', icon: '🇫🇷' }, { code: 'de', name: 'Deutsch', icon: '🇩🇪' },
            { code: 'es', name: 'Español', icon: '🇪🇸' }, { code: 'it', name: 'Italiano', icon: '🇮🇹' },
            { code: 'pt', name: 'Português', icon: '🇵🇹' }, { code: 'ru', name: 'Русский', icon: '🇷🇺' },
            { code: 'zh-CN', name: '中文 (简体)', icon: '🇨🇳' }, { code: 'zh-TW', name: '中文 (繁體)', icon: '🇹🇼' },
            { code: 'ja', name: '日本語', icon: '🇯🇵' }, { code: 'ko', name: '한국어', icon: '🇰🇷' },
            { code: 'hi', name: 'हिन्दी', icon: '🇮🇳' }, { code: 'tr', name: 'Türkçe', icon: '🇹🇷' },
            { code: 'fa', name: 'فارسی', icon: '🇮🇷' }, { code: 'he', name: 'עברית', icon: '🇮🇱' },
            { code: 'nl', name: 'Nederlands', icon: '🇳🇱' }, { code: 'pl', name: 'Polski', icon: '🇵🇱' },
            { code: 'sv', name: 'Svenska', icon: '🇸🇪' }, { code: 'no', name: 'Norsk', icon: '🇳🇴' },
            { code: 'da', name: 'Dansk', icon: '🇩🇰' }, { code: 'fi', name: 'Suomi', icon: '🇫🇮' },
            { code: 'el', name: 'Ελληνικά', icon: '🇬🇷' }, { code: 'th', name: 'ไทย', icon: '🇹🇭' },
            { code: 'vi', name: 'Tiếng Việt', icon: '🇻🇳' }, { code: 'id', name: 'Bahasa Indonesia', icon: '🇮🇩' },
            { code: 'ms', name: 'Bahasa Melayu', icon: '🇲🇾' }, { code: 'ur', name: 'اردو', icon: '🇵🇰' },
            { code: 'bn', name: 'বাংলা', icon: '🇧🇩' }, { code: 'uk', name: 'Українська', icon: '🇺🇦' }
        ];

        const srcLang = document.getElementById('srcLang');
        const tgtLang = document.getElementById('tgtLang');
        languages.forEach(lang => {
            srcLang.add(new Option(`${lang.icon} ${lang.name}`, lang.code));
            tgtLang.add(new Option(`${lang.icon} ${lang.name}`, lang.code));
        });
        srcLang.value = 'ar'; tgtLang.value = 'en';

        const swapLangBtn = document.getElementById('swapLangBtn');
        swapLangBtn.addEventListener('click', () => {
            let temp = srcLang.value; srcLang.value = tgtLang.value; tgtLang.value = temp;
            if (srcLang.value === tgtLang.value) tgtLang.value = (srcLang.value === 'ar' ? 'en' : 'ar');
        });
        function syncLangs() {
            if (srcLang.value === tgtLang.value) tgtLang.value = (srcLang.value === 'ar' ? 'en' : 'ar');
        }
        srcLang.addEventListener('change', syncLangs);
        tgtLang.addEventListener('change', syncLangs);

        // ==================== 2. الترجمة ====================
        const inputText = document.getElementById('inputText');
        const translateBtn = document.getElementById('translateBtn');
        const translatedResult = document.getElementById('translatedResult');
        async function translate(text, source, target) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                return data?.[0]?.[0]?.[0] || '⚠️ لم يتم العثور على ترجمة.';
            } catch { return '❌ خطأ في الترجمة.'; }
        }
        translateBtn.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (!text) { translatedResult.innerText = '✏️ الرجاء إدخال نص.'; return; }
            translatedResult.innerText = '⏳ جاري الترجمة...';
            translatedResult.innerText = await translate(text, srcLang.value, tgtLang.value);
        });
        inputText.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); translateBtn.click(); } });

        // ==================== 3. الطقس (تقاطع صامت + قائمة اختيار دقيقة) ====================
        const cityInput = document.getElementById('cityInput');
        const countrySelect = document.getElementById('countrySelect');
        const weatherBtn = document.getElementById('weatherBtn');
        const locateBtn = document.getElementById('locateBtn');
        const weatherResult = document.getElementById('weatherResult');
        const forecastContainer = document.getElementById('forecastContainer');
        const weatherExtra = document.getElementById('weatherExtra');
        const autoUpdateBadge = document.getElementById('autoUpdateBadge');
        const mapLinkContainer = document.getElementById('mapLinkContainer');
        const mapLink = document.getElementById('mapLink');
        const locationSelectContainer = document.getElementById('locationSelectContainer');
        const locationSelect = document.getElementById('locationSelect');

        let currentCoords = null, currentCityName = 'دمشق', updateInterval = null, isLocating = false;
        let multipleLocations = [];

        const THRESHOLDS = { temp: 3, humidity: 20, wind: 12, pressure: 6 };
        const FIXED_MARGINS = { temp: 2, humidity: 10, wind: 8, pressure: 3 };

        // ------ (أ) الإحداثيات من Nominatim مع تحسينات للقرى ------
        async function getCoordinatesList(city, countryCode) {
            try {
                // المحاولة الأولى: تحديد settlements فقط
                let url = `https://nominatim.openstreetmap.org/search?format=json&limit=10&accept-language=ar&bounded=1&featuretype=settlement&q=${encodeURIComponent(city)}`;
                if (countryCode) url += `&countrycodes=${countryCode}`;
                let resp = await fetch(url, { headers: { 'User-Agent': 'TahaWeatherApp/1.0' } });
                let data = await resp.json();
                
                // إذا لم تكن هناك نتائج كافية، نحاول بدون featuretype
                if (data.length === 0) {
                    url = `https://nominatim.openstreetmap.org/search?format=json&limit=10&accept-language=ar&bounded=1&q=${encodeURIComponent(city)}`;
                    if (countryCode) url += `&countrycodes=${countryCode}`;
                    resp = await fetch(url, { headers: { 'User-Agent': 'TahaWeatherApp/1.0' } });
                    data = await resp.json();
                }

                return data.map(r => ({
                    lat: parseFloat(r.lat),
                    lon: parseFloat(r.lon),
                    name: r.name || city,
                    display: r.display_name,
                    type: r.type || (r.category || ''),
                    country: r.display_name.split(',').pop().trim()
                }));
            } catch { return []; }
        }

        // ------ (ب) المصدر الثاني: wttr.in ------
        async function fetchWttrWeather(lat, lon) {
            try {
                const url = `https://wttr.in/${lat},${lon}?format=j1`;
                const resp = await fetch(url);
                if (!resp.ok) return null;
                const data = await resp.json();
                const current = data.current_condition[0];
                return {
                    temp: parseInt(current.temp_C),
                    humidity: parseInt(current.humidity),
                    wind: parseInt(current.windspeedKmph),
                    pressure: parseInt(current.pressure)
                };
            } catch { return null; }
        }

        // ------ (ج) المصدر الأساسي: Open-Meteo ------
        async function fetchOpenMeteoWeather(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,surface_pressure,apparent_temperature,visibility,cloudcover,dewpoint_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,weathercode,apparent_temperature_max,apparent_temperature_min&timezone=auto&forecast_days=7`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('فشل جلب البيانات');
                return await resp.json();
            } catch (err) { console.error(err); return null; }
        }

        function getWeatherDesc(code) {
            const map = {
                0:'☀️ صافي',1:'🌤️ غالباً صافي',2:'⛅ غائم جزئياً',3:'☁️ غائم',
                45:'🌫️ ضباب',48:'🌫️ ضباب متجمد',
                51:'🌦️ رذاذ خفيف',53:'🌧️ رذاذ متوسط',55:'🌧️ رذاذ كثيف',
                61:'🌧️ مطر خفيف',63:'🌧️ مطر متوسط',65:'🌧️ مطر غزير',
                71:'❄️ ثلوج خفيفة',73:'❄️ ثلوج متوسطة',75:'❄️ ثلوج كثيفة',
                80:'🌧️ زخات مطر خفيفة',81:'🌧️ زخات مطر متوسطة',82:'🌧️ زخات مطر غزيرة',
                95:'⛈️ عاصفة رعدية',96:'⛈️ عواصف رعدية مع بَرَد خفيف',99:'⛈️ عواصف رعدية مع بَرَد كثيف'
            };
            return map[code] || '🌡️ متغير';
        }
        function getWeatherIcon(code) {
            if (code <= 1) return '☀️';
            if (code === 2) return '⛅';
            if (code === 3) return '☁️';
            if (code >= 45 && code <= 48) return '🌫️';
            if (code >= 51 && code <= 57) return '🌦️';
            if (code >= 61 && code <= 65) return '🌧️';
            if (code >= 71 && code <= 75) return '❄️';
            if (code >= 80 && code <= 82) return '🌧️';
            if (code >= 95 && code <= 99) return '⛈️';
            return '🌡️';
        }

        function buildWeatherItem(label, value, margin) {
            return `<div class="weather-item"><strong>${value}</strong>${label}<span class="margin">±${margin}</span></div>`;
        }

        function displayWeatherData(openMeteoData, wttrData, locationName, country, lat, lon) {
            const cur = openMeteoData.current_weather;
            const hourly = openMeteoData.hourly;
            const daily = openMeteoData.daily;

            const now = new Date().toISOString().slice(0,13)+':00';
            const idx = hourly.time.indexOf(now);
            const omTemp = cur.temperature;
            const omHumidity = (idx !== -1 && hourly.relativehumidity_2m?.[idx] !== undefined) ? hourly.relativehumidity_2m[idx] : null;
            const omWind = cur.windspeed;
            const omPressure = (idx !== -1 && hourly.surface_pressure?.[idx] !== undefined) ? Math.round(hourly.surface_pressure[idx]) : null;
            const omFeelsLike = (idx !== -1 && hourly.apparent_temperature?.[idx] !== undefined) ? Math.round(hourly.apparent_temperature[idx]) : null;
            const omVisibility = (idx !== -1 && hourly.visibility?.[idx] !== undefined) ? (hourly.visibility[idx]/1000).toFixed(1) : null;
            const omCloud = (idx !== -1 && hourly.cloudcover?.[idx] !== undefined) ? hourly.cloudcover[idx] : null;
            const omDew = (idx !== -1 && hourly.dewpoint_2m?.[idx] !== undefined) ? Math.round(hourly.dewpoint_2m[idx]) : null;
            const desc = getWeatherDesc(cur.weathercode || 0);

            function crossCheck(omValue, wttrValue, threshold, fixedMargin, unit = '') {
                if (omValue === null || omValue === undefined) {
                    return { value: 'غير متاح', margin: '-' };
                }
                if (wttrValue !== null && wttrValue !== undefined) {
                    const diff = Math.abs(omValue - wttrValue);
                    if (diff <= threshold) {
                        const avg = (omValue + wttrValue) / 2;
                        const margin = diff / 2;
                        return { value: avg.toFixed(1) + unit, margin: margin.toFixed(1) };
                    } else {
                        return { value: omValue + unit, margin: fixedMargin.toString() };
                    }
                } else {
                    return { value: omValue + unit, margin: fixedMargin.toString() };
                }
            }

            const tempResult = crossCheck(omTemp, wttrData?.temp, THRESHOLDS.temp, FIXED_MARGINS.temp, '°C');
            const humidityResult = crossCheck(omHumidity, wttrData?.humidity, THRESHOLDS.humidity, FIXED_MARGINS.humidity, '%');
            const windResult = crossCheck(omWind, wttrData?.wind, THRESHOLDS.wind, FIXED_MARGINS.wind, ' كم/س');
            const pressureResult = crossCheck(omPressure, wttrData?.pressure, THRESHOLDS.pressure, FIXED_MARGINS.pressure, ' hPa');

            let html = '<div class="weather-details">';
            html += buildWeatherItem('الحرارة', tempResult.value, tempResult.margin);
            html += buildWeatherItem('المحسوسة', omFeelsLike !== null ? omFeelsLike + '°C' : 'غير متاح', '-');
            html += buildWeatherItem('الرطوبة', humidityResult.value, humidityResult.margin);
            html += buildWeatherItem('الرياح', windResult.value, windResult.margin);
            html += buildWeatherItem('الحالة', desc, '-');
            html += buildWeatherItem('الضغط', pressureResult.value, pressureResult.margin);
            html += buildWeatherItem('الرؤية', omVisibility !== null ? omVisibility + ' كم' : 'غير متاح', '2');
            html += buildWeatherItem('الغيوم', omCloud !== null ? omCloud + '%' : 'غير متاح', '15');
            html += buildWeatherItem('نقطة الندى', omDew !== null ? omDew + '°C' : 'غير متاح', '1.5');
            html += '</div>';
            weatherResult.innerHTML = html;

            weatherExtra.innerText = `📍 ${locationName}${country ? '، ' + country : ''} • ${new Date().toLocaleTimeString('ar-SA')}`;
            autoUpdateBadge.style.display = 'inline-block';

            if (lat && lon) {
                mapLink.href = `https://www.google.com/maps?q=${lat},${lon}`;
                mapLinkContainer.style.display = 'block';
                currentCoords = { lat, lon };
                currentCityName = locationName;
            } else {
                mapLinkContainer.style.display = 'none';
            }

            if (daily && daily.time && daily.time.length > 0) {
                let forecastHTML = '<div class="forecast-title">📅 توقعات 7 أيام القادمة</div><div class="forecast-table">';
                const daysAr = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
                for (let i = 0; i < daily.time.length; i++) {
                    const d = new Date(daily.time[i]);
                    const dayName = daysAr[d.getDay()];
                    const code = daily.weathercode[i];
                    const icon = getWeatherIcon(code);
                    const max = daily.temperature_2m_max[i];
                    const min = daily.temperature_2m_min[i];
                    const precip = daily.precipitation_sum[i] || 0;
                    const prob = daily.precipitation_probability_max[i] || 0;
                    forecastHTML += `<div class="forecast-day">
                        <div class="day-name">${dayName}</div>
                        <div>${icon}</div>
                        <div class="temps"><span class="high">${max}°</span><span class="low">${min}°</span></div>
                        <div class="rain">🌧️ ${precip} مم | ${prob}%</div>
                    </div>`;
                }
                forecastHTML += '</div>';
                forecastContainer.innerHTML = forecastHTML;
            } else {
                forecastContainer.innerHTML = '<div class="no-forecast">⚠️ بيانات التوقعات غير متوفرة حاليًا.</div>';
            }
        }

        async function loadWeatherForCoords(lat, lon, cityName, country) {
            const [openMeteoData, wttrData] = await Promise.all([
                fetchOpenMeteoWeather(lat, lon),
                fetchWttrWeather(lat, lon)
            ]);
            if (!openMeteoData || !openMeteoData.current_weather) {
                weatherResult.innerText = '⚠️ فشل جلب بيانات الطقس من المصدر الأساسي.';
                forecastContainer.innerHTML = '';
                mapLinkContainer.style.display = 'none';
                return false;
            }
            displayWeatherData(openMeteoData, wttrData, cityName, country, lat, lon);
            return true;
        }

        // ------ معالجة تضارب الأسماء (مع عرض النوع) ------
        function showLocationSelector(locations) {
            multipleLocations = locations;
            locationSelect.innerHTML = '<option value="">🔽 اختر منطقتك...</option>';
            locations.forEach((loc, index) => {
                const typeLabel = loc.type ? ` [${loc.type}]` : '';
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `📍 ${loc.display}${typeLabel}`;
                locationSelect.appendChild(option);
            });
            locationSelectContainer.style.display = 'block';
            locationSelect.focus();
        }

        function hideLocationSelector() {
            locationSelectContainer.style.display = 'none';
            multipleLocations = [];
        }

        locationSelect.addEventListener('change', async () => {
            const index = locationSelect.value;
            if (index === '') return;
            const loc = multipleLocations[parseInt(index)];
            hideLocationSelector();
            weatherResult.innerText = '⏳ جلب بيانات الطقس...';
            weatherExtra.innerText = ''; forecastContainer.innerHTML = ''; mapLinkContainer.style.display = 'none';
            const success = await loadWeatherForCoords(loc.lat, loc.lon, loc.name, loc.country);
            if (!success) weatherResult.innerText = '⚠️ تعذر جلب الطقس للموقع المختار.';
        });

        async function handleMyLocationRequest() {
            if (!navigator.geolocation) { weatherResult.innerText = '❌ متصفحك لا يدعم تحديد الموقع.'; return; }
            if (isLocating) return;
            isLocating = true;
            locateBtn.disabled = weatherBtn.disabled = true;
            weatherResult.innerHTML = '<span style="color:#1e3c72;">⏳ جاري تحديد موقعك...</span>';
            forecastContainer.innerHTML = ''; mapLinkContainer.style.display = 'none'; hideLocationSelector();
            navigator.geolocation.getCurrentPosition(async pos => {
                const { latitude, longitude } = pos.coords;
                currentCityName = 'موقعك الحالي';
                cityInput.value = 'موقعي'; countrySelect.value = '';
                const ok = await loadWeatherForCoords(latitude, longitude, 'موقعك الحالي', '');
                if (!ok) weatherResult.innerText = '⚠️ تعذر جلب الطقس لموقعك.';
                isLocating = false; locateBtn.disabled = weatherBtn.disabled = false;
            }, err => {
                weatherResult.innerText = '❌ تعذر تحديد الموقع.'; console.error(err);
                isLocating = false; locateBtn.disabled = weatherBtn.disabled = false;
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        async function searchAndDisplayWeather() {
            const city = cityInput.value.trim();
            if (!city) { weatherResult.innerText = '❌ أدخل اسم مدينة أو قرية (أو اكتب "موقعي").'; return; }
            if (city === 'موقعي' || city === 'موقعي الحالي') { await handleMyLocationRequest(); return; }

            hideLocationSelector();
            weatherResult.innerText = '⏳ جلب بيانات الطقس...';
            weatherExtra.innerText = ''; forecastContainer.innerHTML = ''; mapLinkContainer.style.display = 'none';
            locateBtn.disabled = weatherBtn.disabled = false;

            const countryCode = countrySelect.value;
            const locations = await getCoordinatesList(city, countryCode);
            if (locations.length === 0) {
                weatherResult.innerText = `😞 لم يتم العثور على "${city}". جرب اسماً مختلفاً أو أقرب مدينة.`;
                return;
            }
            if (locations.length === 1) {
                const loc = locations[0];
                await loadWeatherForCoords(loc.lat, loc.lon, loc.name, loc.country);
            } else {
                showLocationSelector(locations);
                weatherResult.innerText = '⚠️ توجد عدة مناطق بهذا الاسم. اختر منطقتك من القائمة أعلاه.';
                weatherExtra.innerText = '';
                forecastContainer.innerHTML = '';
            }
        }

        weatherBtn.addEventListener('click', searchAndDisplayWeather);
        cityInput.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); weatherBtn.click(); } });
        locateBtn.addEventListener('click', handleMyLocationRequest);

        function startAutoUpdate() {
            clearInterval(updateInterval);
            updateInterval = setInterval(async () => {
                if (currentCoords && !isLocating) {
                    console.log('🔄 تحديث تلقائي...');
                    await loadWeatherForCoords(currentCoords.lat, currentCoords.lon, currentCityName, '');
                }
            }, 30 * 60 * 1000);
        }
        startAutoUpdate();

        (async () => {
            const coords = await getCoordinatesList('دمشق', 'sy');
            if (coords.length > 0) {
                const loc = coords[0];
                await loadWeatherForCoords(loc.lat, loc.lon, loc.name, loc.country);
            } else {
                weatherResult.innerText = '⚠️ لم يتم العثور على دمشق.';
            }
        })();

        // ==================== 4. Service Worker ====================
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'taha-tech-v1';
                self.addEventListener('install', event => { self.skipWaiting(); });
                self.addEventListener('activate', event => {
                    event.waitUntil(
                        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => self.clients.claim())
                    );
                });
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        fetch(event.request).catch(() => caches.match(event.request))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(reg => {
                console.log('✅ Service Worker مسجل.');
                setInterval(() => reg.update(), 5 * 60 * 1000);
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    });
                });
            }).catch(err => console.warn('⚠️ تعذر تسجيل Service Worker:', err));
        }

        syncLangs();
    })();
</script>
